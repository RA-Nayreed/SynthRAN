model:
  engine: ambient_iot
  seed: 11
  duration_ms: 30000
  energy:
    mode: hybrid
    trace: builtin:stable
    units: uw
    repeat: true
  capacitor:
    capacitance_f: 0.0003
    series_resistance_ohm: 5000
    leakage_resistance_ohm: 100000
    initial_voltage_v: 0
    timestep_seconds: 0.001
  controller:
    low_voltage_v: 1.3
    high_voltage_v: 1.7
  topology:
    frequency_hz: 924000000
    pathloss: macro
    nodes:
      placement:
        type: random_annulus
        min_radius_m: 10
        max_radius_m: 40
    base_station:
      x: 0
      y: 0
      height_m: 25
      sectors:
      - azimuth_deg: 0
        beamwidth_deg: 65
        power_dbm: 46
      - azimuth_deg: 120
        beamwidth_deg: 65
        power_dbm: 46
      - azimuth_deg: 240
        beamwidth_deg: 65
        power_dbm: 46
  propagation:
    model: macro
    los: true
  protocol:
    type: broadcast_sic
    slots: 8
    tx_duration_ms: 5
    rx_duration_ms: 10
  receiver:
    sic: true
    required_sinr_db: 3
    cancellation_factor: 0.9
mqtt:
  port: 1883
  qos: 1
  topic_prefix: synthran/sidecars
  payload_bytes: 256
  start_delay_seconds: 30
devices:
  uesim01:
    energy_mode: wpt
    sensing_interval_ms: 1000
  uesim02:
    energy_mode: hybrid
    sensing_interval_ms: 750
  uesim03:
    energy_mode: hybrid
    sensing_interval_ms: 500
