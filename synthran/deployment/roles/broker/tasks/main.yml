---
- name: Install broker and Python runtime
  package:
    name: [mosquitto, python3, python3-pip, python3-venv]
    state: present

- name: Validate the experiment MQTT namespace
  ansible.builtin.assert:
    quiet: true
    that:
      - (mqtt_port | int) >= 1
      - (mqtt_port | int) <= 65535
      - mqtt_topic_prefix is match('^[A-Za-z0-9][A-Za-z0-9_.\/-]*$')
      - mqtt_publisher_username is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
      - mqtt_collector_username is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    fail_msg: Refusing an unsafe MQTT listener, username, or topic namespace.

- name: Resolve the configured N6 MQTT endpoint
  ansible.builtin.set_fact:
    synthran_mqtt_listener_endpoint: >-
      {{ mqtt_broker_address if mqtt_broker_address else ansible_default_ipv4.address }}

- name: Resolve the N6 MQTT endpoint to IPv4
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ synthran_mqtt_listener_endpoint }}"]
  register: synthran_mqtt_listener_lookup
  changed_when: false

- name: Record the N6 MQTT listener address
  ansible.builtin.set_fact:
    synthran_mqtt_listener_address: "{{ synthran_mqtt_listener_lookup.stdout_lines[0].split()[0] }}"

- name: Require the MQTT listener to bind a local N6 address
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_mqtt_listener_address in ansible_all_ipv4_addresses
    fail_msg: >-
      The MQTT broker endpoint resolves outside this broker host; refusing a
      wildcard or non-local listener.

- name: Copy SynthRAN package
  copy: {src: "{{ run_dir }}/runtime/", dest: /opt/synthran-source/}

- name: Create isolated SynthRAN runtime
  command: python3 -m venv /opt/synthran-venv
  args: {creates: /opt/synthran-venv/bin/python}

- name: Install the exact MQTT collector dependency
  command: /opt/synthran-venv/bin/pip install --disable-pip-version-check --no-input "paho-mqtt==2.1.0"

- name: Verify the exact MQTT collector dependency
  command: >-
    /opt/synthran-venv/bin/python -c
    "import importlib.metadata; assert importlib.metadata.version('paho-mqtt') == '2.1.0'"
  changed_when: false

- name: Verify the collector does not require the numerical model runtime
  command: /opt/synthran-venv/bin/python -c "from Experiment.workload.replay import collect"
  environment:
    PYTHONPATH: /opt/synthran-source
  changed_when: false

- name: Create the unprivileged SynthRAN MQTT service account
  ansible.builtin.user:
    name: synthran-mqtt
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the private collector credential directory
  ansible.builtin.file:
    path: /etc/synthran
    state: directory
    owner: synthran-mqtt
    group: synthran-mqtt
    mode: '0700'

- name: Install Mosquitto password hashes
  ansible.builtin.copy:
    dest: /etc/mosquitto/synthran.passwd
    owner: root
    group: mosquitto
    mode: '0640'
    content: |
      {{ mqtt_publisher_username }}:{{ mqtt_publisher_password_hash }}
      {{ mqtt_collector_username }}:{{ mqtt_collector_password_hash }}
  no_log: true
  notify: Restart Mosquitto

- name: Install least-privilege MQTT ACLs
  ansible.builtin.copy:
    dest: /etc/mosquitto/synthran.acl
    owner: root
    group: mosquitto
    mode: '0640'
    content: |
      user {{ mqtt_publisher_username }}
      topic write {{ mqtt_topic_prefix }}/#

      user {{ mqtt_collector_username }}
      topic read {{ mqtt_topic_prefix }}/#
  notify: Restart Mosquitto

- name: Install the collector password outside process arguments
  ansible.builtin.copy:
    dest: /etc/synthran/mqtt-collector-password
    owner: synthran-mqtt
    group: synthran-mqtt
    mode: '0600'
    content: "{{ mqtt_collector_password }}\n"
  no_log: true

- name: Configure the authenticated N6-side MQTT listener
  ansible.builtin.copy:
    dest: /etc/mosquitto/conf.d/synthran.conf
    owner: root
    group: mosquitto
    mode: '0640'
    content: |
      listener {{ mqtt_port }} {{ synthran_mqtt_listener_address }}
      allow_anonymous false
      password_file /etc/mosquitto/synthran.passwd
      acl_file /etc/mosquitto/synthran.acl
  notify: Restart Mosquitto

- name: Create private broker artifact directory
  ansible.builtin.file:
    path: /var/log/synthran
    state: directory
    owner: synthran-mqtt
    group: synthran-mqtt
    mode: '0750'

- name: Discover existing receipt collector service
  service_facts:

- name: Stop any previous receipt collector
  systemd: {name: synthran-collector, state: stopped}
  when: "'synthran-collector.service' in ansible_facts.services"

- name: Remove the current run subscription-ready marker
  file:
    path: "/var/log/synthran/collector-ready-{{ run_dir | basename }}.json"
    state: absent

- name: Initialize the current run receipt artifact
  copy:
    content: ""
    dest: "/var/log/synthran/receipts-{{ run_dir | basename }}.jsonl"
    owner: synthran-mqtt
    group: synthran-mqtt
    mode: '0600'
    force: true

- name: Start broker before collector
  service: {name: mosquitto, state: started, enabled: true}

- name: Apply pending broker configuration
  meta: flush_handlers

- name: Wait for the bound N6-side broker listener
  wait_for:
    host: "{{ synthran_mqtt_listener_address }}"
    port: "{{ mqtt_port }}"
    timeout: 30

- name: Install receipt collector unit
  copy:
    dest: /etc/systemd/system/synthran-collector.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      After=mosquitto.service
      Requires=mosquitto.service
      [Service]
      User=synthran-mqtt
      Group=synthran-mqtt
      Environment=PYTHONPATH=/opt/synthran-source
      ExecStart=/opt/synthran-venv/bin/python -m Experiment.cli workload collect --broker {{ synthran_mqtt_listener_address }} --port {{ mqtt_port }} --topic {{ mqtt_topic_prefix }}/# --username {{ mqtt_collector_username }} --password-file /etc/synthran/mqtt-collector-password --output /var/log/synthran/receipts-{{ run_dir | basename }}.jsonl --ready-file /var/log/synthran/collector-ready-{{ run_dir | basename }}.json
      Restart=on-failure
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      [Install]
      WantedBy=multi-user.target

- name: Start receipt collector
  systemd: {name: synthran-collector, daemon_reload: true, state: restarted, enabled: true}

- name: Verify receipt collector is active
  command: systemctl is-active synthran-collector
  changed_when: false

- name: Require a successful receiving subscription before replay
  wait_for:
    path: "/var/log/synthran/collector-ready-{{ run_dir | basename }}.json"
    state: present
    timeout: 30

- name: Retain the receiving subscription evidence
  fetch:
    src: "/var/log/synthran/collector-ready-{{ run_dir | basename }}.json"
    dest: "{{ run_dir }}/collector-ready.json"
    flat: true
