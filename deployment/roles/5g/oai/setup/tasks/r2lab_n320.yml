---
- name: Configure the R2Lab N320 RU with a static pod-side address
  ansible.builtin.lineinfile:
    path: "{{ repo_dest }}/rru/n320.env"
    regexp: '^IP_GNB_RU='
    line: 'IP_GNB_RU="{{ oai_r2lab_n320_ru_ip }}"'

- name: Match the N320 RU MTU to the R2Lab parent interface
  ansible.builtin.lineinfile:
    path: "{{ repo_dest }}/rru/n320.env"
    regexp: '^MTU_GNB_RU='
    line: 'MTU_GNB_RU="{{ oai_r2lab_n320_ru_mtu }}"'

- name: Configure the validated N320 MPM and RFNoC endpoint before Helm rendering
  ansible.builtin.replace:
    path: "{{ repo_dest }}/rru/n320.env"
    regexp: 'mgmt_addr=[0-9.]+,addr=[0-9.]+'
    replace: 'mgmt_addr={{ oai_r2lab_n320_sdr_ip }},addr={{ oai_r2lab_n320_sdr_ip }}'

- name: Select ipvlan for the R2Lab N320 RU attachment
  ansible.builtin.replace:
    path: "{{ item }}"
    after: '^- name: "ru"$'
    regexp: '^  type: macvlan$'
    replace: '  type: {{ oai_r2lab_n320_ru_cni_type }}'
  loop:
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-gnb.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-f1only.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-cucpup.yaml"

- name: Select ipvlan L2 mode for the R2Lab N320 RU attachment
  ansible.builtin.replace:
    path: "{{ item }}"
    after: '^- name: "ru"$'
    regexp: '^  mode: "bridge"$'
    replace: '  mode: "{{ oai_r2lab_n320_ru_cni_mode }}"'
  loop:
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-gnb.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-f1only.yaml"
    - "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-cucpup.yaml"

- name: Teach the staged OAI NAD templates to render ipvlan interfaces
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - "{{ item }}" <<'PY'
    from pathlib import Path
    import sys

    path = Path(sys.argv[1])
    text = path.read_text()
    braces_open = chr(123) * 2
    braces_close = chr(125) * 2
    old_guard = braces_open + '- if eq .type "macvlan" ' + braces_close
    new_guard = braces_open + '- if or (eq .type "macvlan") (eq .type "ipvlan") ' + braces_close
    old_type = '"type": "macvlan",'
    new_type = '"type": "' + braces_open + ' .type ' + braces_close + '",'
    if old_guard not in text:
        raise SystemExit(f"macvlan guard not found in {path}")
    if old_type not in text:
        raise SystemExit(f"macvlan plugin type not found in {path}")
    path.write_text(text.replace(old_guard, new_guard, 1).replace(old_type, new_type, 1))
    PY
  args:
    executable: /bin/bash
  loop:
    - "{{ repo_dest }}/demo_charts/templates/oai-gnb/nad.yaml"
    - "{{ repo_dest }}/demo_charts/templates/oai-du/nad.yaml"

- name: Verify the staged R2Lab N320 transport contract
  ansible.builtin.shell: |
    set -euo pipefail
    grep -F 'IP_GNB_RU="{{ oai_r2lab_n320_ru_ip }}"' "{{ repo_dest }}/rru/n320.env"
    grep -F 'MTU_GNB_RU="{{ oai_r2lab_n320_ru_mtu }}"' "{{ repo_dest }}/rru/n320.env"
    grep -F 'mgmt_addr={{ oai_r2lab_n320_sdr_ip }},addr={{ oai_r2lab_n320_sdr_ip }}' "{{ repo_dest }}/rru/n320.env"
    for file in \
      "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-gnb.yaml" \
      "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du.yaml" \
      "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-f1only.yaml" \
      "{{ repo_dest }}/demo_charts/values/nf-ifs/oai-du-cucpup.yaml"; do
      awk '/^- name: "ru"$/{in_ru=1} in_ru{print}' "$file" | grep -F '  type: {{ oai_r2lab_n320_ru_cni_type }}'
      awk '/^- name: "ru"$/{in_ru=1} in_ru{print}' "$file" | grep -F '  mode: "{{ oai_r2lab_n320_ru_cni_mode }}"'
    done
    grep -F 'eq .type "ipvlan"' "{{ repo_dest }}/demo_charts/templates/oai-gnb/nad.yaml"
    grep -F 'eq .type "ipvlan"' "{{ repo_dest }}/demo_charts/templates/oai-du/nad.yaml"
  args:
    executable: /bin/bash
  changed_when: false
