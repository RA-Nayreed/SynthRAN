---
- name: Load 5G profile variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/all/5g_profile_{{ fiveg_profile | default('default') }}.yaml"

- name: Ensure 5G config directory exists
  file:
    path: /etc/oai
    state: directory
    mode: '0755'

- name: Report the selected OAI PLMN
  debug:
    msg: "PLMN={{ plmn }}"
    
- name: Render 5G environment file
  template:
    src: 5g-env.sh.j2
    dest: /etc/oai/5g-env.sh
    mode: '0644'
  register: fiveg_env

- name: Report updated OAI parameters
  debug:
    msg: "5G parameters updated"
  when: fiveg_env.changed

