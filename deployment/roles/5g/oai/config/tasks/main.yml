---
- name: Load resolved network profile variables
  ansible.builtin.include_vars:
    file: "{{ network_profile_file }}"

- name: Ensure 5G config directory exists
  ansible.builtin.file:
    path: /etc/oai
    state: directory
    mode: '0755'

- name: Report the selected OAI PLMN
  ansible.builtin.debug:
    msg: "PLMN={{ plmn }}"

- name: Render network environment file
  ansible.builtin.template:
    src: 5g-env.sh.j2
    dest: /etc/oai/5g-env.sh
    mode: '0644'
  register: network_env

- name: Report updated OAI network parameters
  ansible.builtin.debug:
    msg: "Network parameters updated"
  when: network_env.changed
