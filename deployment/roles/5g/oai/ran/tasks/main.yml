---
- name: Remove previous OAI RAN deployment if any
  ansible.builtin.command: "{{ demo_oai_script }} stop-ran"
  args:
    chdir: "{{ repo_dest }}"

- name: Launch OAI gNB pod
  ansible.builtin.command: "{{ demo_oai_script }} start-gnb"
  args:
    chdir: "{{ repo_dest }}"
  register: gnb_script
  changed_when: "'When you finish' in gnb_script.stdout"

- name: Verify N3xx gNB RF-device readiness
  block:
    - name: Set RAN pod selector and container based on OAI mode
      ansible.builtin.set_fact:
        pod_label_selector: >-
          {% if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] %}
          app.kubernetes.io/name=oai-du,app.kubernetes.io/instance=oai-du
          {% else %}
          app.kubernetes.io/name=oai-gnb,app.kubernetes.io/instance=oai-gnb
          {% endif %}
        ran_container_name: >-
          {{ 'du' if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] else 'gnb' }}

    - name: Wait for the gNB to open the N3xx RF device
      ansible.builtin.shell: |
        set -o pipefail
        GNB_POD_NAME="$(kubectl get pods --namespace {{ core }} \
          -l "{{ pod_label_selector }}" \
          -o jsonpath='{.items[0].metadata.name}')"
        test -n "$GNB_POD_NAME"
        kubectl wait --namespace {{ core }} \
          --for=condition=Ready "pod/${GNB_POD_NAME}" --timeout=5s >/dev/null
        kubectl logs --namespace {{ core }} "$GNB_POD_NAME" -c {{ ran_container_name }} \
          | grep -E 'RU [0-9]+ rf device ready'
      args:
        executable: /bin/bash
      register: gnb_rf_ready
      until: gnb_rf_ready.rc == 0
      retries: 12
      delay: 10
      changed_when: false
      failed_when: false

    - name: Retry N3xx RF initialization after swapping the USRP IP
      when: gnb_rf_ready.rc != 0
      block:
        - name: Stop gNB after failed RF-device initialization
          ansible.builtin.command: "{{ demo_oai_script }} stop-gnb"
          args:
            chdir: "{{ repo_dest }}"

        - name: Swap USRP IP address
          ansible.builtin.include_role:
            name: 5g/oai/ran/n3xx_ip_swap

        - name: Require the fallback to select a different USRP endpoint
          ansible.builtin.assert:
            quiet: true
            that:
              - (current_ip_cmd.stdout | trim | length) > 0
              - (new_usrp_ip | trim | length) > 0
              - (current_ip_cmd.stdout | trim) != (new_usrp_ip | trim)
            fail_msg: >-
              N3xx RF initialization failed, but the pinned IP-swap fallback could not
              select a different USRP endpoint from {{ current_ip_cmd.stdout | trim }}.

        - name: Verify the swapped USRP endpoint in both OAI RAN charts
          ansible.builtin.command:
            argv:
              - grep
              - -F
              - "mgmt_addr={{ new_usrp_ip | trim }},addr={{ new_usrp_ip | trim }}"
              - "{{ item }}"
          loop: "{{ target_files }}"
          changed_when: false

        - name: Restart OAI gNB pod with the swapped USRP endpoint
          ansible.builtin.command: "{{ demo_oai_script }} start-gnb"
          args:
            chdir: "{{ repo_dest }}"

        - name: Re-check that the gNB opens the N3xx RF device
          ansible.builtin.shell: |
            set -o pipefail
            GNB_POD_NAME="$(kubectl get pods --namespace {{ core }} \
              -l "{{ pod_label_selector }}" \
              -o jsonpath='{.items[0].metadata.name}')"
            test -n "$GNB_POD_NAME"
            kubectl wait --namespace {{ core }} \
              --for=condition=Ready "pod/${GNB_POD_NAME}" --timeout=5s >/dev/null
            kubectl logs --namespace {{ core }} "$GNB_POD_NAME" -c {{ ran_container_name }} \
              | grep -E 'RU [0-9]+ rf device ready'
          args:
            executable: /bin/bash
          register: gnb_rf_ready_retry
          until: gnb_rf_ready_retry.rc == 0
          retries: 12
          delay: 10
          changed_when: false
          failed_when: false

        - name: Require N3xx RF-device readiness after the fallback
          ansible.builtin.assert:
            quiet: true
            that:
              - gnb_rf_ready_retry.rc == 0
            fail_msg: >-
              The OAI RAN pod became available but did not report successful N3xx RF-device
              initialization after trying both configured USRP endpoints. Failure diagnostics
              will retain the RAN logs; do not treat a missing pre-UE Frame.Slot line as the
              synchronization criterion.
  when: rru in ['n300', 'n320']

- name: Launch OAI NR-UE pods for RFSIM
  ansible.builtin.command: "{{ demo_oai_script }} {{ ue_cmd }}"
  args:
    chdir: "{{ repo_dest }}"
  loop: "{{ range(1, ue_count + 1) | list }}"
  loop_control:
    loop_var: ue_index
  vars:
    ue_cmd: >-
      {{ 'start-nr-ue' if ue_index == 1 else 'start-nr-ue' ~ ue_index }}
  register: nr_ue_scripts
  changed_when: "'condition met' in nr_ue_scripts.stdout"
  when: rru == 'rfsim'
