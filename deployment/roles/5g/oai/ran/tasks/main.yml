---
- name: Remove previous OAI RAN deployment if any
  ansible.builtin.command: "{{ demo_oai_script }} stop-ran"
  args:
    chdir: "{{ repo_dest }}"

- name: Select the expected OAI RAN release
  ansible.builtin.set_fact:
    oai_ran_release_name: "{{ 'oai-du' if (oai_gnb_mode | default('monolithic')) in ['cudu', 'cucpup'] else 'oai-gnb' }}"

- name: Prepare the Helm-owned R2Lab N320 RU attachment
  ansible.builtin.include_tasks: r2lab_n320_chart.yml
  when:
    - platform == 'r2lab'
    - rru == 'n320'

- name: Launch OAI gNB pod
  ansible.builtin.command: "{{ demo_oai_script }} start-gnb"
  args:
    chdir: "{{ repo_dest }}"
  register: gnb_script
  changed_when: true
  failed_when: false

- name: Classify the OAI launch result
  ansible.builtin.set_fact:
    oai_start_wait_timeout: >-
      {{
        gnb_script.rc != 0 and
        'timed out waiting for the condition' in
        ((gnb_script.stdout | default('')) ~ '\n' ~ (gnb_script.stderr | default('')))
      }}

- name: Inspect the RAN Helm release after an upstream readiness timeout
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ oai_ran_release_name }}"
      - --namespace
      - "{{ core }}"
      - --output
      - json
  register: oai_start_helm_status
  changed_when: false
  failed_when: false
  when:
    - rru in ['n300', 'n320']
    - oai_start_wait_timeout | bool

- name: Inspect the RAN workload after an upstream readiness timeout
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - deployment
      - "{{ oai_ran_release_name }}"
      - --namespace
      - "{{ core }}"
      - -o
      - name
  register: oai_start_workload
  changed_when: false
  failed_when: false
  when:
    - rru in ['n300', 'n320']
    - oai_start_wait_timeout | bool

- name: Classify the timed-out Helm release state
  ansible.builtin.set_fact:
    oai_start_helm_deployed: >-
      {{
        (oai_start_helm_status.rc | default(1)) == 0 and
        ((oai_start_helm_status.stdout | from_json).info.status | default('')) == 'deployed'
      }}
  when:
    - rru in ['n300', 'n320']
    - oai_start_wait_timeout | bool
    - (oai_start_helm_status.rc | default(1)) == 0

- name: Require a valid OAI launch result
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        gnb_script.rc == 0 or
        (
          rru in ['n300', 'n320'] and
          (oai_start_wait_timeout | bool) and
          (oai_start_helm_deployed | default(false) | bool) and
          (oai_start_workload.rc | default(1)) == 0
        )
    fail_msg: >-
      OAI start-gnb failed before SynthRAN could perform its RF readiness gate.
      rc={{ gnb_script.rc }}; expected release={{ oai_ran_release_name }}.
      A kubectl readiness timeout is tolerated only for N3xx when Helm reports
      the expected release as deployed and its Deployment exists.

- name: Verify N3xx gNB RF-device readiness
  block:
    - name: Set RAN pod selector and container based on OAI mode
      ansible.builtin.set_fact:
        pod_label_selector: "{{ 'app.kubernetes.io/name=oai-du,app.kubernetes.io/instance=oai-du' if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] else 'app.kubernetes.io/name=oai-gnb,app.kubernetes.io/instance=oai-gnb' }}"
        ran_container_name: "{{ 'du' if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] else 'gnb' }}"

    - name: Wait for the gNB to open the N3xx RF device
      ansible.builtin.shell: |
        set -o pipefail
        GNB_POD_NAME="$(kubectl get pods --namespace {{ core }} \
          -l "{{ pod_label_selector }}" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1:].metadata.name}')"
        test -n "$GNB_POD_NAME"
        kubectl logs --namespace {{ core }} "$GNB_POD_NAME" -c {{ ran_container_name }} \
          | grep -E 'RU [0-9]+ rf device ready'
      args:
        executable: /bin/bash
      register: gnb_rf_ready
      until: gnb_rf_ready.rc == 0
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false

    - name: Require N3xx RF-device readiness
      ansible.builtin.assert:
        quiet: true
        that:
          - gnb_rf_ready.rc == 0
        fail_msg: >-
          The OAI RAN did not report successful N3xx RF-device initialization.
          Inspect the newest RAN pod logs. For R2Lab N320, SynthRAN validates the
          Helm-rendered ipvlan RU attachment before the release is launched.
  when: rru in ['n300', 'n320']

- name: Attest the live R2Lab N320 transport after RF readiness
  ansible.builtin.include_tasks: r2lab_n320_attest.yml
  when:
    - platform == 'r2lab'
    - rru == 'n320'

- name: Launch OAI NR-UE pods for RFSIM
  ansible.builtin.command: "{{ demo_oai_script }} {{ ue_cmd }}"
  args:
    chdir: "{{ repo_dest }}"
  loop: "{{ range(1, ue_count + 1) | list }}"
  loop_control:
    loop_var: ue_index
  vars:
    ue_cmd: >-
      {{ 'start-nr-ue' if ue_index == 1 else 'start-nr-ue' ~ ue_index }}
  register: nr_ue_scripts
  changed_when: "'condition met' in nr_ue_scripts.stdout"
  when: rru == 'rfsim'
