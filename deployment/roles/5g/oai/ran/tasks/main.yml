---
- name: Remove previous OAI RAN deployment if any
  ansible.builtin.command: "{{ demo_oai_script }} stop-ran"
  args:
    chdir: "{{ repo_dest }}"

- name: Prepare the Helm-owned R2Lab N320 RU attachment
  ansible.builtin.include_tasks: r2lab_n320_chart.yml
  when:
    - platform == 'r2lab'
    - rru == 'n320'

- name: Launch OAI gNB pod
  ansible.builtin.command: "{{ demo_oai_script }} start-gnb"
  args:
    chdir: "{{ repo_dest }}"
  register: gnb_script
  changed_when: "'When you finish' in gnb_script.stdout"
  failed_when:
    - gnb_script.rc != 0
    - "'timed out waiting for the condition' not in (gnb_script.stderr | default(''))"

- name: Verify N3xx gNB RF-device readiness
  block:
    - name: Set RAN pod selector and container based on OAI mode
      ansible.builtin.set_fact:
        pod_label_selector: "{{ 'app.kubernetes.io/name=oai-du,app.kubernetes.io/instance=oai-du' if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] else 'app.kubernetes.io/name=oai-gnb,app.kubernetes.io/instance=oai-gnb' }}"
        ran_container_name: "{{ 'du' if (oai_gnb_mode | default('')) in ['cudu', 'cucpup'] else 'gnb' }}"

    - name: Wait for the gNB to open the N3xx RF device
      ansible.builtin.shell: |
        set -o pipefail
        GNB_POD_NAME="$(kubectl get pods --namespace {{ core }} \
          -l "{{ pod_label_selector }}" \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[-1:].metadata.name}')"
        test -n "$GNB_POD_NAME"
        kubectl logs --namespace {{ core }} "$GNB_POD_NAME" -c {{ ran_container_name }} \
          | grep -E 'RU [0-9]+ rf device ready'
      args:
        executable: /bin/bash
      register: gnb_rf_ready
      until: gnb_rf_ready.rc == 0
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false

    - name: Require N3xx RF-device readiness
      ansible.builtin.assert:
        quiet: true
        that:
          - gnb_rf_ready.rc == 0
        fail_msg: >-
          The OAI RAN did not report successful N3xx RF-device initialization.
          Inspect the newest RAN pod logs. For R2Lab N320, SynthRAN validates the
          Helm-rendered ipvlan RU attachment before the release is launched.
  when: rru in ['n300', 'n320']

- name: Launch OAI NR-UE pods for RFSIM
  ansible.builtin.command: "{{ demo_oai_script }} {{ ue_cmd }}"
  args:
    chdir: "{{ repo_dest }}"
  loop: "{{ range(1, ue_count + 1) | list }}"
  loop_control:
    loop_var: ue_index
  vars:
    ue_cmd: >-
      {{ 'start-nr-ue' if ue_index == 1 else 'start-nr-ue' ~ ue_index }}
  register: nr_ue_scripts
  changed_when: "'condition met' in nr_ue_scripts.stdout"
  when: rru == 'rfsim'
