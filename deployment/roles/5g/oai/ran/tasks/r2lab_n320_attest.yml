---
- name: Attest the live R2Lab N320 transport and image identity
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - \
      "{{ core }}" \
      "{{ oai_ran_release_name }}" \
      "{{ ran_container_name }}" \
      "{{ oai_r2lab_n320_ru_parent }}" \
      "{{ oai_r2lab_n320_ru_cni_type }}" \
      "{{ oai_r2lab_n320_ru_cni_mode }}" \
      "{{ oai_r2lab_n320_ru_ip }}/{{ oai_r2lab_n320_ru_prefix }}" \
      "{{ oai_r2lab_n320_ru_mtu }}" \
      "{{ oai_r2lab_n320_sdr_ip }}" <<'PY'
    import json
    import pathlib
    import subprocess
    import sys

    namespace, release, container, parent, cni_type, cni_mode, ru_address, ru_mtu, sdr_ip = sys.argv[1:]
    expected_mtu = int(ru_mtu)

    def kubectl(*args):
        return subprocess.check_output(['kubectl', *args], text=True)

    deployment = json.loads(kubectl('-n', namespace, 'get', 'deployment', release, '-o', 'json'))
    nad_name = f'{release}-ru'
    nad = json.loads(kubectl('-n', namespace, 'get', 'network-attachment-definition', nad_name, '-o', 'json'))
    nad_config = json.loads(nad['spec']['config'])
    plugin = nad_config['plugins'][0]

    env = {}
    pod_spec = deployment['spec']['template']['spec']
    for group in ('initContainers', 'containers'):
        for item in pod_spec.get(group, []) or []:
            for variable in item.get('env', []) or []:
                if 'value' in variable:
                    env[variable.get('name', '')] = variable['value']
    sdr_addrs = env.get('SDR_ADDRS', '')
    sdr_fields = dict(
        field.split('=', 1)
        for field in sdr_addrs.split(',')
        if '=' in field
    )

    pods = json.loads(kubectl(
        '-n', namespace, 'get', 'pods',
        '-l', f'app.kubernetes.io/instance={release}', '-o', 'json'
    )).get('items', [])
    if not pods:
        raise SystemExit(f'no pod found for release {release!r}')
    pod = max(pods, key=lambda item: item.get('metadata', {}).get('creationTimestamp', ''))
    pod_name = pod['metadata']['name']
    pod_uid = pod['metadata']['uid']

    if pod.get('status', {}).get('phase') != 'Running':
        raise SystemExit(f'RAN pod is not Running: {pod.get("status", {}).get("phase")!r}')
    ready = next(
        (
            condition.get('status') == 'True'
            for condition in pod.get('status', {}).get('conditions', [])
            if condition.get('type') == 'Ready'
        ),
        False,
    )
    if not ready:
        raise SystemExit(f'RAN pod {pod_name} is not Ready')

    network_status_raw = pod.get('metadata', {}).get('annotations', {}).get(
        'k8s.v1.cni.cncf.io/network-status', '[]'
    )
    network_status = json.loads(network_status_raw)
    ru_status = next(
        (
            item for item in network_status
            if item.get('interface') == 'ru' or item.get('name', '').endswith(f'/{nad_name}')
        ),
        None,
    )
    if ru_status is None:
        raise SystemExit(f'RU network status missing on pod {pod_name}')

    statuses = pod.get('status', {}).get('containerStatuses', []) or []
    container_status = next((item for item in statuses if item.get('name') == container), None)
    if container_status is None:
        raise SystemExit(f'container status {container!r} missing on pod {pod_name}')
    if not container_status.get('ready', False):
        raise SystemExit(f'RAN container {container!r} is not Ready')
    restart_count = int(container_status.get('restartCount', 0))
    if restart_count != 0:
        raise SystemExit(f'RAN container restarted during startup: restartCount={restart_count}')
    image_id = container_status.get('imageID', '')

    parent_mac = pathlib.Path(f'/sys/class/net/{parent}/address').read_text().strip().lower()
    parent_mtu = int(pathlib.Path(f'/sys/class/net/{parent}/mtu').read_text().strip())
    live_ru_mtu = int(kubectl(
        '-n', namespace, 'exec', pod_name, '-c', container, '--',
        'cat', '/sys/class/net/ru/mtu'
    ).strip())
    ru_mac = str(ru_status.get('mac', '')).lower()
    ru_ip = ru_address.split('/', 1)[0]

    expected_plugin = {
        'type': cni_type,
        'master': parent,
        'mode': cni_mode,
        'address': ru_address,
    }
    actual_plugin = {
        'type': plugin.get('type'),
        'master': plugin.get('master'),
        'mode': plugin.get('mode'),
        'address': plugin.get('ipam', {}).get('addresses', [{}])[0].get('address'),
    }
    if actual_plugin != expected_plugin:
        raise SystemExit(f'live N320 NAD mismatch: expected={expected_plugin!r} actual={actual_plugin!r}')
    if sdr_fields.get('mgmt_addr') != sdr_ip or sdr_fields.get('addr') != sdr_ip:
        raise SystemExit(f'live N320 SDR_ADDRS mismatch: {sdr_addrs!r}')
    if ru_ip not in (ru_status.get('ips') or []):
        raise SystemExit(f'live N320 RU address missing: expected={ru_ip!r} status={ru_status!r}')
    if ru_mac != parent_mac:
        raise SystemExit(f'live N320 ipvlan MAC mismatch: parent={parent_mac!r} ru={ru_mac!r}')
    if parent_mtu != expected_mtu or live_ru_mtu != expected_mtu:
        raise SystemExit(
            f'live N320 MTU mismatch: expected={expected_mtu} parent={parent_mtu} ru={live_ru_mtu}'
        )
    if 'sha256:' not in image_id:
        raise SystemExit(f'live OAI imageID is not digest-qualified: {image_id!r}')

    print(json.dumps({
        'schema_version': 1,
        'release': release,
        'pod': pod_name,
        'pod_uid': pod_uid,
        'container': container,
        'restart_count': restart_count,
        'nad': nad_name,
        'ru': {
            'type': actual_plugin['type'],
            'master': actual_plugin['master'],
            'mode': actual_plugin['mode'],
            'address': actual_plugin['address'],
            'mac': ru_mac,
            'mtu': live_ru_mtu,
        },
        'sdr_addrs': sdr_addrs,
        'image': container_status.get('image', ''),
        'imageID': image_id,
    }, sort_keys=True))
    PY
  args:
    executable: /bin/bash
  register: oai_n320_runtime_attestation
  changed_when: false

- name: Ensure the run provenance directory exists for N320 attestation
  ansible.builtin.file:
    path: "{{ run_dir }}/provenance"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Retain the R2Lab N320 runtime attestation
  ansible.builtin.copy:
    dest: "{{ run_dir }}/provenance/oai-n320-runtime.json"
    content: "{{ (oai_n320_runtime_attestation.stdout | from_json) | to_nice_json }}"
    mode: '0644'
  delegate_to: localhost
  become: false
