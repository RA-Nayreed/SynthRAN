---

- name: Check if ansible venv python exists
  ansible.builtin.stat:
    path: /opt/ansible-venv/bin/python
  register: venv_python

- name: Use the shared Kubernetes-enabled Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
  when: venv_python.stat.exists

- name: Load common variables
  include_vars:
    file: "../../common/defaults/main.yml"

- name: Remove existing srsRAN Helm directory to ensure clean state
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    state: absent

- name: Clone repo srsRAN
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ version | default('main') }}"
    update: no
    force: yes

- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ran_ns }}"
    state: present

- name: Gather env facts (remote)
  ansible.builtin.setup:
    filter: ansible_env
  when: ansible_env is not defined

- name: Normalize repo_dest to remote HOME
  ansible.builtin.set_fact:
    repo_dest_abs: "{{ (repo_dest | default('~/srsran-helm') | trim)
                       | regex_replace('^~/?', ansible_env.HOME ~ '/') }}"

- name: Select values filename from rru
  ansible.builtin.set_fact:
    values_filename: "{{ rru_file_map[(rru | default('rfsim') | string | trim | lower)] | default('values.yaml') }}"
  vars:
    rru_file_map:
      benetel1: values-benetel1.yaml
      benetel2: values-benetel2.yaml
      liteon: values-liteon.yaml
      n300: values-n300-n78-20MHz.yaml # values-n300.yaml is original FDD, band 3
      n320: values-n320-n78-20MHz.yaml # values-n320.yaml is original FDD, band 3
      rfsim: values-rfsim.yaml

- name: Build absolute values_file path
  ansible.builtin.set_fact:
    values_file: "{{ [repo_dest_abs, 'charts', 'srsran-gnb', values_filename] | path_join }}"

- name: Report the srsRAN configuration paths
  ansible.builtin.debug:
    msg:
      - "repo_dest_abs='{{ repo_dest_abs }}'"
      - "values_file='{{ values_file }}'"

- name: Ensure values file exists (remote)
  ansible.builtin.stat:
    path: "{{ values_file }}"
  register: values_stat

- name: Fail if values file missing
  ansible.builtin.fail:
    msg: "Values file not found: {{ values_file }}"
  when: not values_stat.stat.exists

- name: Patch n3 NAD MTU for free5gc split-node scenario
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ n3networkName }}"
        namespace: "{{ ran_ns }}"
      spec:
        config: >-
          { "cniVersion": "0.3.1", "plugins": [ { "type": "ovs",
            "capabilities": { "ips": true }, "bridge": "n3br",
            "mtu": 1450,
            "ipam": { "type": "static", "routes": [ { "dst": "0.0.0.0/0", "gw": "" } ] }
          } ] }
  when:
    - core == 'free5gc'
    - core_node_name != ran_node_name

- name: Apply 5G profile to gNB and UE configs
  include_tasks: apply_5g_profile.yaml

- name: Report the srsRAN AMF endpoint
  debug:
    msg:
      - "amf_ip={{ srsran_network.n2.amf_ip | quote }}"
      - "amf_port={{ srsran_network.n2.amf_port | quote }}"

- name: Update AMF address, gNB N3 IP, namespace and n3networkName
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cu_cp.amf.addr = "{{ srsran_network.n2.amf_ip }}" |
      .gnbConfig.cu_cp.amf.port = {{ srsran_network.n2.amf_port }} |
      .gnbConfig.cu_cp.amf.bind_addr = "{{ srsran_network.n2.gnb_bind_ip }}" |
      .gnbConfig.cu_up.ngu.socket = [{"bind_addr": "{{ srsran_network.n3.gnb_ip }}"}] |
      .gnbIp = "{{ srsran_network.n3.gnb_ip }}" |
      .n3networkName = "{{ n3networkName }}" |
      .namespace = "{{ ran_ns }}"
    ' "{{ values_file }}"

- name: Pin N300 UHD management and primary data address to the R2Lab reference
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.ru_sdr.device_args =
      "mgmt_addr=192.168.235.103,addr=192.168.235.103,name=ni-n3xx-31D98C7,product=n300,num_recv_frames=32,num_send_frames=32,recv_frame_size=8000,send_frame_size=8000,master_clock_rate=122.88e6"
    ' "{{ values_file }}"
  when: rru == 'n300'

- name: Fix device_args for rfsim GNU Radio single-channel multi-UE
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cell_cfg.channel_bandwidth_MHz = 20 |
      .gnbConfig.cell_cfg.pdcch.common.coreset0_index = 12 |
      .gnbConfig.cell_cfg.pdcch.common.ss0_index = 0 |
      .gnbConfig.ru_sdr.srate = 23.04 |
      .gnbConfig.ru_sdr.device_args = "tx_port=tcp://{{ srsran_network.n3.gnb_ip }}:2000,rx_port=tcp://{{ srsran_network.n3.ue_ips[0] }}:2001,base_srate=23.04e6"
    ' "{{ values_file }}"
  when: rru == 'rfsim'

- name: Parameterize the gNB shared N3 attachment
  ansible.builtin.replace:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '"name":\s*"n3network"'
    replace: '"name": "{{ ''{{'' }} .Values.n3networkName {{ ''}}'' }}"'

- name: Configure srsRAN interoperability with an OAI core
  ansible.builtin.include_tasks: oai_core_network.yml
  when: core == 'oai'
  
# --- rfsim only: UE list + srsue values file ---

- name: Load 5G profile vars
  ansible.builtin.include_vars:
    file: >-
      {{ fiveg_profile_file |
         default(playbook_dir ~ '/../group_vars/all/5g_profile_' ~ (fiveg_profile | default('default')) ~ '.yaml') }}
    name: fiveg
  when: rru == 'rfsim'

- name: Validate every selected software UE against the effective 5G profile
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_ue_map | length > 0
      - item.device in fiveg.ues
      - (fiveg.ues[item.device].imsi_suffix | string) is match('^[0-9]{10}$')
      - fiveg.ues[item.device].slice in fiveg.slices | map(attribute='name') | list
      - 2101 + ((item.index | int) - 1) * 100 <= 65535
    fail_msg: "Invalid RFSIM UE definition for {{ item.device }} at index {{ item.index }}"
  loop: "{{ synthran_ue_map }}"
  loop_control:
    label: "{{ item.device }}"
  when: rru == 'rfsim'

- name: Initialize the selected srsUE list
  ansible.builtin.set_fact:
    ue_list: []
    ue_indices: "{{ range(1, ue_count | int + 1) | list }}"
  when: rru == 'rfsim'

- name: Build one srsUE definition per configured device
  ansible.builtin.set_fact:
    ue_list: "{{ ue_list + [ue_definition] }}"
  vars:
    ue_profile: "{{ fiveg.ues[item.device] }}"
    ue_slice: "{{ fiveg.slices | selectattr('name', 'equalto', ue_profile.slice) | first }}"
    ue_definition:
      name: "{{ item.device }}"
      index: "{{ item.index | int }}"
      imsi: "{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ ue_profile.imsi_suffix }}"
      dnn: "{{ ue_slice.dnn }}"
      sst: "{{ ue_slice.sst | int }}"
      sd: >-
        {{ ''
           if (ue_slice.sd | string | upper) == 'EMPTY'
           else (ue_slice.sd | string | regex_replace('^0[xX]', '') | int(base=16)) }}
      tx_port: "{{ 2101 + ((item.index | int) - 1) * 100 }}"
      rx_port: "{{ 2100 + ((item.index | int) - 1) * 100 }}"
      ue_ip: "{{ srsran_network.n3.ue_ips[0] }}"
  loop: "{{ synthran_ue_map }}"
  loop_control:
    label: "{{ item.device }}"
  when: rru == 'rfsim'

- name: Write srsue values-rfsim.yaml
  ansible.builtin.copy:
    dest: "{{ [repo_dest_abs, 'charts', 'srsue', 'values-rfsim.yaml'] | path_join }}"
    content: |
      gnbIp: "{{ srsran_network.n3.gnb_ip }}"
      ueIp: "{{ srsran_network.n3.ue_ips[0] }}"
      n3networkName: "{{ n3networkName }}"
      nodeName: "{{ ran_node_name }}"
      nodeSelector:
        kubernetes.io/hostname: "{{ ran_node_name }}"
      ueCount: {{ ue_count }}
      ues:
      {% for ue in ue_list %}
        - imsi: "{{ ue.imsi }}"
          k: "{{ fiveg.security.full_key }}"
          opc: "{{ fiveg.security.opc }}"
          apn: "{{ ue.dnn }}"
          sst: "{{ ue.sst }}"
          sd: "{{ ue.sd }}"
          ueIp: "{{ ue.ue_ip }}"
          zmqTxPort: {{ ue.tx_port }}
          zmqRxPort: {{ ue.rx_port }}
      {% endfor %}
  when: rru == 'rfsim'

- name: Retain the Kubernetes-enabled Ansible Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
  when: venv_python.stat.exists
