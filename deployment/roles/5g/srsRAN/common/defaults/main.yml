---
repo_url: "https://github.com/turletti/srsran-helm.git"
# Pin the exact 5g-Ansible CSI baseline for reproducible srsRAN RFSIM runs.
version: 8dfb9890d127734cdcd6eee9df8c5d09b1a8076a

ran_ns: "{{ core }}"
repo_dest: "~/srsran-helm"

srs_gnb_label_selectors:
  - "app=srsran"
  - "component=gnb"
srs_ue_label_selectors:
  - "app=srsran"
  - "component=ue"
# Standalone role default. SynthRAN overrides this from deployment.ues.
ue_count: 3
kubectl_bin: "/usr/bin/kubectl"

yq_version: "v4.45.1"
yq_bin_path: "/usr/local/bin/yq"
yq_url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_amd64"

# Selected from deployment/topology.yml and included in the deployment hash.
srsran_network: "{{ synthran_topology.network }}"
n3networkName: "{{ synthran_topology.n3network_name }}"
