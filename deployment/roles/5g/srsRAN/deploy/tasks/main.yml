---
- name: Materialize the reviewed srsRAN lifecycle reference
  ansible.builtin.include_tasks: materialize_reference.yml

- name: Patch RFSIM-only Helm assets
  ansible.builtin.include_tasks: patch_charts.yml
  when: rru == 'rfsim'

- name: Prepare the selected srsRAN UE pod before starting RFSIM processes
  ansible.builtin.include_tasks: deploy_srsues.yml
  when: rru == 'rfsim'

- name: Harden the final srsRAN runtime before Helm deployment
  ansible.builtin.include_tasks: "{{ role_path }}/../config/tasks/harden_runtime.yml"

- name: Deploy srsRAN gNB
  ansible.builtin.include_tasks: deploy_gnb.yml

- name: Verify live srsRAN log production
  ansible.builtin.include_tasks: verify_logging.yml

- name: Attest physical srsRAN RAN-local health
  ansible.builtin.include_tasks: verify_ran_health.yml
  when: rru in ['n300', 'n320']

- name: Start the RFSIM GNU Radio broker and selected UE processes
  ansible.builtin.include_tasks: start_broker.yml
  when: rru == 'rfsim'
