---
- name: Initialize physical gNB startup state
  ansible.builtin.set_fact:
    gnb_startup_success: false
    gnb_pod_name: ""

- name: Ensure values file has node constraints
  ansible.builtin.blockinfile:
    path: "{{ values_file }}"
    marker: "# {mark} ANSIBLE MANAGED NODE SELECTOR"
    insertafter: EOF
    block: |
      nodeSelector:
        kubernetes.io/hostname: "{{ ran_node_name }}"
      nodeName: {{ ran_node_name }}

- name: Fix space after addr= in device_args
  ansible.builtin.replace:
    path: "{{ values_file }}"
    regexp: 'addr=\s*([0-9.]+)\s*,'
    replace: 'addr=\1,'

- name: Flush physical gNB console output without a terminal
  ansible.builtin.replace:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '^([ \t]*)(?:exec stdbuf -oL -eL )?(/usr/local/bin/gnb -c [^\n]+)$'
    replace: '\1exec stdbuf -oL -eL \2'

- name: Read the physical gNB launch template
  ansible.builtin.slurp:
    src: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
  register: gnb_launch_template

- name: Require one physical gNB launch with immediate console output
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (gnb_launch_template.content | b64decode |
         regex_findall('(?m)^[ \t]*exec stdbuf -oL -eL /usr/local/bin/gnb -c ')) | length == 1
    fail_msg: "The pinned srsRAN chart no longer has the expected physical gNB launch command."

- name: Deploy physical srsRAN gNB once
  kubernetes.core.helm:
    name: srsran-gnb
    chart_ref: "{{ [repo_dest_abs, 'charts', 'srsran-gnb'] | path_join }}"
    release_namespace: "{{ ran_ns }}"
    values_files:
      - "{{ values_file }}"
    release_values:
      start:
        logs: false
    state: present
    wait: false
    atomic: false
  register: helm_result
  ignore_errors: true

- name: Wait quietly for the physical gNB pod to be created
  ansible.builtin.shell: |
    set -u
    deadline=$(( $(date +%s) + {{ physical_gnb_pod_create_timeout_seconds | int }} ))
    while (( $(date +%s) < deadline )); do
      pod="$({{ kubectl_bin }} --request-timeout=10s get pods -n "{{ ran_ns }}" \
        -l "{{ srs_gnb_label_selectors | join(',') }}" \
        -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)"
      if [[ -n "$pod" && "$pod" != *" "* ]]; then
        printf '%s\n' "$pod"
        exit 0
      fi
      sleep 2
    done
    exit 1
  args:
    executable: /bin/bash
  register: gnb_pod_lookup
  changed_when: false
  failed_when: false
  when: helm_result is succeeded

- name: Record the physical gNB pod name
  ansible.builtin.set_fact:
    gnb_pod_name: "{{ gnb_pod_lookup.stdout | default('') | trim }}"
  when:
    - helm_result is succeeded
    - gnb_pod_lookup is defined
    - gnb_pod_lookup.rc | default(1) | int == 0

- name: Wait for the physical gNB startup gate
  ansible.builtin.shell: |
    set -u
    start_epoch=$(date +%s)
    deadline=$(( start_epoch + {{ physical_gnb_startup_timeout_seconds | int }} ))
    last_phase="unknown"
    last_ready="false"
    pod_uid="unknown"
    restarts="unknown"
    log_rc=1
    state_rc=1
    current_log=""
    pod_state=""
    amf_seen=0
    start_seen=0
    stable_since=0
    stable_identity=""
    amf_pattern='N2: Connection to AMF on [^[:space:]]+ completed'

    while (( $(date +%s) < deadline )); do
      log_rc=0
      current_log="$({{ kubectl_bin }} --request-timeout=10s logs -n "{{ ran_ns }}" "{{ gnb_pod_name }}" -c gnb 2>&1)" || log_rc=$?
      state_rc=0
      pod_state="$({{ kubectl_bin }} --request-timeout=10s get pod -n "{{ ran_ns }}" "{{ gnb_pod_name }}" \
        -o jsonpath='{.metadata.uid}|{.status.phase}|{.status.containerStatuses[?(@.name=="gnb")].ready}|{.status.containerStatuses[?(@.name=="gnb")].restartCount}' 2>&1)" || state_rc=$?
      if (( state_rc == 0 )); then
        IFS='|' read -r pod_uid last_phase last_ready restarts <<< "$pod_state"
      else
        pod_uid="unknown"
        last_phase="unknown"
        last_ready="false"
        restarts="unknown"
      fi
      if [[ -n "$stable_identity" && "$pod_uid:$restarts" != "$stable_identity" ]]; then
        printf 'FAIL: gNB identity or restart count changed during stability observation (pod_read_rc=%s)\n' "$state_rc"
        exit 1
      fi
      if (( log_rc == 0 )) && \
         [[ "$current_log" =~ Segmentation[[:space:]]fault|terminate[[:space:]]called|SIGABRT|Assertion.*failed|srsRAN[[:space:]](FATAL[[:space:]])?ERROR: ]]; then
        printf 'FAIL: fatal gNB process error\n'
        exit 1
      fi

      amf_seen=0
      start_seen=0

      if (( log_rc == 0 )) && \
         { [[ "$current_log" == *"Connected to AMF"* ]] || [[ "$current_log" =~ $amf_pattern ]]; }; then
        amf_seen=1
      fi

      if (( log_rc == 0 )) && \
         { [[ "$current_log" == *"gNB started"* ]] || [[ "$current_log" == *"Cell was activated"* ]]; }; then
        start_seen=1
      fi

      if (( amf_seen == 1 && start_seen == 1 )) && \
         [[ -n "$pod_uid" && "$restarts" =~ ^[0-9]+$ ]] && \
         [[ "$last_phase" == "Running" ]] && \
         [[ "${last_ready,,}" == "true" ]]; then
        if (( stable_since == 0 )); then
          stable_since=$(date +%s)
          stable_identity="$pod_uid:$restarts"
        fi
        if (( $(date +%s) - stable_since >= {{ physical_gnb_stability_seconds | int }} )); then
          printf 'PASS after %ss: pod=%s uid=%s restarts=%s stable=%ss N2=completed gNB=started\n' \
            "$(( $(date +%s) - start_epoch ))" "{{ gnb_pod_name }}" "$pod_uid" "$restarts" \
            "{{ physical_gnb_stability_seconds | int }}"
          exit 0
        fi
      elif [[ -n "$stable_identity" ]]; then
        printf 'FAIL: gNB lost readiness during stability observation\n'
        exit 1
      fi

      sleep {{ physical_gnb_poll_interval_seconds | int }}
    done

    printf 'TIMEOUT after %ss: pod=%s uid=%s phase=%s ready=%s restarts=%s N2_seen=%s gNB_start_seen=%s log_read_rc=%s pod_read_rc=%s\n' \
      "$(( $(date +%s) - start_epoch ))" "{{ gnb_pod_name }}" "$pod_uid" "$last_phase" "$last_ready" \
      "$restarts" "$amf_seen" "$start_seen" "$log_rc" "$state_rc"
    if (( log_rc != 0 )); then printf 'Log read error: %s\n' "$current_log"; fi
    if (( state_rc != 0 )); then printf 'Pod read error: %s\n' "$pod_state"; fi
    exit 1
  args:
    executable: /bin/bash
  register: gnb_startup_gate
  changed_when: false
  failed_when: false
  when: gnb_pod_name | length > 0

- name: Accept the physical gNB startup gate result
  ansible.builtin.set_fact:
    gnb_startup_success: >-
      {{
        helm_result is succeeded and
        gnb_startup_gate is defined and
        (gnb_startup_gate.rc | default(1) | int) == 0
      }}

- name: Read the physical gNB log for retained evidence
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - --request-timeout=10s
      - logs
      - -n
      - "{{ ran_ns }}"
      - "{{ gnb_pod_name }}"
      - -c
      - gnb
  register: gnb_runtime_log
  changed_when: false
  failed_when: false
  when: gnb_pod_name | length > 0

- name: Report physical gNB startup gate
  ansible.builtin.debug:
    msg:
      - "Physical gNB startup gate: {{ 'PASS' if gnb_startup_success | bool else 'FAIL' }}"
      - "{{ gnb_startup_gate.stdout | default('Startup gate did not run because no gNB pod was found.') }}"

- name: Retain the physical gNB log with the run
  ansible.builtin.copy:
    content: |-
      {{ gnb_runtime_log.stdout | default('') }}
      {{ gnb_runtime_log.stderr | default('') }}
    dest: "{{ run_dir }}/gnb.log"
  delegate_to: localhost

- name: Retain physical gNB startup-gate result with the run
  ansible.builtin.copy:
    content: |-
      success={{ gnb_startup_success | bool }}
      pod={{ gnb_pod_name | default('') }}
      gate={{ gnb_startup_gate.stdout | default('not-run') }}
      gate_stderr={{ gnb_startup_gate.stderr | default('') }}
      log_read_rc={{ gnb_runtime_log.rc | default('not-run') }}
    dest: "{{ run_dir }}/gnb-health.txt"
  delegate_to: localhost

- name: Capture the physical gNB pod description on startup-gate failure
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - --request-timeout=10s
      - describe
      - pod
      - -n
      - "{{ ran_ns }}"
      - "{{ gnb_pod_name }}"
  register: gnb_pod_description
  changed_when: false
  failed_when: false
  when:
    - not gnb_startup_success | bool
    - gnb_pod_name | length > 0

- name: Retain physical gNB diagnostics on startup-gate failure
  ansible.builtin.copy:
    content: |-
      {{ gnb_pod_description.stdout | default('No gNB pod was available to describe.') }}
      {{ gnb_pod_description.stderr | default('') }}
    dest: "{{ run_dir }}/gnb-describe.txt"
  delegate_to: localhost
  when: not gnb_startup_success | bool

- name: Read the N3xx gNB application log on startup-gate failure
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - --request-timeout=10s
      - exec
      - -n
      - "{{ ran_ns }}"
      - "{{ gnb_pod_name }}"
      - -c
      - gnb
      - --
      - cat
      - /tmp/gnb.log
  register: gnb_application_log
  changed_when: false
  failed_when: false
  when:
    - not gnb_startup_success | bool
    - gnb_pod_name | length > 0

- name: Retain the N3xx gNB application log on startup-gate failure
  ansible.builtin.copy:
    content: |-
      {{ gnb_application_log.stdout | default('') }}
      {{ gnb_application_log.stderr | default('') }}
    dest: "{{ run_dir }}/gnb-application.log"
  delegate_to: localhost
  when: not gnb_startup_success | bool

- name: Show physical gNB failure evidence in the Ansible log
  ansible.builtin.debug:
    msg:
      - "Console read rc={{ gnb_runtime_log.rc | default('not-run') }}"
      - "{{ (gnb_runtime_log.stdout_lines | default([]))[-80:] }}"
      - "{{ gnb_runtime_log.stderr | default('') }}"
      - "Application log read rc={{ gnb_application_log.rc | default('not-run') }}"
      - "{{ (gnb_application_log.stdout_lines | default([]))[-80:] }}"
      - "{{ gnb_application_log.stderr | default('') }}"
  when: not gnb_startup_success | bool

- name: Stop when the physical gNB never becomes ready for UE attachment
  ansible.builtin.fail:
    msg: >-
      Physical srsRAN gNB startup gate failed:
      {{ gnb_startup_gate.stdout | default('No gNB pod was found.') }}.
      The live Helm release and pod were preserved. Review {{ run_dir }}/gnb.log,
      {{ run_dir }}/gnb-application.log, and {{ run_dir }}/gnb-describe.txt.
  when: not gnb_startup_success | bool
