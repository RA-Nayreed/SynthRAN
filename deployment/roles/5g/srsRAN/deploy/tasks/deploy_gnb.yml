---
- name: Require the centrally verified Helm runtime
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: helm_check
  changed_when: false

- name: Refuse an unexpected Helm runtime
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in helm_check.stdout"
    fail_msg: "srsRAN requires the checksum-pinned Helm v{{ helm_version }} runtime"

- name: Load common variables
  include_vars:
    file: "../../common/defaults/main.yml"

- name: Check srsran-gnb release
  ansible.builtin.command: helm status srsran-gnb -n {{ ran_ns }}
  register: gnb_release_exists
  changed_when: false
  failed_when: false

- name: Uninstall srsran-gnb
  ansible.builtin.command: helm uninstall srsran-gnb -n {{ ran_ns }} --no-hooks
  when: gnb_release_exists.rc == 0

- name: Deploy srsRAN gNB on an N3xx radio
  when: rru in ['n300', 'n320']
  block:

    - name: Set initial retry facts
      ansible.builtin.set_fact:
        gnb_startup_success: false
        max_attempts: 2

    - name: Deploy and Monitor srsRAN gNB
      block:
        - name: "Attempt gNB deployment (Attempt {{ item }})"
          include_tasks: deploy_with_check.yml
          loop: "{{ range(1, max_attempts + 1) | list }}"
          when: not gnb_startup_success

      rescue:
        - name: Final failure message
          ansible.builtin.fail:
            msg: "gNB failed to start properly on both IP addresses."
          when: not gnb_startup_success

    - name: Confirm success
      ansible.builtin.debug:
        msg: "srsRAN gNB is running successfully!"
      when: gnb_startup_success

- name: Deploy srsRAN gNB through the generic Helm path
  when: rru not in ['n300', 'n320']
  kubernetes.core.helm:
    name: srsran-gnb
    chart_ref: "{{ [repo_dest_abs, 'charts', 'srsran-gnb'] | path_join }}"
    release_namespace: "{{ ran_ns }}"
    values_files:
      - "{{ values_file }}"
    state: present
    wait: False
    atomic: True
    timeout: 180s
