---
- name: Load the pinned 5g-Ansible execution reference
  ansible.builtin.set_fact:
    synthran_srsran_reference: >-
      {{ lookup(
           'ansible.builtin.file',
           synthran_root ~ '/third_party/sopnode-5g-ansible/EXECUTION_REFERENCE.json'
         ) | from_json }}

- name: Require an immutable srsRAN lifecycle reference
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsran_reference.repository == 'https://github.com/RA-Nayreed/5g-Ansible'
      - synthran_srsran_reference.commit is match('^[0-9a-f]{40}$')
    fail_msg: >-
      Sub 07 requires the reviewed 5g-Ansible execution reference rather than
      an implicit or floating lifecycle source.

- name: Materialize the pinned 5g-Ansible lifecycle source
  ansible.builtin.git:
    repo: "{{ synthran_srsran_reference.repository }}"
    dest: "{{ synthran_private_dir }}/5g-ansible-reference"
    version: "{{ synthran_srsran_reference.commit }}"
    update: true
    force: true
  delegate_to: localhost
  become: false

- name: Read back the materialized lifecycle revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ synthran_private_dir }}/5g-ansible-reference"
      - rev-parse
      - HEAD
  register: synthran_srsran_reference_head
  changed_when: false
  delegate_to: localhost
  become: false

- name: Require the exact reviewed lifecycle revision
  ansible.builtin.assert:
    quiet: true
    that:
      - (synthran_srsran_reference_head.stdout | trim) == synthran_srsran_reference.commit
    fail_msg: >-
      Materialized 5g-Ansible revision does not match the reviewed Sub 07
      execution reference.

- name: Resolve reference-owned srsRAN lifecycle tasks
  ansible.builtin.set_fact:
    synthran_srsran_reference_deploy_with_check: >-
      {{ synthran_private_dir }}/5g-ansible-reference/roles/5g/srsRAN/deploy/tasks/deploy_with_check.yml
    synthran_srsran_reference_deploy_srsues: >-
      {{ synthran_private_dir }}/5g-ansible-reference/roles/5g/srsRAN/deploy/tasks/deploy_srsues.yml

- name: Verify reference-owned srsRAN lifecycle tasks exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ synthran_srsran_reference_deploy_with_check }}"
    - "{{ synthran_srsran_reference_deploy_srsues }}"
  register: synthran_srsran_reference_tasks
  delegate_to: localhost
  become: false

- name: Refuse an incomplete lifecycle checkout
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_srsran_reference_tasks.results | length == 2
      - synthran_srsran_reference_tasks.results | map(attribute='stat.exists') | min
      - synthran_srsran_reference_tasks.results | map(attribute='stat.isreg') | min
    fail_msg: >-
      The pinned 5g-Ansible checkout does not contain all reviewed srsRAN
      lifecycle tasks required by Sub 07.
