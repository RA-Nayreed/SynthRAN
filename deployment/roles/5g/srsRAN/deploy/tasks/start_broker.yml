---

- name: Kill existing processes if any
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} --
    /bin/sh -lc "pkill -9 srsue; pkill -9 python3; true"
  changed_when: true
  failed_when: false

- name: Start GNU Radio broker in tmux window 'gnu'
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} --
    /bin/sh -lc "
      tmux list-windows -t ran | grep -q '^\s*[0-9]\+: gnu\b' \
        && tmux kill-window -t ran:gnu || true;
      tmux new-window -t ran -n gnu \
        'bash -lc \"/srsran/config/start_gnu.sh {{ ue_count }} 2>&1 | tee /var/log/gnu_multi_ue.log\"'
    "
  changed_when: true
  failed_when: false

- name: Wait for GNU Radio broker to be ready
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/sh -lc
    "grep -q 'Press Enter to quit' /var/log/gnu_multi_ue.log 2>/dev/null"
  register: gnu_log_wait
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: gnu_log_wait.rc == 0

- name: Get gNB pod name
  ansible.builtin.command: >
    {{ kubectl_bin }} get pod -n {{ ran_ns }} -l app=srsran,component=gnb
    -o jsonpath='{.items[0].metadata.name}'
  register: gnb_pod_name_result
  changed_when: false

- name: Wait for gNB cell to be activated
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ gnb_pod_name_result.stdout }} -c gnb-logs -- /bin/sh -lc
    "grep -q 'Cell was activated' /var/log/gnb.log 2>/dev/null"
  register: gnb_cell_wait
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until: gnb_cell_wait.rc == 0

- name: Require the gNB cell to activate
  ansible.builtin.assert:
    quiet: true
    that:
      - gnb_cell_wait.rc == 0
    fail_msg: "The gNB cell did not activate within the five-minute timeout."

- name: Require the GNU Radio broker to start
  ansible.builtin.assert:
    quiet: true
    that:
      - gnu_log_wait.rc == 0
    fail_msg: "The RFSIM GNU Radio broker did not become ready."

- name: Wait for the gNB NGAP association with the AMF
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ gnb_pod_name_result.stdout }} -c gnb-logs -- /bin/sh -lc
    "grep -Eq 'N2: Connection to AMF .* (completed|was established)|AMF connection established|Connected to AMF' /var/log/gnb.log"
  register: gnb_amf_wait
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: gnb_amf_wait.rc == 0

- name: Collect control-plane diagnostics when NGAP is unavailable
  ansible.builtin.shell: |
    echo '--- gNB log ---'
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ gnb_pod_name_result.stdout }} -c gnb-logs -- tail -n 120 /var/log/gnb.log 2>&1 || true
    echo '--- AMF candidates ---'
    {{ kubectl_bin }} get pods -A --no-headers -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' 2>/dev/null |
    while read ns pod; do
      lower=$(printf '%s' "$pod" | tr '[:upper:]' '[:lower:]')
      case "$lower" in
        *amf*)
          echo "--- ${ns}/${pod} ---"
          {{ kubectl_bin }} -n "$ns" logs "$pod" --all-containers=true --tail=120 2>&1 || true
          ;;
      esac
    done
  register: ngap_failure_diagnostics
  changed_when: false
  when: gnb_amf_wait.rc != 0

- name: Require the gNB to establish NGAP with the AMF
  ansible.builtin.assert:
    quiet: true
    that:
      - gnb_amf_wait.rc == 0
    fail_msg: |-
      The gNB did not establish its logical N2/NGAP association with the AMF.
      {{ ngap_failure_diagnostics.stdout | default('No control-plane diagnostics were available.') }}

- name: Start every configured UE in its own tmux window
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - -n
      - "{{ ran_ns }}"
      - exec
      - "{{ ue_pod_name }}"
      - --
      - /bin/sh
      - -lc
      - |
        for i in {{ ue_indices | join(" ") }}; do
          tmux kill-window -t "ran:ue${i}" 2>/dev/null || true
          rm -f "/var/log/ue${i}.log"
          tmux new-window -t ran -n "ue${i}" \
            "bash -lc \"/srsran/config/start_ue.sh ${i} 2>&1 | tee /var/log/ue${i}.log\""
        done
  changed_when: true

- name: Wait until each UE process is up
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/sh -lc
    'ok=1;
     for i in {{ ue_indices | join(" ") }}; do
       if ! pgrep -af "srsue .*ue_${i}\.conf" >/dev/null 2>&1; then
         ok=0; break;
       fi;
     done;
     test "$ok" = "1"'
  register: ue_up_check
  changed_when: false
  failed_when: false
  retries: 60
  delay: 2
  until: ue_up_check.rc == 0

- name: Collect startup logs when an srsUE process exits early
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - -n
      - "{{ ran_ns }}"
      - exec
      - "{{ ue_pod_name }}"
      - --
      - /bin/sh
      - -lc
      - |
        for i in {{ ue_indices | join(' ') }}; do
          echo "=== UE ${i} console ==="
          tail -n 160 "/var/log/ue${i}.log" 2>/dev/null || true
          echo "=== UE ${i} native log ==="
          tail -n 160 "/tmp/ue${i}.log" 2>/dev/null || true
        done
  register: ue_start_failure_logs
  changed_when: false
  when: ue_up_check.rc != 0

- name: Require every srsUE process to remain running
  ansible.builtin.assert:
    quiet: true
    that:
      - ue_up_check.rc == 0
    fail_msg: |-
      One or more srsUE processes exited before registration. Tunnel polling was not started.
      {{ ue_start_failure_logs.stdout | default('No UE startup log was produced.') }}

- name: Wait for all configured UE tunnels
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/sh -lc
    'missing="";
     for i in {{ ue_indices | join(" ") }}; do
       if ! ip -4 -o addr show dev "tun_srsue${i}" | grep -q "inet "; then
         missing="${missing} tun_srsue${i}";
       fi;
     done;
     if [ -n "$missing" ]; then echo "Missing:${missing}"; exit 1; fi'
  register: all_ue_tunnels_wait
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: all_ue_tunnels_wait.rc == 0

- name: Inspect each configured UE tunnel after the baseline attempt
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/sh -lc
    "ip -4 -o addr show dev tun_srsue{{ item.index }} | grep -q 'inet '"
  loop: "{{ ue_list }}"
  loop_control:
    label: "{{ item.name }} / tun_srsue{{ item.index }}"
  register: initial_ue_tunnels
  changed_when: false
  failed_when: false

- name: Identify UEs that did not establish a tunnel
  ansible.builtin.set_fact:
    failed_ue_starts: >-
      {{ initial_ue_tunnels.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item')
         | list }}

- name: Read decisive logs for UEs missing after the baseline attempt
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - -n
      - "{{ ran_ns }}"
      - exec
      - "{{ ue_pod_name }}"
      - --
      - /bin/sh
      - -lc
      - |
        echo '--- srsUE console ---'
        tail -n 220 /var/log/ue{{ item.index }}.log 2>/dev/null || true
        echo '--- relevant native events ---'
        grep -Ei 'RACH|RNTI|RRC|NAS|registration|authentication|security|PDU|session|slice|NSSAI|reject|fail|error' \
          /tmp/ue{{ item.index }}.log 2>/dev/null | tail -n 220 || true
        echo '--- native srsUE tail ---'
        tail -n 160 /tmp/ue{{ item.index }}.log 2>/dev/null || true
  loop: "{{ failed_ue_starts }}"
  loop_control:
    label: "{{ item.name }}"
  register: failed_ue_logs
  changed_when: false

- name: Report logs for UEs missing after the baseline attempt
  ansible.builtin.debug:
    msg: |-
      {{ item.item.name }} (IMSI {{ item.item.imsi }}, DNN {{ item.item.dnn }}) did not establish tun_srsue{{ item.item.index }}.
      {{ item.stdout | default('No UE log was produced.') }}
  loop: "{{ failed_ue_logs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Collect radio and backend-aware core diagnostics when UE establishment fails
  ansible.builtin.shell: |
    echo '--- GNU Radio broker ---'
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- tail -n 160 /var/log/gnu_multi_ue.log 2>&1 || true
    echo '--- gNB relevant events ---'
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ gnb_pod_name_result.stdout }} -c gnb-logs -- /bin/sh -lc \
      "grep -Ei 'RACH|RNTI|RRC|NGAP|PDU|UE|reject|fail|error' /var/log/gnb.log | tail -n 300" 2>&1 || true
    echo '--- core AMF/SMF candidates ---'
    {{ kubectl_bin }} get pods -A --no-headers -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' 2>/dev/null |
    while read ns pod; do
      lower=$(printf '%s' "$pod" | tr '[:upper:]' '[:lower:]')
      case "$lower" in
        *amf*|*smf*)
          echo "--- ${ns}/${pod} ---"
          {{ kubectl_bin }} -n "$ns" logs "$pod" --all-containers=true --tail=220 2>&1 || true
          ;;
      esac
    done
  register: failed_ue_control_plane_logs
  changed_when: false
  when: failed_ue_starts | length > 0

- name: Require every configured UE to establish a PDU-session tunnel
  ansible.builtin.assert:
    that:
      - failed_ue_starts | length == 0
    fail_msg: |-
      {{ failed_ue_starts | length }} UE(s) failed registration or PDU-session
      establishment on the pinned 5g-Ansible CSI baseline attempt. No automatic
      retry was performed, and telemetry replay was not started.
      {% for result in failed_ue_logs.results | default([]) %}
      === {{ result.item.name }} / IMSI {{ result.item.imsi }} / DNN {{ result.item.dnn }} / tun_srsue{{ result.item.index }} ===
      {{ result.stdout | default('No UE log was produced.') }}
      {% endfor %}
      {{ failed_ue_control_plane_logs.stdout | default('No radio/core diagnostics were produced.') }}

- name: Capture srsUE runtime provenance
  ansible.builtin.command:
    argv:
      - "{{ kubectl_bin }}"
      - -n
      - "{{ ran_ns }}"
      - exec
      - "{{ ue_pod_name }}"
      - --
      - /bin/sh
      - -lc
      - |
        grep -m1 'Built in Release mode using commit' /var/log/ue1.log 2>/dev/null || true
  register: srsue_build_provenance
  changed_when: false
  failed_when: false

- name: Capture srsUE container image identity
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} get pod {{ ue_pod_name }}
    -o jsonpath='{.status.containerStatuses[0].imageID}'
  register: srsue_image_identity
  changed_when: false
  failed_when: false

- name: Report srsUE runtime provenance
  ansible.builtin.debug:
    msg:
      - "{{ srsue_build_provenance.stdout | default('srsUE source commit unavailable') }}"
      - "imageID={{ srsue_image_identity.stdout | default('unavailable') }}"

# --- Routes ---

- name: Add routes in UE pod
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/bash -lc
    'UE_COUNT={{ ue_count }} /srsran/config/add_route.sh'
  changed_when: false
  failed_when: false

# --- Show UE IPs ---

- name: Extract UE IP addresses from logs
  ansible.builtin.command: >
    {{ kubectl_bin }} -n {{ ran_ns }} exec {{ ue_pod_name }} -- /bin/sh -lc
    "grep -m1 'PDU Session Establishment successful' /var/log/ue{{ item.index }}.log 2>/dev/null | awk '{print \$NF}'"
  loop: "{{ ue_list }}"
  register: ue_ips
  changed_when: false
  failed_when: false

- name: Report UE tunnel addresses
  ansible.builtin.debug:
    msg: "{{ item.item.name }} ({{ item.item.imsi }}) → {{ item.stdout | default('N/A') }}"
  loop: "{{ ue_ips.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Summary
  ansible.builtin.debug:
    msg:
      - "UEs started in tmux session 'ran': windows ue1..ue{{ ue_count }}"
      - "GNU Radio broker in tmux window 'gnu'"
      - "Logs: /var/log/ue1.log .. /var/log/ue{{ ue_count }}.log"
      - "GNU Radio log: /var/log/gnu_multi_ue.log"
      - "Inspect: {{ kubectl_bin }} -n {{ ran_ns }} exec -it {{ ue_pod_name }} -- tmux attach -t ran"
