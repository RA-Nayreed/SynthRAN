---
- name: Clone open5gs-k8s repo
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_branch }}"
    update: yes
    force: yes

- name: Load resolved network profile
  ansible.builtin.include_vars:
    file: "{{ network_profile_file }}"
    name: fiveg

- name: Validate PLMN
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc is defined
      - fiveg.plmn.mnc is defined
      - fiveg.plmn.tac is defined

- name: Validate slices
  ansible.builtin.assert:
    quiet: true
    that:
      - slice.name is defined
      - slice.sst is defined
      - slice.dnn is defined
  loop: "{{ fiveg.slices }}"
  loop_control:
    loop_var: slice
    label: "{{ slice.name }}"

- name: Require the two-slice Open5GS deployment layout
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.slices | length == 2
    fail_msg: >-
      The retained Open5GS Kubernetes layout exposes two SMF/UPF slots; the
      selected network profile must therefore define exactly two slices.

- name: Validate UE slice references
  ansible.builtin.assert:
    quiet: true
    that:
      - ue.value.slice in fiveg.slices | map(attribute='name') | list
  loop: "{{ fiveg.ues | dict2items }}"
  loop_control:
    loop_var: ue
    label: "{{ ue.key }}"

- name: Update AMF ConfigMap on disk
  ansible.builtin.template:
    src: amf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/common/amf/amf-configmap.yaml"

- name: Update NSSF ConfigMap on disk
  ansible.builtin.template:
    src: nssf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/common/nssf/nssf-configmap.yaml"

- name: Update first SMF ConfigMap on disk
  ansible.builtin.template:
    src: smf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/slices/slice1/smf1/smf-configmap.yaml"
  vars:
    smf_name: smf1
    smf_slice: "{{ fiveg.slices[0].name }}"

- name: Update second SMF ConfigMap on disk
  ansible.builtin.template:
    src: smf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/slices/slice2/smf2/smf-configmap.yaml"
  vars:
    smf_name: smf2
    smf_slice: "{{ fiveg.slices[1].name }}"

- name: Update first UPF ConfigMap on disk
  ansible.builtin.template:
    src: upf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/slices/slice1/upf1/upf-configmap.yaml"
  vars:
    upf_name: upf1
    upf_slice_data: "{{ fiveg.slices[0] }}"

- name: Update second UPF ConfigMap on disk
  ansible.builtin.template:
    src: upf-configmap.yaml.j2
    dest: "{{ open5gs_root }}/slices/slice2/upf2/upf-configmap.yaml"
  vars:
    upf_name: upf2
    upf_slice_data: "{{ fiveg.slices[1] }}"

- name: Generate subscriber data for selected UEs
  ansible.builtin.template:
    src: generate-data-fiveg.py.j2
    dest: "{{ repo_dest }}/mongo-tools/generate-data-fiveg.py"
    mode: "0755"
  vars:
    profile: "{{ fiveg }}"

- name: Generate Open5GS network-profile check file
  ansible.builtin.template:
    src: profile-check.j2
    dest: /root/open5gs_network_profile_check.txt
    owner: root
    mode: '0644'
