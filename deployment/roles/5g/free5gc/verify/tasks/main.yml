---
- name: Fetch Free5GC profile-bearing ConfigMaps
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ item.name }}"
    namespace: "{{ core_ns }}"
  loop:
    - {key: amf, name: free5gc-free5gc-amf-configmap}
    - {key: smf, name: free5gc-free5gc-smf-configmap}
    - {key: nssf, name: free5gc-free5gc-nssf-configmap}
    - {key: iupf1, name: free5gc-free5gc-upf-iupf1-configmap}
    - {key: psaupf1, name: free5gc-free5gc-upf-psaupf1-configmap}
    - {key: psaupf2, name: free5gc-free5gc-upf-psaupf2-configmap}
  loop_control:
    label: "{{ item.key }}"
  register: free5gc_profile_configmaps

- name: Require every Free5GC profile-bearing ConfigMap
  ansible.builtin.assert:
    quiet: true
    that:
      - item.resources | length == 1
    fail_msg: >-
      Free5GC profile verification requires ConfigMap {{ item.item.name }} in
      namespace {{ core_ns }}.
  loop: "{{ free5gc_profile_configmaps.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Index Free5GC profile-bearing ConfigMaps
  ansible.builtin.set_fact:
    free5gc_profile_cm: >-
      {{ (free5gc_profile_cm | default({})) |
         combine({item.item.key: item.resources[0]}) }}
  loop: "{{ free5gc_profile_configmaps.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Verify Free5GC AMF PLMN and TAC
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc in free5gc_profile_cm.amf.data['amfcfg.yaml']
      - fiveg.plmn.mnc in free5gc_profile_cm.amf.data['amfcfg.yaml']
      - (fiveg.plmn.tac | string) in free5gc_profile_cm.amf.data['amfcfg.yaml']
    fail_msg: "Free5GC AMF does not match the effective PLMN/TAC profile."

- name: Verify every effective Free5GC slice in AMF
  ansible.builtin.assert:
    quiet: true
    that:
      - (item.sst | string) in free5gc_profile_cm.amf.data['amfcfg.yaml']
      - item.dnn in free5gc_profile_cm.amf.data['amfcfg.yaml']
      - >-
        item.sd == 'EMPTY' or
        ('%06x' | format(item.sd | int(base=16))) in free5gc_profile_cm.amf.data['amfcfg.yaml']
    fail_msg: "Free5GC AMF is missing an effective slice."
  loop: "{{ fiveg.slices }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify Free5GC SMF PLMN
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc in free5gc_profile_cm.smf.data['smfcfg.yaml']
      - fiveg.plmn.mnc in free5gc_profile_cm.smf.data['smfcfg.yaml']
    fail_msg: "Free5GC SMF does not match the effective PLMN."

- name: Verify every effective Free5GC slice in SMF
  ansible.builtin.assert:
    quiet: true
    that:
      - (item.sst | string) in free5gc_profile_cm.smf.data['smfcfg.yaml']
      - item.dnn in free5gc_profile_cm.smf.data['smfcfg.yaml']
      - item.ip_prefix in free5gc_profile_cm.smf.data['smfcfg.yaml']
      - >-
        item.sd == 'EMPTY' or
        ('%06x' | format(item.sd | int(base=16))) in free5gc_profile_cm.smf.data['smfcfg.yaml']
    fail_msg: "Free5GC SMF is missing an effective slice or UE pool."
  loop: "{{ fiveg.slices }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify Free5GC NSSF PLMN
  ansible.builtin.assert:
    quiet: true
    that:
      - fiveg.plmn.mcc in free5gc_profile_cm.nssf.data['nssfcfg.yaml']
      - fiveg.plmn.mnc in free5gc_profile_cm.nssf.data['nssfcfg.yaml']
    fail_msg: "Free5GC NSSF does not match the effective PLMN."

- name: Verify every effective Free5GC slice in NSSF
  ansible.builtin.assert:
    quiet: true
    that:
      - (item.sst | string) in free5gc_profile_cm.nssf.data['nssfcfg.yaml']
      - >-
        item.sd == 'EMPTY' or
        ('%06x' | format(item.sd | int(base=16))) in free5gc_profile_cm.nssf.data['nssfcfg.yaml']
    fail_msg: "Free5GC NSSF is missing an effective slice."
  loop: "{{ fiveg.slices }}"
  loop_control:
    label: "{{ item.name }}"

- name: Verify every effective Free5GC slice in each UPF profile
  ansible.builtin.assert:
    quiet: true
    that:
      - item.1.dnn in free5gc_profile_cm[item.0].data['upfcfg.yaml']
      - item.1.ip_prefix in free5gc_profile_cm[item.0].data['upfcfg.yaml']
    fail_msg: >-
      Free5GC {{ item.0 }} is missing an effective DNN or UE pool.
  loop: "{{ ['iupf1', 'psaupf1', 'psaupf2'] | product(fiveg.slices) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1.name }}"

- name: Fetch all Free5GC namespace pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ core_ns }}"
  register: free5gc_pods

- name: Require Free5GC to have running workloads
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_pods.resources | length > 0
    fail_msg: "Free5GC namespace contains no pods after Helm deployment."

- name: Require every Free5GC pod to be Running and Ready
  ansible.builtin.assert:
    quiet: true
    that:
      - item.status.phase == 'Running'
      - item.status.containerStatuses is defined
      - item.status.containerStatuses | length > 0
      - >-
        item.status.containerStatuses |
        selectattr('ready', 'equalto', true) | list | length ==
        item.status.containerStatuses | length
    fail_msg: "A Free5GC pod is not Running and Ready."
  loop: "{{ free5gc_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Require the pinned Free5GC subscriber utility path
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - "{{ core_ns }}"
      - deployment/free5gc-free5gc-dbpython-dbpython
      - --
      - test
      - -f
      - /free5gc/add_subscribers.py
  changed_when: false

- name: Require every selected subscriber identity in Free5GC MongoDB
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl exec -n {{ core_ns }} deployment/free5gc-free5gc-dbpython-dbpython -- \
      python3 /free5gc/add_subscribers.py -a list | \
      grep -Fq "imsi-{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ item.value.imsi_suffix }}"
  args:
    executable: /bin/bash
  loop: "{{ fiveg.ues | dict2items }}"
  loop_control:
    label: selected-subscriber
  changed_when: false
  no_log: true

- name: Read the Free5GC authentication-subscriber count without exposing records
  ansible.builtin.shell: |
    set -euo pipefail
    count="$(
      kubectl exec -n {{ core_ns }} deployment/free5gc-free5gc-dbpython-dbpython -- \
        python3 /free5gc/add_subscribers.py -a list | \
        awk -F': ' '$1 == "subscriptionData.authenticationData.authenticationSubscription" {print $2}' | \
        tail -1
    )"
    test -n "$count"
    printf '%s\n' "$count"
  args:
    executable: /bin/bash
  register: free5gc_subscriber_count
  changed_when: false

- name: Require exact Free5GC subscriber cardinality
  ansible.builtin.assert:
    quiet: true
    that:
      - free5gc_subscriber_count.stdout | trim | int == fiveg.ues | length
    fail_msg: >-
      Free5GC subscriber cardinality does not match the selected effective
      profile (expected {{ fiveg.ues | length }}).
