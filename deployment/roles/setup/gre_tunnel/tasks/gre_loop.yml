---
- name: Resolve peer underlay for {{ synthran_gre_bridge }}
  ansible.builtin.set_fact:
    synthran_transport_remote_ip: >-
      {{ hostvars[groups['ran_node'][0]].ip
         if inventory_hostname in groups['core_node']
         else hostvars[groups['core_node'][0]].ip }}

- name: Configure unkeyed GRE link for {{ synthran_gre_bridge }}
  ansible.builtin.shell: |
    set -eu
    bridge={{ synthran_gre_bridge | quote }}
    port="gre-${bridge}"
    ovs-vsctl --may-exist add-port "$bridge" "$port"
    ovs-vsctl set interface "$port" type=gre
    ovs-vsctl clear interface "$port" options
    ovs-vsctl set interface "$port" options:remote_ip={{ synthran_transport_remote_ip | quote }}
  args:
    executable: /bin/bash
  become: true

- name: Verify GRE peer for {{ synthran_gre_bridge }}
  ansible.builtin.command:
    argv:
      - ovs-vsctl
      - get
      - interface
      - "gre-{{ synthran_gre_bridge }}"
      - options
  register: synthran_gre_options
  changed_when: false
  become: true

- name: Require the selected GRE peer and no keyed fork for {{ synthran_gre_bridge }}
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_transport_remote_ip in synthran_gre_options.stdout
      - "'key=' not in synthran_gre_options.stdout"
    fail_msg: >-
      GRE {{ synthran_gre_bridge }} does not match the selected unkeyed
      topology contract for peer {{ synthran_transport_remote_ip }}.
