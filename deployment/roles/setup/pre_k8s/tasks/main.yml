---
# To avoid Pod eviction issues on live and persistent systems

- name: Detect live Ubuntu system
  ansible.builtin.shell: |
    grep -q "boot=live" /proc/cmdline && echo "live" || echo "persistent"
  register: live_image_check
  changed_when: false
  become: true

- name: Ensure selected storage device exists
  ansible.builtin.stat:
    path: "/dev/{{ storage }}"
  register: storage_device
  become: true

- name: Validate the selected containerd storage device
  ansible.builtin.assert:
    quiet: true
    that:
      - storage_device.stat.exists
      - storage_device.stat.isblk | default(false)
    fail_msg: "Storage device /dev/{{ storage }} does not exist or is not a block device"

- name: Create containerd mount point
  ansible.builtin.file:
    path: /var/lib/containerd
    state: directory
    mode: '0755'
  become: true

- name: Stop containerd before changing its storage binding
  ansible.builtin.systemd:
    name: containerd
    state: stopped
  become: true

- name: Remove stale /var/lib/containerd fstab entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*/var/lib/containerd.*'
    state: absent
  become: true

- name: Clear stale containerd mounts
  ansible.builtin.shell: |
    for i in $(seq 1 10); do
      findmnt /var/lib/containerd &>/dev/null || break
      umount /var/lib/containerd 2>/dev/null || umount -l /var/lib/containerd 2>/dev/null || break
      sleep 1
    done
  changed_when: false
  become: true

- name: Find an existing mountpoint for the selected storage device
  ansible.builtin.shell: |
    findmnt -nr -S /dev/{{ storage }} -o TARGET 2>/dev/null | head -n 1 || true
  register: storage_existing_mount
  changed_when: false
  become: true

- name: Read the selected storage filesystem type
  ansible.builtin.command:
    argv:
      - lsblk
      - -nrpo
      - FSTYPE
      - "/dev/{{ storage }}"
  register: storage_fstype
  changed_when: false
  become: true

- name: Require a supported selected storage filesystem
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        (storage_existing_mount.stdout | trim | length > 0 and
         storage_fstype.stdout | trim in ['ext4', 'xfs', 'btrfs']) or
        (storage_existing_mount.stdout | trim | length == 0 and
         storage_fstype.stdout | trim == 'ext4')
    fail_msg: >-
      Selected storage /dev/{{ storage }} uses '{{ storage_fstype.stdout | trim }}'.
      Mounted storage must use ext4/xfs/btrfs; unmounted storage must already be
      ext4. SynthRAN will not format the device.

- name: Create the containerd directory on already-mounted storage
  ansible.builtin.file:
    path: "{{ storage_existing_mount.stdout | trim }}/containerd"
    state: directory
    mode: '0755'
  become: true
  when: storage_existing_mount.stdout | trim | length > 0

- name: Bind already-mounted storage to the containerd data directory
  ansible.builtin.shell: |
    mount --bind "{{ storage_existing_mount.stdout | trim }}/containerd" /var/lib/containerd
  become: true
  when: storage_existing_mount.stdout | trim | length > 0

- name: Mount unmounted ext4 storage at the containerd data directory
  ansible.builtin.shell: |
    mount -t ext4 -o defaults,noatime /dev/{{ storage }} /var/lib/containerd
  become: true
  when: storage_existing_mount.stdout | trim | length == 0

- name: Verify containerd storage is on a real filesystem
  ansible.builtin.shell: |
    fstype=$(findmnt -n -o FSTYPE /var/lib/containerd 2>/dev/null | head -1 || echo "NOT_MOUNTED")
    echo "$fstype"
    case "$fstype" in
      ext4|xfs|btrfs) exit 0 ;;
      *) exit 1 ;;
    esac
  register: containerd_storage_fstype
  changed_when: false
  become: true

- name: Report the selected containerd storage binding
  ansible.builtin.debug:
    msg: >-
      /dev/{{ storage }} ({{ storage_fstype.stdout | trim }}) ->
      {{ storage_existing_mount.stdout | trim if storage_existing_mount.stdout | trim | length > 0 else '/var/lib/containerd' }} ->
      /var/lib/containerd ({{ containerd_storage_fstype.stdout | trim }})

- name: Ensure kubelet base directory exists
  ansible.builtin.file:
    path: /var/lib/kubelet
    state: directory
    mode: '0755'
  become: true

- name: Mount tmpfs on /var/lib/kubelet for a colocated live 5G node
  ansible.builtin.mount:
    path: /var/lib/kubelet
    src: tmpfs
    fstype: tmpfs
    opts: size=5G
    state: mounted
  become: true
  when:
    - live_image_check.stdout == "live"
    - ran_node_name == core_node_name

- name: Check if kubelet config exists
  ansible.builtin.stat:
    path: /var/lib/kubelet/config.yaml
  register: kubelet_cfg

- name: Backup existing kubelet config if present
  ansible.builtin.copy:
    src: /var/lib/kubelet/config.yaml
    dest: /var/lib/kubelet/config.yaml.bak.{{ ansible_date_time.epoch }}
    remote_src: true
  when: kubelet_cfg.stat.exists

- name: Ensure kubelet config exists
  ansible.builtin.file:
    path: /var/lib/kubelet/config.yaml
    state: touch
    mode: '0644'
    access_time: preserve
    modification_time: preserve

- name: Remove rootDir from kubelet config if present
  ansible.builtin.lineinfile:
    path: /var/lib/kubelet/config.yaml
    regexp: '^\s*rootDir:'
    state: absent
  become: true

- name: Configure kubelet storage eviction thresholds
  ansible.builtin.blockinfile:
    path: /var/lib/kubelet/config.yaml
    block: |
      evictionHard:
        nodefs.available: "{{ '2%' if (core_node_name == ran_node_name) else '10%' }}"
        imagefs.available: "{{ '2%' if (core_node_name == ran_node_name) else '10%' }}"
      {% if core_node_name == ran_node_name %}
      evictionMinimumReclaim:
        nodefs.available: "500Mi"
      {% endif %}
      imageGCHighThresholdPercent: 85
      imageGCLowThresholdPercent: 80
    marker: "# {mark} KUBELET STORAGE PATCH"
  become: true

- name: Check if containerd service exists
  ansible.builtin.shell: systemctl list-unit-files | grep -q '^containerd\.service'
  register: containerd_service
  changed_when: false
  failed_when: false

- name: Reload systemd and restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true
  when: containerd_service.rc == 0

- name: Check if kubelet service exists
  ansible.builtin.shell: systemctl list-unit-files | grep -q '^kubelet\.service'
  register: kubelet_service
  changed_when: false
  failed_when: false

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    enabled: true
    daemon_reload: true
  when: kubelet_service.rc == 0

- name: Check /var/lib/containerd mount fstype
  ansible.builtin.shell: |
    findmnt -n -o FSTYPE /var/lib/containerd 2>/dev/null | head -1 || echo "NOT_MOUNTED"
  register: containerd_mount
  changed_when: false
  become: true

- name: Report the containerd storage filesystem
  ansible.builtin.debug:
    msg: "/var/lib/containerd uses {{ containerd_mount.stdout | trim }} on selected storage /dev/{{ storage }}"

- name: Fail if /var/lib/containerd is not on a real filesystem
  ansible.builtin.fail:
    msg: >-
      /var/lib/containerd fstype is '{{ containerd_mount.stdout | trim }}'; expected ext4/xfs/btrfs.
  when: containerd_mount.stdout | trim not in ['ext4', 'xfs', 'btrfs']

- name: Verify kubelet evictionHard and imageGC
  ansible.builtin.shell: |
    grep 'evictionHard' /var/lib/kubelet/config.yaml && echo "OK" || echo "MISSING"
  register: kubelet_config_check
  changed_when: false
  become: true

- name: Report kubelet storage policy validation
  ansible.builtin.debug:
    msg: "Kubelet eviction policy: {{ 'configured' if 'evictionHard' in kubelet_config_check.stdout else 'missing' }}"

- name: Fail if evictionHard is missing from kubelet config
  ansible.builtin.fail:
    msg: "evictionHard not found in /var/lib/kubelet/config.yaml"
  when: '"evictionHard" not in kubelet_config_check.stdout'
