---
- name: Normalize the deployment bridge flag
  ansible.builtin.set_fact:
    bridge_enabled: "{{ bridge_enabled | default(false) | bool }}"

- name: Record the Ubuntu release codename
  ansible.builtin.set_fact:
    os_codename: "{{ ansible_distribution_release }}"

- name: Configure the Ubuntu main repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }} main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Configure the Ubuntu updates repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }}-updates main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Configure the Ubuntu security repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }}-security main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Repair interrupted package operations
  ansible.builtin.shell: |
    dpkg --configure -a
    apt -f install -y
  become: true
  changed_when: false

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - emacs
      - tmux
      - git
      - curl
      - iproute2
      - tcpdump
      - python3-pip
      - python3-venv
      - jq
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Disable swap
  ansible.builtin.shell: |
    changed=false
    if swapon --noheadings | grep -q .; then
      swapoff -a
      changed=true
    fi
    if grep -Eq '^[^#].*[[:space:]]swap[[:space:]]' /etc/fstab; then
      sed -i.bak '/ swap / s/^/#/' /etc/fstab
      changed=true
    fi
    echo "$changed"
  become: true
  register: swap_result
  changed_when: swap_result.stdout | trim == 'true'

- name: Load kernel modules for Kubernetes networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Ensure kernel modules are loaded on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  become: true

- name: Set sysctl parameters for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  become: true

- name: Apply the managed Kubernetes sysctl parameters
  ansible.builtin.command: sysctl --load=/etc/sysctl.d/k8s.conf
  become: true
  changed_when: false

- name: Read the configured timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: configured_timezone
  changed_when: false

- name: Set the infrastructure time zone to UTC
  ansible.builtin.command: timedatectl set-timezone Etc/UTC
  become: true
  when: configured_timezone.stdout | trim != 'Etc/UTC'

- name: Read clock synchronization status
  ansible.builtin.command: timedatectl show --property=Timezone --property=NTPSynchronized
  register: timedatectl_output
  changed_when: false

- name: Confirm synchronized system clock
  ansible.builtin.debug:
    msg: "{{ timedatectl_output.stdout_lines | join(', ') }}"
