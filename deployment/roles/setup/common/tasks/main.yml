---
- name: Resolve deployment feature flags on every host
  ansible.builtin.set_fact:
    fhi72: "{{ (hostvars[item].get('fhi72', False) | bool) }}"
    aw2s: "{{ (hostvars[item].get('aw2s', False) | bool) }}"
    f3_ran: "{{ (hostvars[item].get('f3_ran', False) | bool) }}"
    bridge_enabled: "{{ (hostvars[item].get('bridge_enabled', False) | bool) }}"
  loop: "{{ groups['all'] }}"
  delegate_to: "{{ item }}"
  run_once: true
  loop_control:
    label: "{{ item }}"

# fix ubuntu mirror issue
- name: Record the Ubuntu release codename
  ansible.builtin.set_fact:
    os_codename: "{{ ansible_distribution_release }}"

- name: Configure the Ubuntu main repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }} main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Configure the Ubuntu updates repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }}-updates main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Configure the Ubuntu security repository
  ansible.builtin.apt_repository:
    repo: "deb http://fr.archive.ubuntu.com/ubuntu {{ os_codename }}-security main restricted universe multiverse"
    state: present
    filename: ubuntu

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Repair interrupted package operations
  ansible.builtin.shell: |
    dpkg --configure -a
    apt -f install -y
  become: true
  changed_when: false
  
- name: Install required system packages
  apt:
    name:
      - emacs
      - tmux
      - git
      - curl
      - iproute2
      - tcpdump
      - python3-pip
      - python3-venv        # Replaces virtualenv (PEP-668 safe)
      - jq
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Disable swap
  shell: |
    changed=false
    if swapon --noheadings | grep -q .; then
      swapoff -a
      changed=true
    fi
    if grep -Eq '^[^#].*[[:space:]]swap[[:space:]]' /etc/fstab; then
      sed -i.bak '/ swap / s/^/#/' /etc/fstab
      changed=true
    fi
    echo "$changed"
  become: true
  register: swap_result
  changed_when: swap_result.stdout | trim == 'true'

- name: Load kernel modules for Kubernetes networking
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Ensure kernel modules are loaded on boot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  become: true

- name: Set sysctl parameters for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  become: true

- name: Apply sysctl parameters
  command: sysctl --system
  become: true
  changed_when: false

# Keep every infrastructure timestamp in UTC for reproducible correlation.
- name: Read the configured timezone
  command: timedatectl show --property=Timezone --value
  register: configured_timezone
  changed_when: false

- name: Set the infrastructure time zone to UTC
  command: timedatectl set-timezone Etc/UTC
  become: true
  when: configured_timezone.stdout | trim != 'Etc/UTC'
  
- name: Read clock synchronization status
  command: timedatectl show --property=Timezone --property=NTPSynchronized
  register: timedatectl_output
  changed_when: false

- name: Confirm synchronized system clock
  debug:
    msg: "{{ timedatectl_output.stdout_lines | join(', ') }}"

# install dhp service on the node, required later for k8s dhcp cni
- name: Install systemd service for CNI DHCP daemon
  ansible.builtin.copy:
    dest: /etc/systemd/system/cni-dhcp.service
    mode: '0644'
    content: |
      [Unit]
      Description=CNI DHCP Daemon
      After=network.target

      [Service]
      ExecStart=/opt/cni/bin/dhcp daemon
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  become: true

- name: Enable and start CNI DHCP daemon
  ansible.builtin.systemd:
    name: cni-dhcp.service
    enabled: yes
    state: started
  become: true
