---
- name: Ensure OVS is installed
  ansible.builtin.apt:
    name: openvswitch-switch
    state: present
    update_cache: yes
  become: true

- name: Ensure OVS services are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - ovsdb-server
    - ovs-vswitchd
  become: true

- name: Define OVS bridges
  set_fact:
    ovs_bridges: >-
      {{ ['n2br', 'n3br'] +
         (['n4br'] if inventory_hostname in groups['core_node'] or core == 'free5gc' else []) }}

- name: Create OVS bridges
  ansible.builtin.shell: |
    if ovs-vsctl br-exists {{ item }}; then
      echo existing
    else
      ovs-vsctl add-br {{ item }}
      echo created
    fi
  loop: "{{ ovs_bridges }}"
  register: ovs_bridge_create
  changed_when: ovs_bridge_create.stdout | trim == 'created'
  become: true

- name: Remove a legacy N4 bridge from the RAN host
  ansible.builtin.shell: |
    if ovs-vsctl br-exists n4br; then
      ovs-vsctl del-br n4br
      echo removed
    else
      echo absent
    fi
  register: legacy_ran_n4_cleanup
  changed_when: legacy_ran_n4_cleanup.stdout | trim == 'removed'
  become: true
  when:
    - inventory_hostname not in groups['core_node']
    - core != 'free5gc'

# following unused now
- name: Pin ovs-vswitchd on cores 0-5 (RAN node only)
  block:
    - name: Enable CPUAffinity override dir
      ansible.builtin.file:
        path: /etc/systemd/system/ovs-vswitchd.service.d
        state: directory
    - name: Apply CPUAffinity for ovs-vswitchd
      ansible.builtin.copy:
        dest: /etc/systemd/system/ovs-vswitchd.service.d/cpu-affinity.conf
        content: |
          [Service]
          CPUAffinity=0-5
    - name: Restart ovs-vswitchd with new affinity
      ansible.builtin.systemd:
        daemon_reload: yes
        name: ovs-vswitchd
        state: restarted
  become: true
  when: fhi72 and inventory_hostname in groups['ran_node']


#  Verification
- name: Verify OVS daemons
  ansible.builtin.service_facts:

- name: Validate OVS service health
  ansible.builtin.assert:
    that:
      - services['ovsdb-server.service'].state == 'running'
      - services['ovs-vswitchd.service'].state == 'running'
    fail_msg: "One or more Open vSwitch services are not running on {{ inventory_hostname }}"
    success_msg: "Open vSwitch services are running"

- name: Verify OVS bridges
  ansible.builtin.command: "ovs-vsctl br-exists {{ item }}"
  loop: "{{ ovs_bridges }}"
  become: true
  changed_when: false
  
