---
# Execution-only deployment tooling. This role is deliberately separate from
# accepted host/Kubernetes state: fresh bootstrap may establish it, while a
# preserve run establishes it only after bootstrap at the deployment boundary.

- name: Require Python venv support for the deployment runtime
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - --help
  changed_when: false

- name: Create the shared Ansible Kubernetes runtime
  ansible.builtin.command: python3 -m venv /opt/ansible-venv
  args:
    creates: /opt/ansible-venv/bin/python
  become: true

- name: Read the installed Kubernetes Python client version
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/python
      - -c
      - "import importlib.metadata; print(importlib.metadata.version('kubernetes'))"
  register: kubernetes_python_client
  changed_when: false
  failed_when: false

- name: Install the exact Kubernetes Python client
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/pip
      - install
      - --disable-pip-version-check
      - --no-input
      - "kubernetes=={{ kubernetes_python_version }}"
  become: true
  when: kubernetes_python_client.stdout | default('') | trim != kubernetes_python_version

- name: Verify the Kubernetes Python client version
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/python
      - -c
      - "import importlib.metadata; assert importlib.metadata.version('kubernetes') == '{{ kubernetes_python_version }}'"
  changed_when: false

- name: Use the shared Kubernetes-enabled Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python

- name: Resolve Helm release architecture
  ansible.builtin.set_fact:
    synthran_helm_arch: >-
      {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64']
         else 'arm64' if ansible_architecture in ['aarch64', 'arm64']
         else '' }}

- name: Require a checksum-pinned Helm architecture
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_helm_arch | length > 0
      - synthran_helm_arch in helm_sha256
    fail_msg: "No pinned Helm checksum for architecture {{ ansible_architecture }}"

- name: Read the installed Helm version
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: synthran_helm_installed
  changed_when: false
  failed_when: false

- name: Download the checksum-pinned Helm release
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    dest: "/tmp/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    mode: '0644'
    checksum: "sha256:{{ helm_sha256[synthran_helm_arch] }}"
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Extract the checksum-verified Helm release
  ansible.builtin.unarchive:
    src: "/tmp/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Install the exact Helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ synthran_helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Verify the exact Helm version
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: synthran_helm_verified
  changed_when: false

- name: Require the checksum-pinned Helm release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in synthran_helm_verified.stdout"
    fail_msg: "Helm does not match the pinned v{{ helm_version }} baseline"

- name: Resolve yq release architecture
  ansible.builtin.set_fact:
    synthran_yq_arch: >-
      {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64']
         else 'arm64' if ansible_architecture in ['aarch64', 'arm64']
         else '' }}

- name: Require a checksum-pinned yq architecture
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_yq_arch | length > 0
      - synthran_yq_arch in yq_sha256
    fail_msg: "No pinned yq checksum for architecture {{ ansible_architecture }}"

- name: Read the installed yq version
  ansible.builtin.command:
    argv:
      - "{{ yq_bin_path }}"
      - --version
  register: synthran_yq_installed
  changed_when: false
  failed_when: false

- name: Install the checksum-pinned yq release
  ansible.builtin.get_url:
    url: >-
      https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_{{ synthran_yq_arch }}
    dest: "{{ yq_bin_path }}"
    owner: root
    group: root
    mode: '0755'
    force: true
    checksum: "sha256:{{ yq_sha256[synthran_yq_arch] }}"
  when: yq_version not in (synthran_yq_installed.stdout | default(''))
  become: true

- name: Verify the exact yq version
  ansible.builtin.command:
    argv:
      - "{{ yq_bin_path }}"
      - --version
  register: synthran_yq_verified
  changed_when: false

- name: Require the checksum-pinned yq release
  ansible.builtin.assert:
    quiet: true
    that:
      - yq_version in synthran_yq_verified.stdout
    fail_msg: >-
      {{ yq_bin_path }} does not match the pinned {{ yq_version }} baseline:
      {{ synthran_yq_verified.stdout | default(synthran_yq_verified.stderr) }}
