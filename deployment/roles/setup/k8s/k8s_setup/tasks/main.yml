---
- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Download Kubernetes GPG key
  ansible.builtin.shell: |
    curl -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key" | \
      gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Configure the exact Kubernetes minor APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: '0644'
    content: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/ /
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: yes
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Release previous Kubernetes package holds before an exact upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Install exact supported kubelet, kubeadm, and kubectl versions
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    update_cache: no
    allow_change_held_packages: true
  become: true
  register: k8s_install
  retries: 5
  delay: 10
  until: k8s_install is succeeded
  when: ansible_facts.os_family == 'Debian'

- name: Read installed Kubernetes component versions
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  loop:
    - {name: kubeadm, argv: [kubeadm, version, -o, short]}
    - {name: kubelet, argv: [kubelet, --version]}
    - {name: kubectl, argv: [kubectl, version, --client=true]}
  loop_control:
    label: "{{ item.name }}"
  register: synthran_kubernetes_versions
  changed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Require every Kubernetes binary to match the pinned patch release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ kubernetes_version) in item.stdout"
    fail_msg: >-
      {{ item.item.name }} does not match the pinned Kubernetes v{{ kubernetes_version }} baseline:
      {{ item.stdout | default(item.stderr) }}
  loop: "{{ synthran_kubernetes_versions.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('kubernetes-component') }}"
  when: ansible_facts.os_family == 'Debian'

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Create the shared Ansible Kubernetes runtime
  ansible.builtin.command: python3 -m venv /opt/ansible-venv
  args:
    creates: /opt/ansible-venv/bin/python
  become: true

- name: Read the installed Kubernetes Python client version
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/python
      - -c
      - "import importlib.metadata; print(importlib.metadata.version('kubernetes'))"
  register: kubernetes_python_client
  changed_when: false
  failed_when: false

- name: Install the exact Kubernetes Python client
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/pip
      - install
      - --disable-pip-version-check
      - --no-input
      - "kubernetes=={{ kubernetes_python_version }}"
  become: true
  when: kubernetes_python_client.stdout | default('') | trim != kubernetes_python_version

- name: Verify the Kubernetes Python client version
  ansible.builtin.command:
    argv:
      - /opt/ansible-venv/bin/python
      - -c
      - "import importlib.metadata; assert importlib.metadata.version('kubernetes') == '{{ kubernetes_python_version }}'"
  changed_when: false

- name: Use the shared Kubernetes-enabled Python runtime
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python

- name: Resolve Helm release architecture
  ansible.builtin.set_fact:
    synthran_helm_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64'
         else 'arm64' if ansible_architecture in ['aarch64', 'arm64']
         else '' }}

- name: Require a checksum-pinned Helm architecture
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_helm_arch in helm_sha256
    fail_msg: "No pinned Helm checksum for architecture {{ ansible_architecture }}"

- name: Read the installed Helm version
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: synthran_helm_installed
  changed_when: false
  failed_when: false

- name: Download the checksum-pinned Helm release
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    dest: "/tmp/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    mode: '0644'
    checksum: "sha256:{{ helm_sha256[synthran_helm_arch] }}"
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Extract the checksum-verified Helm release
  ansible.builtin.unarchive:
    src: "/tmp/helm-v{{ helm_version }}-linux-{{ synthran_helm_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Install the exact Helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ synthran_helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  when: "('v' ~ helm_version) not in (synthran_helm_installed.stdout | default(''))"
  become: true

- name: Verify the exact Helm version
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: synthran_helm_verified
  changed_when: false

- name: Require the checksum-pinned Helm release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('v' ~ helm_version) in synthran_helm_verified.stdout"
    fail_msg: "Helm does not match the pinned v{{ helm_version }} baseline"
