---

- name: Ensure CPUAffinity 5-15 is set in system.conf
  become: true
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^CPUAffinity='
    line: 'CPUAffinity=5-15'
    state: present

- name: Reload systemd config
  become: true
  ansible.builtin.command:
    cmd: systemctl daemon-reexec

- name: Add Kubernetes and RT settings to sysctl.conf
  become: true
  ansible.builtin.blockinfile:
    path: /etc/sysctl.conf
    insertafter: EOF
    block: |
      ## For kubernetes
      fs.inotify.max_user_instances=65536
      ## Realtime kernel settings
      kernel.sched_rt_runtime_us=-1
      kernel.timer_migration=0
    marker: "# {mark} RAN tuning"

- name: Apply sysctl changes (reload)
  become: true
  ansible.builtin.command:
    cmd: sysctl -p
  changed_when: false

- name: Ensure python3 and PyYAML are installed
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-yaml
    state: present
    update_cache: yes

# CPU Manager is a stable kubelet capability in the pinned Kubernetes baseline.
# Kubernetes 1.36 no longer recognizes the old CPUManager feature gate, so CPU
# policy must be configured through the stable KubeletConfiguration fields only.
# Stop kubelet and clear its checkpoint before changing policy, as required by
# the Kubernetes CPU Manager policy-change procedure.
- name: Stop kubelet before changing CPU Manager policy
  become: true
  ansible.builtin.systemd:
    name: kubelet
    state: stopped

- name: Remove stale CPU Manager checkpoint before changing policy
  become: true
  ansible.builtin.file:
    path: /var/lib/kubelet/cpu_manager_state
    state: absent

- name: Merge stable CPU Manager settings into kubelet config
  become: true
  ansible.builtin.shell: |
    python3 - <<'EOF'
    import os
    import yaml

    cfg = "/var/lib/kubelet/config.yaml"
    patch = {
        "cgroupDriver": "systemd",
        "cpuManagerPolicy": "static",
        "cpuManagerPolicyOptions": {"full-pcpus-only": "true"},
        "reservedSystemCPUs": "0-15",
        "failSwapOn": False,
    }

    # Storage eviction settings are owned by pre_k8s. On a shared core+RAN
    # node only, retain the tighter shared-node thresholds used by this role.
    is_shared_node = {{ True if (ran_node_name == core_node_name) else False }}
    if is_shared_node:
        patch["evictionHard"] = {
            "nodefs.available": "2%",
            "imagefs.available": "2%",
        }
        patch["evictionMinimumReclaim"] = {
            "nodefs.available": "500Mi",
        }

    if not os.path.exists(cfg):
        raise SystemExit("ERROR: kubelet config not found")

    with open(cfg) as handle:
        data = yaml.safe_load(handle) or {}

    # Sanitize legacy values as well as avoiding new ones. This makes a rerun
    # safe even if /var/lib/kubelet/config.yaml came from an older SynthRAN run.
    feature_gates = data.get("featureGates")
    if isinstance(feature_gates, dict):
        feature_gates.pop("CPUManager", None)
        feature_gates.pop("CPUManagerPolicyOptions", None)
        if not feature_gates:
            data.pop("featureGates", None)

    # rootDir is kubelet's state directory and must never point at containerd.
    data.pop("rootDir", None)

    for key, value in patch.items():
        data[key] = value

    tmp = cfg + ".tmp"
    with open(tmp, "w") as handle:
        yaml.safe_dump(data, handle, default_flow_style=False, sort_keys=False)
    os.replace(tmp, cfg)
    print("APPLIED")
    EOF
  register: merge_result
  changed_when: "'APPLIED' in merge_result.stdout"

- name: Validate CPU Manager kubelet configuration before restart
  become: true
  ansible.builtin.shell: |
    python3 - <<'EOF'
    import yaml

    cfg = "/var/lib/kubelet/config.yaml"
    with open(cfg) as handle:
        data = yaml.safe_load(handle) or {}

    gates = data.get("featureGates") or {}
    forbidden = [
        name for name in ("CPUManager", "CPUManagerPolicyOptions")
        if name in gates
    ]
    if forbidden:
        raise SystemExit(
            "removed/obsolete kubelet feature gates remain: " + ", ".join(forbidden)
        )
    if data.get("cpuManagerPolicy") != "static":
        raise SystemExit("cpuManagerPolicy must be static")
    if (data.get("cpuManagerPolicyOptions") or {}).get("full-pcpus-only") != "true":
        raise SystemExit("full-pcpus-only CPU Manager policy option is missing")
    if data.get("reservedSystemCPUs") != "0-15":
        raise SystemExit("reservedSystemCPUs does not match the SynthRAN RAN baseline")
    if "rootDir" in data:
        raise SystemExit("rootDir must not be present in kubelet configuration")
    print("VALID")
    EOF
  register: cpu_manager_config_validation
  changed_when: false

- name: Start kubelet with the validated CPU Manager policy
  become: true
  ansible.builtin.systemd:
    name: kubelet
    state: started
    daemon_reload: yes

- name: Require kubelet to remain active after CPU Manager tuning
  become: true
  ansible.builtin.command: systemctl is-active kubelet
  register: kubelet_active_after_cpu_tuning
  changed_when: false
  retries: 12
  delay: 5
  until: kubelet_active_after_cpu_tuning.stdout | trim == 'active'
