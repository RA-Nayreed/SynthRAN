---
- name: Power ON "{{ rru }}" PDU outlet
  shell: rhubarbe pdu on "{{ rru }}"

- name: Wait 210 seconds for the "{{ rru }}" RRU to be ready
  pause:
    seconds: 210
  when: rru in ['benetel1', 'benetel2'] and ran in ['srsRAN', 'oai']

- name: "Prepare {{ rru }} RRU (switch on, load conf, reboot)"
  shell: "/usr/local/bin/prepare-{{ rru }}-for-{{ ran | lower }}.sh"
  when: rru in ['benetel1', 'benetel2'] and ran in ['srsRAN', 'oai']
  register: prepare_rru_output

- name: Report R2Lab radio preparation
  debug:
    msg: "{{ prepare_rru_output.stdout | default('Task skipped') }}"

- name: Verify PDU status
  shell: rhubarbe pdu status "{{ rru }}"
  register: pdu_status

- name: Report R2Lab PDU status
  debug:
    var: pdu_status.stdout

# no need to actively wait for 210, time required for other tasks much longer
