---
- name: START_UE_SETUP
  ansible.builtin.meta: noop

- name: Build UE lists
  ansible.builtin.set_fact:
    all_ues: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) }}"

- name: Power OFF QHAT UEs
  ansible.builtin.shell: rhubarbe pdu off "{{ item }}"
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  failed_when: false
  changed_when: false
  loop: "{{ groups['qhats'] | default([]) }}"
  register: qhat_off_jobs

- name: Power OFF QFIT UEs
  ansible.builtin.shell: qfit off {{ groups['qfits'] | join(' ') }}
  delegate_to: faraday.inria.fr
  when: groups['qfits'] is defined and groups['qfits'] | length > 0
  failed_when: false
  changed_when: false

- name: Wait for UE power-off
  ansible.builtin.pause:
    seconds: 20

- name: Power ON QHAT UEs
  ansible.builtin.shell: rhubarbe pdu on "{{ item }}"
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  loop: "{{ groups['qhats'] | default([]) }}"
  register: qhat_on_jobs

- name: Wait QHAT ON completion
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: qhat_on_status
  until: qhat_on_status.finished
  retries: 12
  delay: 5
  loop: "{{ qhat_on_jobs.results }}"

- name: Power ON QFIT UEs
  ansible.builtin.shell: qfit on {{ groups['qfits'] | join(' ') }}
  delegate_to: faraday.inria.fr
  when: groups['qfits'] is defined and groups['qfits'] | length > 0

- name: Ping UEs
  ansible.builtin.shell: "ping -c1 -W1 {{ item }}"
  delegate_to: faraday.inria.fr
  register: ping_results
  ignore_errors: true
  changed_when: false
  retries: 12
  delay: 10
  until: ping_results.rc == 0
  loop: "{{ all_ues }}"

- name: Build reachable UEs
  ansible.builtin.set_fact:
    reachable_ues: >-
      {{
        ping_results.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}

- name: SSH check
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 22
    timeout: 20
  delegate_to: faraday.inria.fr
  register: ssh_results
  ignore_errors: true
  loop: "{{ reachable_ues }}"

- name: Compute failed UEs
  ansible.builtin.set_fact:
    failed_ues: "{{ all_ues | difference(reachable_ues) }}"

- name: Report failed UEs
  ansible.builtin.debug:
    msg: "UEs not reachable after boot: {{ failed_ues }}"
  when: failed_ues | length > 0

# This role owns only the hardware boot/init baseline. The deployment playbook
# applies the selected network profile (DNN/S-NSSAI) after this role returns.
- name: Initialize UEs to their hardware baseline
  ansible.builtin.shell: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }}
    'qhat-init'
  delegate_to: faraday.inria.fr
  async: 1800
  poll: 0
  loop: "{{ reachable_ues }}"
  register: set_ue_jobs

- name: Wait init completion
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ set_ue_jobs.results }}"
  register: job_result
  until: job_result.finished
  retries: 20
  delay: 10

# Mode-aware stop, run as its own parallel async batch.
# Best-effort: a stop failure must NOT abort the setup (unlike qhat-init).
#   mbim -> stop.sh   |   qmi -> ci_ctl_qtel.py <at_port> detach
# at_port defaults to /dev/ttyUSB3 (AT port after qhat-init's QMI switch);
# override per node in the inventory with at_port=/dev/ttyUSBx if needed.
- name: Stop UEs after init (parallel, best-effort)
  ansible.builtin.shell: >
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }}
    '{{ ue_stop_cmd }}'
  vars:
    ue_stop_cmd: >-
      {{ 'stop.sh'
         if (hostvars[item].mode | default('mbim', true)) == 'mbim'
         else 'python3 /usr/local/bin/ci_ctl_qtel.py '
              ~ (hostvars[item].at_port | default('/dev/ttyUSB3')) ~ ' detach' }}
  delegate_to: faraday.inria.fr
  async: 300
  poll: 0
  loop: "{{ reachable_ues }}"
  register: stop_ue_jobs

- name: Wait stop completion (best-effort)
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ stop_ue_jobs.results }}"
  register: stop_result
  until: stop_result.finished
  retries: 20
  delay: 5
  failed_when: false
  ignore_errors: true

- name: Run qhat-check
  ansible.builtin.shell: ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ item }} 'qhat-check'
  delegate_to: faraday.inria.fr
  loop: "{{ reachable_ues }}"
  register: check_results
  changed_when: false
  ignore_errors: true

- name: Display qhat-check
  ansible.builtin.debug:
    msg:
      - "UE: {{ item.item }}"
      - "{{ item.stdout_lines }}"
  loop: "{{ check_results.results }}"
