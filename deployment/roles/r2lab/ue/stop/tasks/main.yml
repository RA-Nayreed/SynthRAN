---
- name: START_UE_STOP
  ansible.builtin.meta: noop

- name: Resolve selected UE for this stop invocation
  ansible.builtin.set_fact:
    r2lab_stop_target: "{{ ue_item if ue_item is defined else ue }}"

- name: Resolve UE connection mode
  ansible.builtin.set_fact:
    ue_mode: "{{ hostvars[r2lab_stop_target].mode | default('mbim') }}"

- name: Detect whether this UE is a phone
  ansible.builtin.set_fact:
    is_phone: "{{ r2lab_stop_target in (groups['phones'] | default([])) }}"

- name: Resolve direct R2Lab SSH host-key policy
  ansible.builtin.set_fact:
    r2lab_direct_ssh_options: >-
      {{ '-o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=yes'
         if (r2lab_strict_host_key_checking | default(false) | bool)
         else '-o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=no' }}

- name: Phone - resolve adb / ssh parameters for {{ r2lab_stop_target }}
  ansible.builtin.set_fact:
    phone_ssh: "{{ hostvars[r2lab_stop_target].ansible_user | default('tester') }}@{{ hostvars[r2lab_stop_target].ansible_host | default('mac' ~ r2lab_stop_target) }}"
    adb_bin: "{{ hostvars[r2lab_stop_target].adb_bin | default('adb') }}"
    adb_opts: "{{ ('-s ' ~ hostvars[r2lab_stop_target].serial) if (hostvars[r2lab_stop_target].serial is defined and (hostvars[r2lab_stop_target].serial | string | length) > 0) else '' }}"
  when: is_phone

- name: Phone - airplane mode ON for selected UE {{ r2lab_stop_target }}
  ansible.builtin.shell: >
    ssh {{ r2lab_direct_ssh_options }} -i /home/faraday/r2lab-embedded/mac-ssh-keys/macphone
    {{ phone_ssh }}
    '{{ adb_bin }} {{ adb_opts }} shell cmd connectivity airplane-mode enable'
  delegate_to: faraday.inria.fr
  when: is_phone
  ignore_errors: true

- name: Phone - verify airplane mode is ON for {{ r2lab_stop_target }}
  ansible.builtin.shell: >
    ssh {{ r2lab_direct_ssh_options }} -i /home/faraday/r2lab-embedded/mac-ssh-keys/macphone
    {{ phone_ssh }}
    '{{ adb_bin }} {{ adb_opts }} shell settings get global airplane_mode_on'
  register: phone_apm
  delegate_to: faraday.inria.fr
  when: is_phone
  changed_when: false
  ignore_errors: true

- name: MBIM - stop selected UE {{ r2lab_stop_target }} via jump host
  ansible.builtin.shell: ssh {{ r2lab_direct_ssh_options }} root@{{ r2lab_stop_target }} 'stop.sh'
  delegate_to: faraday.inria.fr
  when:
    - not is_phone
    - ue_mode == 'mbim'
  ignore_errors: true

- name: QMI - detach selected UE {{ r2lab_stop_target }} via jump host
  ansible.builtin.shell: ssh {{ r2lab_direct_ssh_options }} root@{{ r2lab_stop_target }} 'python3 /usr/local/bin/ci_ctl_qtel.py /dev/ttyUSB2 detach'
  delegate_to: faraday.inria.fr
  when:
    - not is_phone
    - ue_mode == 'qmi'
  ignore_errors: true
