---
- name: Require one selected UE stop contract
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_r2lab_ue is mapping
      - synthran_r2lab_ue.device | string | length > 0
      - synthran_r2lab_ue.tunnel.host == synthran_r2lab_ue.device
      - synthran_r2lab_ue.tunnel.interface == 'wwan0'
      - synthran_r2lab_ue.tunnel.mode in ['mbim', 'qmi']
      - (synthran_cleanup_phase | default('predeploy')) in ['predeploy', 'teardown']
    fail_msg: >-
      Selected R2Lab cleanup must consume exactly one qhat/qfit deployment-contract
      entry on the supported wwan0 MBIM/QMI lifecycle.

- name: Resolve selected UE stop identity
  ansible.builtin.set_fact:
    synthran_stop_device: "{{ synthran_r2lab_ue.device }}"
    synthran_stop_mode: "{{ synthran_r2lab_ue.tunnel.mode }}"
    synthran_stop_phase: "{{ synthran_cleanup_phase | default('predeploy') }}"

- name: Stop the selected MBIM UE
  ansible.builtin.command: stop.sh
  delegate_to: "{{ synthran_stop_device }}"
  environment:
    SYNTHRAN_STOP_DEVICE: "{{ synthran_stop_device }}"
  register: synthran_stop_mbim
  changed_when: true
  failed_when: false
  when: synthran_stop_mode == 'mbim'

- name: Detect the selected QMI UE AT control port
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import glob
    import serial
    import sys

    for port in sorted(glob.glob('/dev/ttyUSB*')):
        try:
            with serial.Serial(port, 115200, timeout=0.4) as modem:
                modem.write(b'AT\r')
                response = modem.read(64)
            if b'OK' in response:
                print(port)
                sys.exit(0)
        except Exception:
            pass
    sys.exit(1)
    PYEOF
  args:
    executable: /bin/bash
  delegate_to: "{{ synthran_stop_device }}"
  register: synthran_stop_at_detect
  changed_when: false
  failed_when: false
  when:
    - synthran_stop_mode == 'qmi'
    - hostvars[synthran_stop_device].at_port is not defined

- name: Resolve the selected QMI UE AT control port
  ansible.builtin.set_fact:
    synthran_stop_qmi_at_port: >-
      {{ hostvars[synthran_stop_device].at_port |
         default(synthran_stop_at_detect.stdout | default('') | trim, true) }}
  when: synthran_stop_mode == 'qmi'

- name: Detach the selected QMI UE
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/bin/ci_ctl_qtel.py
      - "{{ synthran_stop_qmi_at_port }}"
      - detach
  delegate_to: "{{ synthran_stop_device }}"
  environment:
    SYNTHRAN_STOP_DEVICE: "{{ synthran_stop_device }}"
  register: synthran_stop_qmi
  changed_when: true
  failed_when: false
  when:
    - synthran_stop_mode == 'qmi'
    - synthran_stop_qmi_at_port | default('') | length > 0

- name: Read selected UE diagnostics after the stop attempt
  ansible.builtin.command: qhat-check
  delegate_to: "{{ synthran_stop_device }}"
  environment:
    SYNTHRAN_STOP_DEVICE: "{{ synthran_stop_device }}"
  register: synthran_stop_check
  changed_when: false
  failed_when: false

- name: Retain selected UE stop evidence before enforcing success
  ansible.builtin.copy:
    content: |
      phase={{ synthran_stop_phase }}
      device={{ synthran_stop_device }}
      mode={{ synthran_stop_mode }}
      interface={{ synthran_r2lab_ue.tunnel.interface }}
      mbim_session={{ synthran_r2lab_ue.tunnel.mbim_session | default('') }}
      helper_command={{ 'stop.sh' if synthran_stop_mode == 'mbim' else ('python3 /usr/local/bin/ci_ctl_qtel.py ' ~ (synthran_stop_qmi_at_port | default('')) ~ ' detach') }}
      helper_rc={{ synthran_stop_mbim.rc | default(synthran_stop_qmi.rc | default('not-run')) }}
      helper_stdout={{ synthran_stop_mbim.stdout | default(synthran_stop_qmi.stdout | default('')) }}
      helper_stderr={{ synthran_stop_mbim.stderr | default(synthran_stop_qmi.stderr | default('')) }}
      qmi_at_port={{ synthran_stop_qmi_at_port | default('') }}
      qmi_at_probe_rc={{ synthran_stop_at_detect.rc | default('not-run') }}
      qmi_at_probe_stdout={{ synthran_stop_at_detect.stdout | default('') }}
      qmi_at_probe_stderr={{ synthran_stop_at_detect.stderr | default('') }}
      qhat_check_rc={{ synthran_stop_check.rc | default('unavailable') }}
      qhat_check_stdout={{ synthran_stop_check.stdout | default('') }}
      qhat_check_stderr={{ synthran_stop_check.stderr | default('') }}
    dest: "{{ run_dir }}/r2lab-ue-{{ synthran_stop_device }}-{{ synthran_stop_phase }}-stop.log"
  delegate_to: localhost
  become: false

- name: Require the selected UE stop operation to complete
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        synthran_stop_mode != 'mbim' or
        (synthran_stop_mbim.rc | default(1)) == 0
      - >-
        synthran_stop_mode != 'qmi' or
        (synthran_stop_qmi_at_port | default('') | length > 0)
      - >-
        synthran_stop_mode != 'qmi' or
        (synthran_stop_qmi.rc | default(1)) == 0
    fail_msg: >-
      Selected R2Lab UE stop failed for {{ synthran_stop_device }} during
      {{ synthran_stop_phase }} cleanup. See
      r2lab-ue-{{ synthran_stop_device }}-{{ synthran_stop_phase }}-stop.log;
      the failure is not ignored or replaced by a global cleanup command.
