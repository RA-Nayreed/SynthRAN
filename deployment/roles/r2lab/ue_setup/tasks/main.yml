---
- name: Build the selected R2Lab UE list
  ansible.builtin.set_fact:
    synthran_r2lab_ues: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) }}"

- name: Load the active 5G profile for physical UE preparation
  ansible.builtin.include_vars:
    file: >-
      {{ fiveg_profile_file |
         default(playbook_dir ~ '/../group_vars/all/5g_profile_' ~ (fiveg_profile | default('default')) ~ '.yaml') }}
    name: synthran_fiveg

- name: Power off selected QHAT devices
  ansible.builtin.command: "rhubarbe pdu off {{ item }}"
  loop: "{{ groups['qhats'] | default([]) }}"
  changed_when: false
  failed_when: false

- name: Power off selected QFIT devices
  ansible.builtin.command: "qfit off {{ groups['qfits'] | join(' ') }}"
  when: groups['qfits'] | default([]) | length > 0
  changed_when: false
  failed_when: false

- name: Allow physical modems to power down
  ansible.builtin.pause:
    seconds: 20
  when: synthran_r2lab_ues | length > 0

- name: Power on selected QHAT devices
  ansible.builtin.command: "rhubarbe pdu on {{ item }}"
  loop: "{{ groups['qhats'] | default([]) }}"
  changed_when: true

- name: Power on selected QFIT devices
  ansible.builtin.command: "qfit on {{ groups['qfits'] | join(' ') }}"
  when: groups['qfits'] | default([]) | length > 0
  changed_when: true

- name: Wait for selected physical UEs to answer
  ansible.builtin.command: "ping -c 1 -W 1 {{ item }}"
  loop: "{{ synthran_r2lab_ues }}"
  changed_when: false
  register: synthran_r2lab_ping
  retries: 12
  delay: 10
  until: synthran_r2lab_ping.rc == 0

- name: Wait for SSH on every selected UE
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 22
    timeout: 120
  loop: "{{ synthran_r2lab_ues }}"

- name: Prepare the selected DNN with the installed R2Lab MBIM helper
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null root@{{ item }}
    prepare-ue --mode=mbim --dnn={{ synthran_ue_slice.dnn | quote }}
    {% if synthran_ue_slice.sd | string | upper != 'EMPTY' %}
    --nssai={{ ('%02x' | format(synthran_ue_slice.sst | int) ~ '.' ~ synthran_ue_slice.sd) | quote }}
    {% endif %}
  loop: "{{ synthran_r2lab_ues }}"
  when: hostvars[item].mode | default('mbim') == 'mbim'
  vars:
    synthran_ue_slice: >-
      {{ synthran_fiveg.slices
         | selectattr('name', 'equalto', synthran_fiveg.ues[item].slice)
         | first }}
  changed_when: true

- name: Initialize QMI UEs with the installed R2Lab helper
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null root@{{ item }} qhat-init
  loop: "{{ synthran_r2lab_ues }}"
  when: hostvars[item].mode | default('mbim') == 'qmi'
  changed_when: true

- name: Leave prepared UEs detached until the gNB is ready
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null root@{{ item }} {{ synthran_ue_stop }}
  vars:
    synthran_ue_stop: >-
      {{ 'env -u DNN1 stop.sh'
         if hostvars[item].mode | default('mbim') == 'mbim'
         else 'python3 /usr/local/bin/ci_ctl_qtel.py '
              ~ (hostvars[item].at_port | default('/dev/ttyUSB3')) ~ ' detach' }}
  loop: "{{ synthran_r2lab_ues }}"
  changed_when: true
  failed_when: false

- name: Retain the installed R2Lab diagnostic output
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null root@{{ item }} qhat-check
  loop: "{{ synthran_r2lab_ues }}"
  register: synthran_r2lab_ue_checks
  changed_when: false
  failed_when: false

- name: Report prepared physical UEs
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ item.stdout | default(item.stderr) }}"
  loop: "{{ synthran_r2lab_ue_checks.results }}"
  loop_control:
    label: "{{ item.item }}"
