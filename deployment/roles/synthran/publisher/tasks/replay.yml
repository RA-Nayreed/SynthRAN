---
- name: Replay through the upstream-managed R2Lab UE
  command: >-
    /opt/synthran-venv/bin/python -m synthran.cli workload replay
    --trace /tmp/synthran-events.jsonl --device {{ inventory_hostname }}
    --broker {{ synthran_effective_broker_address }} --port {{ mqtt_port }} --qos {{ mqtt_qos }}
    --interface wwan0
    --start-utc {{ hostvars['localhost'].synthran_physical_start_utc }}
    --output /var/log/synthran-publisher.jsonl
  environment:
    PYTHONPATH: /opt/synthran-source
  when: platform == 'r2lab'

- name: Replay through a non-R2Lab physical UE
  command: >-
    /opt/synthran-venv/bin/python -m synthran.cli workload replay
    --trace /tmp/synthran-events.jsonl --device {{ inventory_hostname }}
    --broker {{ synthran_effective_broker_address }} --port {{ mqtt_port }} --qos {{ mqtt_qos }}
    --interface {{ synthran_physical_binding.interface }}
    --bind-address {{ synthran_physical_binding.address }}
    --start-utc {{ hostvars['localhost'].synthran_physical_start_utc }}
    --output /var/log/synthran-publisher.jsonl
  environment:
    PYTHONPATH: /opt/synthran-source
  when: platform == 'physical'

- name: Fetch publisher records
  fetch: {src: /var/log/synthran-publisher.jsonl, dest: "{{ run_dir }}/publisher-{{ inventory_hostname }}.jsonl", flat: true}
