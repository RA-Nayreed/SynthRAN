---
- name: Read the existing QMI connection manager command
  ansible.builtin.command: pgrep -a -x quectel-CM
  register: synthran_qmi_existing
  changed_when: false
  failed_when: synthran_qmi_existing.rc not in [0, 1]

- name: Refuse a connection manager serving another DNN
  ansible.builtin.assert:
    quiet: true
    that:
      - >-
        synthran_qmi_existing.rc == 1 or
        (synthran_qmi_existing.stdout_lines | length == 1 and
         (synthran_qmi_existing.stdout | regex_search(
           '(?:^|\s)-s\s+' ~ (synthran_physical_dnn | regex_escape) ~ '(?:\s|$)')) is not none)
    fail_msg: An existing quectel-CM process uses another DNN; inspect it before a fresh deployment.

- name: Start the upstream QMI connection manager when absent
  ansible.builtin.shell: |
    set -eu
    if pgrep -x quectel-CM >/dev/null; then
      echo running
    else
      setsid /usr/local/bin/quectel-CM -s {{ synthran_physical_dnn | quote }} -4 \
        </dev/null >/var/log/quectel-CM.log 2>&1 &
      sleep 3
      pgrep -x quectel-CM >/dev/null
      echo started
    fi
  register: synthran_qmi_manager
  changed_when: "'started' in synthran_qmi_manager.stdout"

- name: Detect the QMI AT port as in 5g_ansible
  ansible.builtin.shell: |
    python3 - <<'PY'
    import glob, serial, sys
    for port in sorted(glob.glob('/dev/ttyUSB*')):
        try:
            with serial.Serial(port, 115200, timeout=0.4) as modem:
                modem.write(b'AT\r')
                response = modem.read(64)
            if b'OK' in response:
                print(port)
                sys.exit(0)
        except serial.SerialException:
            continue
    sys.exit(1)
    PY
  register: synthran_qmi_at_probe
  changed_when: false
  when: at_port is not defined

- name: Resolve the QMI AT port
  ansible.builtin.set_fact:
    synthran_qmi_at_port: "{{ at_port | default(synthran_qmi_at_probe.stdout | default('') | trim) }}"

- name: Detach the QMI UE using the installed R2Lab control helper
  ansible.builtin.command:
    argv: [python3, /usr/local/bin/ci_ctl_qtel.py, "{{ synthran_qmi_at_port }}", detach]
  changed_when: true

- name: Wake the QMI UE using the installed R2Lab control helper
  ansible.builtin.command:
    argv: [python3, /usr/local/bin/ci_ctl_qtel.py, "{{ synthran_qmi_at_port }}", wup]
  changed_when: true
