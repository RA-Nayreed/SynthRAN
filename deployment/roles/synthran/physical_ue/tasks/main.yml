---
- name: Load the active physical UE profile
  ansible.builtin.include_vars:
    file: >-
      {{ fiveg_profile_file |
         default(playbook_dir ~ '/../group_vars/all/5g_profile_' ~ (fiveg_profile | default('default')) ~ '.yaml') }}
    name: synthran_fiveg

- name: Require the physical UE in the active 5G profile
  ansible.builtin.assert:
    that:
      - synthran_fiveg.ues[inventory_hostname] is defined
    fail_msg: "{{ inventory_hostname }} is not defined in the active 5G profile"

- name: Resolve the physical UE slice
  ansible.builtin.set_fact:
    synthran_physical_slice_name: "{{ synthran_fiveg.ues[inventory_hostname].slice }}"

- name: Resolve the physical UE DNN and UPF address
  ansible.builtin.set_fact:
    synthran_physical_slice: >-
      {{ synthran_fiveg.slices
         | selectattr('name', 'equalto', synthran_physical_slice_name)
         | first }}

- name: Resolve the physical UE deployment-contract entry
  ansible.builtin.set_fact:
    synthran_physical_contract_matches: >-
      {{ synthran_ue_map
         | selectattr('device', 'equalto', inventory_hostname)
         | list }}

- name: Require one physical UE deployment-contract entry
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_physical_contract_matches | length == 1
    fail_msg: >-
      Expected exactly one deployment-contract entry for {{ inventory_hostname }},
      found {{ synthran_physical_contract_matches | length }}.

- name: Record the physical UE deployment-contract entry
  ansible.builtin.set_fact:
    synthran_physical_contract_ue: "{{ synthran_physical_contract_matches | first }}"

- name: Resolve the physical transport from the deployment contract
  ansible.builtin.set_fact:
    synthran_physical_interface: "{{ synthran_physical_contract_ue.tunnel.interface }}"

- name: Require the supported upstream single-DNN transport
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_physical_contract_ue.tunnel.host == inventory_hostname
      - synthran_physical_interface == 'wwan0'
      - synthran_physical_contract_ue.tunnel.mode == (mode | default('mbim'))
      - (mode | default('mbim')) != 'mbim' or synthran_physical_contract_ue.tunnel.mbim_session | int == 0
    fail_msg: The physical contract must use the selected DNN on the upstream wwan0 transport.

- name: Attach the physical UE during a full deployment
  when: not (synthran_workload_only | default(false) | bool)
  block:
    - name: Stop the previous MBIM connection with the R2Lab helper
      ansible.builtin.command: env -u DNN1 stop.sh
      when: mode | default('mbim') == 'mbim'
      changed_when: true

    - name: Start the selected DNN with the R2Lab helper
      ansible.builtin.command:
        argv: [env, -u, DNN1, DNN_TYPE0=ipv4, start.sh, -q, -F, "{{ synthran_physical_slice.dnn }}"]
      when: mode | default('mbim') == 'mbim'
      register: synthran_mbim_attach
      changed_when: true
      failed_when: false

    - name: Read R2Lab diagnostics when attachment fails
      ansible.builtin.command: qhat-check
      register: synthran_attach_diagnostics
      changed_when: false
      failed_when: false
      when:
        - mode | default('mbim') == 'mbim'
        - synthran_mbim_attach.rc != 0

    - name: Retain the MBIM helper result
      ansible.builtin.copy:
        content: |
          {{ synthran_mbim_attach.stdout | default('') }}
          {{ synthran_mbim_attach.stderr | default('') }}
          {{ synthran_attach_diagnostics.stdout | default('') }}
          {{ synthran_attach_diagnostics.stderr | default('') }}
        dest: "{{ run_dir }}/physical-ue-{{ inventory_hostname }}-attach.log"
      delegate_to: localhost
      become: false
      when: mode | default('mbim') == 'mbim'

    - name: Require the upstream MBIM helper to complete
      ansible.builtin.assert:
        quiet: true
        that: synthran_mbim_attach.rc == 0
        fail_msg: >-
          R2Lab start.sh failed for {{ inventory_hostname }} on {{ synthran_physical_slice.dnn }}.
          See physical-ue-{{ inventory_hostname }}-attach.log. The live stack is preserved.
      when: mode | default('mbim') == 'mbim'

    - name: Connect QMI using the 5g_ansible procedure
      ansible.builtin.include_tasks: qmi.yml
      when: mode | default('mbim') == 'qmi'

    - name: Wait for the physical 5G session address
      ansible.builtin.command: "ip -4 -o addr show dev {{ synthran_physical_interface }}"
      register: synthran_physical_address
      changed_when: false
      retries: "{{ 60 if (mode | default('mbim')) == 'qmi' else 30 }}"
      delay: 2
      until: "' inet ' in synthran_physical_address.stdout"

- name: Read the live SIM, DNN configuration, and physical session
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/../../../scripts/probe_physical_ue.py
      --contract {{ synthran_physical_contract_ue | to_json | quote }}
    executable: /usr/bin/python3
  register: synthran_physical_probe
  changed_when: false
  failed_when: false

- name: Retain physical modem evidence before accepting the binding
  ansible.builtin.copy:
    content: |
      {{ synthran_physical_probe.stdout | default('') }}
      {{ synthran_physical_probe.stderr | default('') }}
    dest: "{{ run_dir }}/physical-ue-{{ inventory_hostname }}.log"
  delegate_to: localhost
  become: false

- name: Require the observed modem to match the deployment contract
  ansible.builtin.assert:
    quiet: true
    that: synthran_physical_probe.rc == 0
    fail_msg: >-
      Physical UE validation failed. See physical-ue-{{ inventory_hostname }}.log.
      Workload-only and resume never repair or reattach a modem; a changed or
      disconnected session requires a full deployment.

- name: Record the observed physical UE binding
  ansible.builtin.set_fact:
    synthran_physical_binding: "{{ (synthran_physical_probe.stdout | from_json).binding }}"

- name: Install the UPF route during a full deployment
  ansible.builtin.command: >-
    ip route replace {{ synthran_physical_slice.ip_prefix }}.1 dev {{ synthran_physical_interface }}
  changed_when: true
  when: not (synthran_workload_only | default(false) | bool)

- name: Prove physical user-plane reachability
  ansible.builtin.command: >-
    ping -I {{ synthran_physical_interface }} -c 1 -W 3 {{ synthran_physical_slice.ip_prefix }}.1
  register: synthran_physical_upf_ping
  changed_when: false
  retries: 15
  delay: 4
  until: synthran_physical_upf_ping.rc == 0

- name: Resolve the broker endpoint for the physical user plane
  ansible.builtin.set_fact:
    synthran_physical_broker_address: >-
      {{ mqtt_broker_address if mqtt_broker_address else
         hostvars[groups['broker_node'][0]].ansible_default_ipv4.address }}

- name: Resolve the broker endpoint to IPv4
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ synthran_physical_broker_address }}"]
  register: synthran_physical_broker_lookup
  changed_when: false

- name: Record the physical broker IPv4 address
  ansible.builtin.set_fact:
    synthran_physical_broker_ipv4: "{{ synthran_physical_broker_lookup.stdout_lines[0].split()[0] }}"

- name: Install the broker route during a full deployment
  ansible.builtin.command: >-
    ip route replace {{ synthran_physical_broker_ipv4 }}/32 dev {{ synthran_physical_interface }}
  changed_when: true
  when: not (synthran_workload_only | default(false) | bool)

- name: Read the route used by the bound publisher
  ansible.builtin.command: >-
    ip -j route get {{ synthran_physical_broker_ipv4 }} from {{ synthran_physical_binding.address }}
  register: synthran_physical_broker_route
  changed_when: false

- name: Require the broker route to use the proved modem interface
  ansible.builtin.assert:
    quiet: true
    that:
      - synthran_physical_broker_route.stdout | from_json | length == 1
      - (synthran_physical_broker_route.stdout | from_json)[0].dev == synthran_physical_interface
    fail_msg: The broker route does not use the physical UE. Reuse will not change routes.

- name: Prove MQTT TCP reachability through the observed physical UE address
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import socket, sys
        with socket.socket() as sock:
            sock.settimeout(3)
            sock.setsockopt(socket.SOL_SOCKET, socket.SO_BINDTODEVICE, sys.argv[3].encode() + b"\0")
            sock.bind((sys.argv[2], 0))
            sock.connect((sys.argv[1], int(sys.argv[4])))
      - "{{ synthran_physical_broker_ipv4 }}"
      - "{{ synthran_physical_binding.address }}"
      - "{{ synthran_physical_interface }}"
      - "{{ mqtt_port | string }}"
  register: synthran_physical_broker_check
  changed_when: false
  retries: 5
  delay: 2
  until: synthran_physical_broker_check.rc == 0
