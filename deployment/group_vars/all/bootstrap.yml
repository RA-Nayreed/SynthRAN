---
# #52 normalizes this field to fresh|preserve in the resolved scenario. Keep the
# policy controller-side: preserve mode must never be inferred from live hosts.
synthran_host_preparation: >-
  {{
    (
      (lookup('file', scenario_file) | from_yaml).deployment.reservation
      | default({})
    ).host_preparation
    | default('fresh')
  }}

# #51 pins this exact reference. synthran.runtime materializes and verifies it
# before Ansible starts; delegated role wrappers include tasks only from here.
synthran_reference_root: >-
  {{ synthran_root }}/.synthran/reference/sopnode-5g-ansible/6c9cb3a90c5cd88e1de3386c7eed76f25aa581d3
