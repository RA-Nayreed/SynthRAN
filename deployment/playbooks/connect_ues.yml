---
- name: Connect R2Lab UEs with the upstream 5g_ansible role
  hosts: faraday
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Resolve the run-scoped nested SSH trust directory
      ansible.builtin.set_fact:
        synthran_nested_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

    - name: Require the secured nested SSH wrapper prepared during provisioning
      ansible.builtin.stat:
        path: "{{ synthran_nested_ssh_dir }}/bin/ssh"
      register: synthran_nested_ssh_wrapper
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

    - name: Refuse R2Lab connection without the nested SSH verification boundary
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_nested_ssh_wrapper.stat.exists
          - synthran_nested_ssh_wrapper.stat.executable
        fail_msg: The secured nested SSH wrapper is missing on Faraday; refusing unverified UE connection.
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

    - name: Connect UEs on R2Lab to 5G network
      ansible.builtin.include_role:
        name: r2lab/ue/connect
        apply:
          environment:
            PATH: "{{ synthran_nested_ssh_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SYNTHRAN_SSH_KNOWN_HOSTS: "{{ synthran_nested_ssh_dir }}/known_hosts"
      vars:
        ue_item: "{{ item }}"
        # Upstream intentionally defaults this to true. SynthRAN requires every
        # requested UE, so an attachment command failure is fatal here.
        ignore_task_errors: false
      loop: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) + (groups['phones'] | default([])) }}"
      loop_control:
        label: "{{ item }}"
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

    - name: Retain nested R2Lab SSH host keys with the run
      ansible.builtin.fetch:
        src: "{{ synthran_nested_ssh_dir }}/known_hosts"
        dest: "{{ run_dir }}/r2lab-nested-known-hosts"
        flat: true
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

    - name: Remove the run-scoped nested SSH wrapper from Faraday
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}"
        state: absent
      when: platform == 'r2lab' and not (synthran_workload_only | bool)

- name: Verify R2Lab modem sessions without changing upstream modem state
  hosts: physical_ues
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prove the live R2Lab UE session against the deployment contract
      ansible.builtin.include_role:
        name: synthran/physical_ue
      vars:
        synthran_physical_manage_session: false
      when: platform == 'r2lab'

- name: Retain structured live R2Lab UE bindings
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Initialize live R2Lab UE binding evidence
      ansible.builtin.set_fact:
        synthran_physical_bindings: []
      when: platform == 'r2lab'

    - name: Require every deployment-contract UE to expose a proved binding
      ansible.builtin.assert:
        quiet: true
        that:
          - hostvars[item.device] is defined
          - hostvars[item.device].synthran_physical_binding is defined
        fail_msg: >-
          UE {{ item.device }} has no proved live binding for the deployment
          contract. Required UEs cannot be accepted from desired configuration
          alone.
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'r2lab'

    - name: Collect proved R2Lab UE bindings in deployment-contract order
      ansible.builtin.set_fact:
        synthran_physical_bindings: >-
          {{ synthran_physical_bindings + [hostvars[item.device].synthran_physical_binding] }}
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'r2lab'

    - name: Read the existing cluster attestation
      ansible.builtin.set_fact:
        synthran_cluster_evidence: "{{ lookup('file', run_dir ~ '/live-deployment-evidence.json') | from_json }}"
      when: platform == 'r2lab'

    - name: Require a matching cluster attestation before adding UE evidence
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_cluster_evidence.cluster_identity_verified is sameas true
          - synthran_cluster_evidence.deployment_hash == synthran_deployment_contract.deployment_hash
        fail_msg: Live UE observations cannot replace a missing or mismatched cluster attestation.
      when: platform == 'r2lab'

    - name: Retain live UE bindings with the run
      ansible.builtin.copy:
        content: >-
          {{ synthran_cluster_evidence
             | combine({'bindings': synthran_physical_bindings,
                        'observed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')})
             | to_nice_json }}
        dest: "{{ run_dir }}/live-deployment-evidence.json"
      when: platform == 'r2lab'
