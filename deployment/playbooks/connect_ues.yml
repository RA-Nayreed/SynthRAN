---
- name: Connect R2Lab UEs with the upstream 5g_ansible role
  hosts: faraday
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: START_SYNTHRAN_R2LAB_UE_CONNECTION
      ansible.builtin.debug:
        msg: Resume boundary for R2Lab UE connection.
      changed_when: false
      when: platform == 'r2lab'

    - name: Resolve the run-scoped nested SSH trust directory
      ansible.builtin.set_fact:
        synthran_nested_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
      when: platform == 'r2lab'

    - name: Ensure the run-scoped nested SSH wrapper directory exists
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/bin"
        state: directory
        mode: '0700'
      when: platform == 'r2lab'

    - name: Reinstall the SynthRAN nested SSH verification wrapper
      ansible.builtin.copy:
        src: "{{ synthran_root }}/deployment/scripts/secure_ssh_wrapper.py"
        dest: "{{ synthran_nested_ssh_dir }}/bin/ssh"
        mode: '0755'
      when: platform == 'r2lab'

    - name: Check for live nested R2Lab SSH host keys
      ansible.builtin.stat:
        path: "{{ synthran_nested_ssh_dir }}/known_hosts"
      register: synthran_nested_known_hosts
      when: platform == 'r2lab'

    - name: Check for retained run-scoped R2Lab SSH host keys
      ansible.builtin.stat:
        path: "{{ run_dir }}/r2lab-nested-known-hosts"
      delegate_to: localhost
      register: synthran_retained_nested_known_hosts
      when:
        - platform == 'r2lab'
        - not synthran_nested_known_hosts.stat.exists

    - name: Restore retained nested R2Lab SSH host keys on resume
      ansible.builtin.copy:
        src: "{{ run_dir }}/r2lab-nested-known-hosts"
        dest: "{{ synthran_nested_ssh_dir }}/known_hosts"
        mode: '0600'
      when:
        - platform == 'r2lab'
        - not synthran_nested_known_hosts.stat.exists
        - synthran_retained_nested_known_hosts.stat.exists | default(false)

    - name: Re-check the nested R2Lab SSH host-key boundary
      ansible.builtin.stat:
        path: "{{ synthran_nested_ssh_dir }}/known_hosts"
      register: synthran_nested_known_hosts_ready
      when: platform == 'r2lab'

    - name: Refuse R2Lab connection without retained host-key verification
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_nested_known_hosts_ready.stat.exists
          - synthran_nested_known_hosts_ready.stat.isreg
        fail_msg: >-
          The run-scoped nested R2Lab SSH host keys are unavailable both on Faraday
          and in the retained run artifacts; refusing to recreate trust implicitly.
      when: platform == 'r2lab'

    - name: Connect UEs on R2Lab to 5G network
      ansible.builtin.include_role:
        name: r2lab/ue/connect
        apply:
          environment:
            PATH: "{{ synthran_nested_ssh_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SYNTHRAN_SSH_KNOWN_HOSTS: "{{ synthran_nested_ssh_dir }}/known_hosts"
      vars:
        ue_item: "{{ item }}"
        # The upstream role deliberately treats modem bring-up as best effort.
        # SynthRAN's read-only verification role below is the acceptance gate.
        ignore_task_errors: true
        # Upstream embeds phone_ssh in a task name inside a conditionally skipped
        # phone block. Seed it so non-phone UEs do not emit undefined-template
        # warnings before that block's set_fact would run.
        phone_ssh: ""
      loop: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) }}"
      loop_control:
        label: "{{ item }}"
      when: platform == 'r2lab'

    - name: Retain nested R2Lab SSH host keys with the run
      ansible.builtin.fetch:
        src: "{{ synthran_nested_ssh_dir }}/known_hosts"
        dest: "{{ run_dir }}/r2lab-nested-known-hosts"
        flat: true
      when: platform == 'r2lab'

    - name: Remove the run-scoped nested SSH wrapper from Faraday
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}"
        state: absent
      when: platform == 'r2lab'

- name: Verify R2Lab modem sessions without changing upstream modem state
  hosts: physical_ues
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prove the live R2Lab UE session against the deployment contract
      ansible.builtin.include_role:
        name: synthran/r2lab_ue_verify
      when: platform == 'r2lab'

- name: Retain structured live R2Lab UE bindings
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Initialize live R2Lab UE binding evidence
      ansible.builtin.set_fact:
        synthran_r2lab_bindings: []
      when: platform == 'r2lab'

    - name: Require every deployment-contract UE to expose a proved R2Lab binding
      ansible.builtin.assert:
        quiet: true
        that:
          - hostvars[item.device] is defined
          - hostvars[item.device].synthran_r2lab_binding is defined
        fail_msg: >-
          R2Lab UE {{ item.device }} has no proved live binding for the deployment
          contract. Required UEs cannot be accepted from desired configuration
          alone.
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'r2lab'

    - name: Collect proved R2Lab UE bindings in deployment-contract order
      ansible.builtin.set_fact:
        synthran_r2lab_bindings: >-
          {{ synthran_r2lab_bindings + [hostvars[item.device].synthran_r2lab_binding] }}
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'r2lab'

    - name: Read the existing cluster attestation
      ansible.builtin.set_fact:
        synthran_cluster_evidence: "{{ lookup('file', run_dir ~ '/live-deployment-evidence.json') | from_json }}"
      when: platform == 'r2lab'

    - name: Require a matching cluster attestation before adding R2Lab UE evidence
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_cluster_evidence.cluster_identity_verified is sameas true
          - synthran_cluster_evidence.deployment_hash == synthran_deployment_contract.deployment_hash
        fail_msg: Live R2Lab UE observations cannot replace a missing or mismatched cluster attestation.
      when: platform == 'r2lab'

    - name: Retain live R2Lab UE bindings with the run
      ansible.builtin.copy:
        content: >-
          {{ synthran_cluster_evidence
             | combine({'bindings': synthran_r2lab_bindings,
                        'observed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')})
             | to_nice_json }}
        dest: "{{ run_dir }}/live-deployment-evidence.json"
      when: platform == 'r2lab'
