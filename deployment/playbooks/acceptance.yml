---
- import_playbook: connect_ues.yml

- name: Re-observe selected cluster runtime before accepted-testbed publication
  hosts: core_node
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Load the sealed executable deployment identity
      ansible.builtin.set_fact:
        synthran_acceptance_contract: >-
          {{ lookup('ansible.builtin.file', synthran_deployment_contract_file) | from_json }}

    - name: Collect fresh selected-namespace Kubernetes and Helm state
      ansible.builtin.script:
        cmd: >-
          {{ synthran_root }}/deployment/scripts/collect_cluster_snapshot.py
          --namespace {{ synthran_acceptance_contract.deployment.topology.namespace | quote }}
        executable: /usr/bin/python3
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: synthran_acceptance_cluster_snapshot
      changed_when: false

    - name: Retain fresh acceptance-time cluster runtime evidence
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        mode: '0644'
        dest: "{{ run_dir }}/acceptance-cluster.json"
        content: >-
          {{ synthran_acceptance_cluster_snapshot.stdout | from_json | to_nice_json }}
