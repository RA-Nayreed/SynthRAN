---
- name: Validate selected SOP nodes
  hosts: sopnodes
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Probe SSH on every selected SOP node (up to 180 seconds)
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 1
        timeout: 10
      register: synthran_ssh_probe
      until: synthran_ssh_probe is succeeded
      retries: 12
      delay: 5

    - name: Confirm SSH access to the allocated SOP node
      ansible.builtin.debug:
        msg: "SSH is ready on {{ inventory_hostname }}"
    - name: Gather host facts
      ansible.builtin.setup:
    - name: Discover safe containerd storage
      shell: |
        set -eu
        current="$(findmnt -n -o SOURCE /var/lib/containerd 2>/dev/null || true)"
        case "$current" in
          /dev/*) basename "$(readlink -f "$current")"; exit 0 ;;
        esac
        while read -r device type; do
          [ "$type" = part ] || continue
          [ "$(blkid -s TYPE -o value "$device" 2>/dev/null || true)" = ext4 ] || continue
          [ -z "$(findmnt -n -o TARGET "$device" 2>/dev/null || true)" ] || continue
          basename "$device"
          exit 0
        done < <(lsblk -pnro NAME,TYPE)
        exit 1
      args: {executable: /bin/bash}
      register: synthran_storage_discovery
      changed_when: false
      failed_when: false
    - name: Record the selected containerd storage device
      set_fact:
        storage: "{{ synthran_storage_discovery.stdout | trim }}"
    - name: Validate the selected containerd storage device
      assert:
        that:
          - synthran_storage_discovery.rc == 0
          - storage | length > 0
        fail_msg: >-
          No safe ext4 containerd partition was found on {{ inventory_hostname }}.
          Existing mounted filesystems are never selected automatically.
    - name: Report selected containerd storage
      debug:
        msg: "Using /dev/{{ storage }} for containerd on {{ inventory_hostname }}"
