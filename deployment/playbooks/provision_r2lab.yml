---
- name: Cleanup R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/cleanup
      when:
        - platform == 'r2lab'
        - not no_r2lab_cleanup | default(false)

- name: Power ON RRU on R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/rru
      when: platform == 'r2lab'

- name: Setup UEs on R2Lab
  hosts: faraday
  gather_facts: false
  tasks:
    - name: Resolve the run-scoped nested SSH trust directory
      ansible.builtin.set_fact:
        synthran_nested_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
      when: platform == 'r2lab'

    - name: Create the nested SSH wrapper directory on Faraday
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/bin"
        state: directory
        mode: '0700'
      when: platform == 'r2lab'

    - name: Install the SynthRAN SSH verification wrapper on Faraday
      ansible.builtin.copy:
        src: "{{ synthran_root }}/deployment/scripts/secure_ssh_wrapper.py"
        dest: "{{ synthran_nested_ssh_dir }}/bin/ssh"
        mode: '0755'
      when: platform == 'r2lab'

    - name: Initialize the run-scoped nested SSH known-hosts file
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/known_hosts"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      when: platform == 'r2lab'

    - name: Power and verify the selected R2Lab UEs
      ansible.builtin.include_role:
        name: r2lab/ue/setup
        apply:
          environment:
            PATH: "{{ synthran_nested_ssh_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SYNTHRAN_SSH_KNOWN_HOSTS: "{{ synthran_nested_ssh_dir }}/known_hosts"
      when: platform == 'r2lab'

    - name: Require every selected R2Lab UE to be reachable before modem initialization
      ansible.builtin.assert:
        quiet: true
        that:
          - failed_ues | default([]) | length == 0
        fail_msg: >-
          Selected R2Lab UEs are not reachable after power-up: {{ failed_ues | default([]) }}.
          Refusing to continue with a partial UE set.
      when: platform == 'r2lab'

    - name: Load the resolved network profile for R2Lab UE configuration
      ansible.builtin.include_vars:
        file: "{{ network_profile_file }}"
      when: platform == 'r2lab'

    - name: Initialize each selected R2Lab UE with its configured DNN and S-NSSAI
      vars:
        ue_profile: "{{ ues[item] }}"
        ue_slice: "{{ slices | selectattr('name', 'equalto', ue_profile.slice) | first }}"
        ue_nssai: >-
          {{ ue_slice.sst if (ue_slice.sd | string | upper) == 'EMPTY'
             else ue_slice.sst ~ '.' ~ ue_slice.sd }}
      ansible.builtin.shell: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile={{ synthran_nested_ssh_dir }}/known_hosts
        root@{{ item }}
        'qhat-init --mode={{ hostvars[item].mode | default("default") }}
        --dnn={{ ue_slice.dnn }} --nssai={{ ue_nssai }}'
      args:
        executable: /bin/bash
      loop: "{{ reachable_ues | default([]) }}"
      loop_control:
        label: "{{ item }} -> {{ ue_profile.slice }} / {{ ue_slice.dnn }} / {{ ue_nssai }}"
      changed_when: true
      when:
        - platform == 'r2lab'
        - item in ues

    - name: Return initialized R2Lab UEs to a detached state before connection
      vars:
        ue_stop_cmd: >-
          {{ 'stop.sh'
             if (hostvars[item].mode | default('mbim', true)) == 'mbim'
             else 'python3 /usr/local/bin/ci_ctl_qtel.py '
                  ~ (hostvars[item].at_port | default('/dev/ttyUSB3')) ~ ' detach' }}
      ansible.builtin.shell: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile={{ synthran_nested_ssh_dir }}/known_hosts
        root@{{ item }} '{{ ue_stop_cmd }}'
      args:
        executable: /bin/bash
      loop: "{{ reachable_ues | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: synthran_r2lab_detach
      changed_when: true
      failed_when: false
      when: platform == 'r2lab'

    - name: Check initialized R2Lab UE state without attaching it
      ansible.builtin.shell: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile={{ synthran_nested_ssh_dir }}/known_hosts
        root@{{ item }} 'qhat-check'
      args:
        executable: /bin/bash
      loop: "{{ reachable_ues | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: synthran_r2lab_init_checks
      changed_when: false
      failed_when: false
      when: platform == 'r2lab'

    - name: Report initialized R2Lab UE state
      ansible.builtin.debug:
        msg:
          - "UE: {{ item.item }}"
          - "{{ item.stdout_lines | default([]) }}"
      loop: "{{ synthran_r2lab_init_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('unknown') }}"
      when:
        - platform == 'r2lab'
        - item.item is defined
