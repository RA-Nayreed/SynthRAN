---
- name: Cleanup R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/cleanup
      when:
        - platform == 'r2lab'
        - not no_r2lab_cleanup | default(false)

- name: Power ON RRU on R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/rru
      when: platform == 'r2lab'

- name: Setup UEs on R2Lab
  hosts: faraday
  gather_facts: false
  tasks:
    - name: Resolve the run-scoped nested SSH trust directory
      ansible.builtin.set_fact:
        synthran_nested_ssh_dir: "/tmp/synthran-ssh-{{ run_dir | basename }}"
      when: platform == 'r2lab'

    - name: Create the nested SSH wrapper directory on Faraday
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/bin"
        state: directory
        mode: '0700'
      when: platform == 'r2lab'

    - name: Install the SynthRAN SSH verification wrapper on Faraday
      ansible.builtin.copy:
        src: "{{ synthran_root }}/deployment/scripts/secure_ssh_wrapper.py"
        dest: "{{ synthran_nested_ssh_dir }}/bin/ssh"
        mode: '0755'
      when: platform == 'r2lab'

    - name: Initialize the run-scoped nested SSH known-hosts file
      ansible.builtin.file:
        path: "{{ synthran_nested_ssh_dir }}/known_hosts"
        state: touch
        mode: '0600'
        access_time: preserve
        modification_time: preserve
      when: platform == 'r2lab'

    - name: Run the pinned upstream R2Lab UE setup with host verification enforced
      ansible.builtin.include_role:
        name: r2lab/ue/setup
        apply:
          environment:
            PATH: "{{ synthran_nested_ssh_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            SYNTHRAN_SSH_KNOWN_HOSTS: "{{ synthran_nested_ssh_dir }}/known_hosts"
      when: platform == 'r2lab'

    - name: Load the resolved network profile for R2Lab UE slice configuration
      ansible.builtin.include_vars:
        file: "{{ network_profile_file }}"
      when: platform == 'r2lab'

    - name: Apply the configured DNN and S-NSSAI to each reachable QHAT
      vars:
        ue_profile: "{{ ues[item] }}"
        ue_slice: "{{ slices | selectattr('name', 'equalto', ue_profile.slice) | first }}"
        qhat_nssai: >-
          {{ ue_slice.sst if (ue_slice.sd | string | upper) == 'EMPTY'
             else ue_slice.sst ~ '.' ~ ue_slice.sd }}
      ansible.builtin.shell: >-
        ssh -o ConnectTimeout=5 -o BatchMode=yes
        -o StrictHostKeyChecking=accept-new
        -o UserKnownHostsFile={{ synthran_nested_ssh_dir }}/known_hosts
        root@{{ item }}
        'qhat-init --mode={{ hostvars[item].mode | default("default") }}
        --dnn={{ ue_slice.dnn }} --nssai={{ qhat_nssai }}'
      args:
        executable: /bin/bash
      loop: "{{ reachable_ues | default([]) | select('match', '^qhat') | list }}"
      loop_control:
        label: "{{ item }} -> {{ ue_profile.slice }} / {{ ue_slice.dnn }} / {{ qhat_nssai }}"
      register: synthran_qhat_profile_init
      changed_when: true
      when:
        - platform == 'r2lab'
        - item in ues

    - name: Fail when a requested QHAT could not be initialized with its configured slice
      ansible.builtin.assert:
        quiet: true
        that:
          - item.rc == 0
        fail_msg: >-
          R2Lab QHAT {{ item.item }} could not be initialized with the DNN/S-NSSAI
          selected by the active network profile.
      loop: "{{ synthran_qhat_profile_init.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('unknown') }}"
      when:
        - platform == 'r2lab'
        - item.item is defined
