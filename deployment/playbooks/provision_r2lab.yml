---
- name: Cleanup R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/cleanup
      when:
        - platform == 'r2lab'
        - not no_r2lab_cleanup | default(false)

- name: Power ON RRU on R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/rru
      when: platform == 'r2lab'

- name: Setup UEs on R2Lab
  hosts: faraday
  gather_facts: false
  roles:
    - role: r2lab/ue/setup
      when: platform == 'r2lab'
