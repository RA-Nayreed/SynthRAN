---
- name: Prepare core and RAN hosts
  hosts: sopnodes
  become: true
  any_errors_fatal: true
  roles:
    - setup/common
    - setup/netplan
    - setup/containerd
    - setup/pre_k8s
    - setup/k8s/k8s_setup
    - setup/optimization/cpu
    - setup/ovs
  tasks:
    - name: Resolve the supported yq architecture
      ansible.builtin.set_fact:
        synthran_yq_arch: >-
          {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else
             'arm64' if ansible_architecture in ['aarch64', 'arm64'] else '' }}

    - name: Require a checksum-pinned yq binary for this architecture
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_yq_arch | length > 0
          - synthran_yq_arch in yq_sha256
        fail_msg: >-
          No checksum-pinned yq binary is defined for architecture
          {{ ansible_architecture }}.

    - name: Install the checksum-verified shared yq binary
      ansible.builtin.get_url:
        url: >-
          https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_{{ synthran_yq_arch }}
        dest: /usr/local/bin/yq
        mode: '0755'
        force: true
        checksum: "sha256:{{ yq_sha256[synthran_yq_arch] }}"

    - name: Read back the installed yq version
      ansible.builtin.command: /usr/local/bin/yq --version
      register: synthran_yq_version
      changed_when: false

    - name: Require the installed yq binary to match the pinned release
      ansible.builtin.assert:
        quiet: true
        that:
          - yq_version in synthran_yq_version.stdout
        fail_msg: >-
          /usr/local/bin/yq does not match the pinned {{ yq_version }} baseline:
          {{ synthran_yq_version.stdout | default(synthran_yq_version.stderr) }}

- name: Create the Kubernetes control plane
  hosts: core_node
  become: true
  any_errors_fatal: true
  module_defaults:
    kubernetes.core.helm:
      chart_version: "{{ flannel_chart_version }}"
  pre_tasks:
    - name: Resolve the supported CNI plugin architecture
      ansible.builtin.set_fact:
        synthran_cni_arch: >-
          {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else
             'arm64' if ansible_architecture in ['aarch64', 'arm64'] else '' }}

    - name: Require a pinned CNI artifact for this architecture
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_cni_arch | length > 0
          - synthran_cni_arch in cni_plugins_sha256
        fail_msg: >-
          No checksum-pinned CNI plugin bundle is defined for architecture
          {{ ansible_architecture }}.

    - name: Stage the checksum-verified CNI plugin bundle
      ansible.builtin.get_url:
        url: >-
          https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ synthran_cni_arch }}-v{{ cni_plugins_version }}.tgz
        dest: /tmp/cni-plugins.tgz
        mode: '0600'
        force: true
        checksum: "sha256:{{ cni_plugins_sha256[synthran_cni_arch] }}"
  roles:
    - setup/k8s/cluster_create
    - setup/k8s/remove_cp_taint
  tasks:
    - name: Move the kubeadm join command into the private run directory
      ansible.builtin.command:
        argv:
          - install
          - -m
          - '0600'
          - "{{ playbook_dir }}/.kubeadm_join_command.txt"
          - "{{ synthran_private_dir }}/kubeadm_join_command.txt"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Remove the staged kubeadm join command
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.kubeadm_join_command.txt"
        state: absent
      delegate_to: localhost
      become: false
      no_log: true

- name: Join the RAN host to Kubernetes
  hosts: ran_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/cluster_join
      when: inventory_hostname != groups['core_node'][0]

- name: Reserve only a split RAN node for RAN workloads
  hosts: core_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/add_taint
      vars:
        target_node: "{{ ran_node_name }}"
      when: bridge_enabled and core_node_name != ran_node_name
    - role: setup/k8s/remove_taint
      vars:
        target_node: "{{ ran_node_name }}"
      when: core_node_name == ran_node_name

- name: Install Multus and storage prerequisites
  hosts: core_node
  become: true
  any_errors_fatal: true
  roles:
    - setup/cni
    - role: setup/storage
      when: core == 'open5gs' or core == 'free5gc'

- name: Apply the upstream RAN-node CPU and kubelet tuning
  hosts: ran_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/k8s_cpu_tuning
      when: not (fhi72 | default(false) | bool)

- name: Configure core-side transport
  hosts: core_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/gre_tunnel
      when: bridge_enabled and core_node_name != ran_node_name

- name: Configure RAN-side transport
  hosts: ran_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/gre_tunnel
      when: bridge_enabled and core_node_name != ran_node_name

- name: "Deploy the {{ core | upper }} core"
  hosts: core_node
  any_errors_fatal: true
  tasks:
    - name: Configure Open5GS
      ansible.builtin.include_role:
        name: 5g/open5gs/config
      when: core == 'open5gs'
    - name: Deploy Open5GS
      ansible.builtin.include_role:
        name: 5g/open5gs/deploy
      when: core == 'open5gs'
    - name: Prepare the Free5GC host
      ansible.builtin.include_role:
        name: 5g/free5gc/node
      when: core == 'free5gc'
    - name: Configure Free5GC
      ansible.builtin.include_role:
        name: 5g/free5gc/config
      when: core == 'free5gc'
    - name: Deploy Free5GC
      ansible.builtin.include_role:
        name: 5g/free5gc/deploy
      when: core == 'free5gc'

- name: "Deploy the {{ ran | upper }} RAN and software UEs"
  hosts: ran_node
  any_errors_fatal: true
  tasks:
    - name: Validate an explicitly configured immutable OAI charts revision
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_oai_charts_revision is match('^[0-9a-fA-F]{40}$')
        fail_msg: synthran_oai_charts_revision must be an immutable 40-hex Git revision.
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_revision is defined
        - synthran_oai_charts_revision | string | length > 0

    - name: Resolve the OAI R2Lab charts branch once for this run
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - https://gitlab.eurecom.fr/turletti/charts.git
          - refs/heads/main
      register: synthran_oai_charts_lookup
      changed_when: false
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_revision is not defined or synthran_oai_charts_revision | string | length == 0

    - name: Freeze the resolved OAI charts revision
      ansible.builtin.set_fact:
        synthran_oai_charts_revision: "{{ synthran_oai_charts_lookup.stdout.split()[0] }}"
      when:
        - core == 'oai' or ran == 'oai'
        - synthran_oai_charts_lookup is not skipped | default(false)

    - name: Require the OAI charts source to be immutable before preparation
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_oai_charts_revision is defined
          - synthran_oai_charts_revision is match('^[0-9a-fA-F]{40}$')
        fail_msg: OAI deployment requires a resolved immutable charts revision.
      when: core == 'oai' or ran == 'oai'

    - name: Configure OAI
      ansible.builtin.include_role:
        name: 5g/oai/config
      when: core == 'oai' or ran == 'oai'
    - name: Prepare OAI
      ansible.builtin.include_role:
        name: 5g/oai/setup
      when: core == 'oai' or ran == 'oai'
    - name: Deploy the OAI core
      ansible.builtin.include_role:
        name: 5g/oai/core
      when: core == 'oai'
    - name: Deploy the OAI RAN
      ansible.builtin.include_role:
        name: 5g/oai/ran
      when: ran == 'oai'
    - name: Configure srsRAN
      ansible.builtin.include_role:
        name: 5g/srsRAN/config
      when: ran | lower == 'srsran'
    - name: Deploy srsRAN
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
      when: ran | lower == 'srsran'
    - name: Configure UERANSIM
      ansible.builtin.include_role:
        name: 5g/ueransim/config
      when: ran == 'ueransim'
    - name: Deploy UERANSIM
      ansible.builtin.include_role:
        name: 5g/ueransim/deploy
      when: ran == 'ueransim'
