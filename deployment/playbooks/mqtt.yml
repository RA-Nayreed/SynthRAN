---
- name: Deploy the MQTT broker and receipt collector
  hosts: broker_node
  become: true
  any_errors_fatal: true
  roles: [synthran/broker]
- name: Replay telemetry through software UE tunnels
  hosts: ran_node
  any_errors_fatal: true
  tasks:
    - name: Run the software UE publisher
      ansible.builtin.include_role:
        name: synthran/software_ue_publish
      when:
        - platform == 'rfsim'
        - ran | lower in ['srsran', 'ueransim', 'oai']
- name: Prepare physical UE interfaces
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare and validate the physical UE session
      ansible.builtin.include_role:
        name: synthran/physical_ue
      when: platform in ['r2lab', 'physical']

- name: Retain structured physical UE bindings
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Initialize physical UE binding evidence
      ansible.builtin.set_fact:
        synthran_physical_bindings: []
      when: platform in ['r2lab', 'physical']

    - name: Collect every proved physical UE binding
      ansible.builtin.set_fact:
        synthran_physical_bindings: >-
          {{ synthran_physical_bindings + [hostvars[item].synthran_physical_binding] }}
      loop: "{{ groups['physical_ues'] | default([]) }}"
      when: platform in ['r2lab', 'physical']

    - name: Require complete physical UE binding evidence
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_physical_bindings | length > 0
          - synthran_physical_bindings | length == synthran_deployment_contract.deployment.ues | length
        fail_msg: Physical UE binding evidence does not cover the complete deployment contract.
      when: platform in ['r2lab', 'physical']

    - name: Retain physical UE bindings with the run
      ansible.builtin.copy:
        content: >-
          {{ {'deployment_hash': synthran_deployment_contract.deployment_hash,
               'cluster_identity_verified': true,
               'bindings': synthran_physical_bindings} | to_nice_json }}
        dest: "{{ run_dir }}/live-deployment-evidence.json"
      when: platform in ['r2lab', 'physical']

- name: Prepare physical publisher runtimes
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare the physical UE publisher
      ansible.builtin.include_role:
        name: synthran/publisher
        tasks_from: prepare.yml
      when: platform in ['r2lab', 'physical']

- name: Select a shared physical telemetry start time
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Choose one shared UTC start after every physical UE is ready
      ansible.builtin.set_fact:
        synthran_physical_start_utc: "{{ lookup('pipe', 'date -u -d +' ~ (mqtt_start_delay_seconds | string) ~ 'seconds +%Y-%m-%dT%H:%M:%SZ') }}"
      when: platform in ['r2lab', 'physical']

- name: Replay telemetry through physical UE interfaces
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the physical UE publisher
      ansible.builtin.include_role:
        name: synthran/publisher
        tasks_from: replay.yml
      when: platform in ['r2lab', 'physical']
- name: Collect MQTT receipt artifacts
  hosts: broker_node
  become: true
  any_errors_fatal: true
  tasks:
    - name: Stop receipt collector to flush its artifact
      systemd: {name: synthran-collector, state: stopped}
    - name: Fetch broker receipts
      fetch: {src: /var/log/synthran/receipts.jsonl, dest: "{{ run_dir }}/broker.jsonl", flat: true}
    - name: Collect broker and receipt-collector logs
      shell: journalctl -u mosquitto -u synthran-collector --no-pager > /var/log/synthran/services.log
      changed_when: false
    - name: Fetch broker and receipt-collector logs
      fetch: {src: /var/log/synthran/services.log, dest: "{{ run_dir }}/broker-services.log", flat: true}
