---
- name: Deploy the MQTT broker and receipt collector
  hosts: broker_node
  become: true
  any_errors_fatal: true
  roles: [synthran/broker]

- name: Replay telemetry through software UE tunnels
  hosts: ran_node
  any_errors_fatal: true
  tasks:
    - name: Run the software UE publisher
      ansible.builtin.include_role:
        name: synthran/software_ue_publish
      when:
        - platform == 'rfsim'
        - ran | lower in ['srsran', 'ueransim', 'oai']

- name: Connect R2Lab UEs with the upstream 5g_ansible role
  hosts: faraday
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Connect UEs on R2Lab to 5G network
      ansible.builtin.include_role:
        name: r2lab/ue/connect
      vars:
        ue_item: "{{ item }}"
      loop: "{{ (groups['qhats'] | default([])) + (groups['qfits'] | default([])) + (groups['phones'] | default([])) }}"
      loop_control:
        label: "{{ item }}"
      when: platform == 'r2lab'

- name: Prepare non-R2Lab physical UE interfaces
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare and validate the custom physical UE session
      ansible.builtin.include_role:
        name: synthran/physical_ue
      when: platform == 'physical'

- name: Retain structured non-R2Lab physical UE bindings
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Initialize physical UE binding evidence
      ansible.builtin.set_fact:
        synthran_physical_bindings: []
      when: platform == 'physical'

    - name: Require every deployment-contract UE to expose a proved binding
      ansible.builtin.assert:
        quiet: true
        that:
          - hostvars[item.device] is defined
          - hostvars[item.device].synthran_physical_binding is defined
        fail_msg: >-
          Physical UE {{ item.device }} has no proved live binding for the
          deployment contract.
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'physical'

    - name: Collect proved physical UE bindings in deployment-contract order
      ansible.builtin.set_fact:
        synthran_physical_bindings: >-
          {{ synthran_physical_bindings + [hostvars[item.device].synthran_physical_binding] }}
      loop: "{{ synthran_deployment_contract.deployment.ues }}"
      loop_control:
        label: "{{ item.device }}"
      when: platform == 'physical'

    - name: Read the existing cluster attestation
      ansible.builtin.set_fact:
        synthran_cluster_evidence: "{{ lookup('file', run_dir ~ '/live-deployment-evidence.json') | from_json }}"
      when: platform == 'physical'

    - name: Require a matching cluster attestation before adding UE evidence
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_cluster_evidence.cluster_identity_verified is sameas true
          - synthran_cluster_evidence.deployment_hash == synthran_deployment_contract.deployment_hash
        fail_msg: Physical UE observations cannot replace a missing or mismatched cluster attestation.
      when: platform == 'physical'

    - name: Retain physical UE bindings with the run
      ansible.builtin.copy:
        content: >-
          {{ synthran_cluster_evidence
             | combine({'bindings': synthran_physical_bindings}) | to_nice_json }}
        dest: "{{ run_dir }}/live-deployment-evidence.json"
      when: platform == 'physical'

- name: Prepare physical publisher runtimes
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Prepare the physical UE publisher
      ansible.builtin.include_role:
        name: synthran/publisher
        tasks_from: prepare.yml
      when: platform in ['r2lab', 'physical']

- name: Select a shared physical telemetry start time
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Choose one shared UTC start after every physical UE is ready
      ansible.builtin.set_fact:
        synthran_physical_start_utc: "{{ lookup('pipe', 'date -u -d +' ~ (mqtt_start_delay_seconds | string) ~ 'seconds +%Y-%m-%dT%H:%M:%SZ') }}"
      when: platform in ['r2lab', 'physical']

- name: Replay telemetry through physical UE interfaces
  hosts: physical_ues
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the physical UE publisher
      ansible.builtin.include_role:
        name: synthran/publisher
        tasks_from: replay.yml
      when: platform in ['r2lab', 'physical']

- name: Collect MQTT receipt artifacts
  hosts: broker_node
  become: true
  any_errors_fatal: true
  tasks:
    - name: Stop receipt collector to flush its artifact
      systemd: {name: synthran-collector, state: stopped}
    - name: Fetch broker receipts
      fetch: {src: /var/log/synthran/receipts.jsonl, dest: "{{ run_dir }}/broker.jsonl", flat: true}
    - name: Collect broker and receipt-collector logs
      shell: journalctl -u mosquitto -u synthran-collector --no-pager > /var/log/synthran/services.log
      changed_when: false
    - name: Fetch broker and receipt-collector logs
      fetch: {src: /var/log/synthran/services.log, dest: "{{ run_dir }}/broker-services.log", flat: true}
