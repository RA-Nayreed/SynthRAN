---
- name: Prepare host and Kubernetes prerequisites
  hosts: sopnodes
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/common
      when: synthran_host_preparation == 'fresh'
    - role: setup/netplan
      when: synthran_host_preparation == 'fresh'
    - role: setup/containerd
      when: synthran_host_preparation == 'fresh'
    - role: setup/pre_k8s
      when: synthran_host_preparation == 'fresh'
    - role: setup/k8s/k8s_setup
      when: synthran_host_preparation == 'fresh'
    - role: setup/deployment_runtime
      when: synthran_host_preparation == 'fresh'
    - role: setup/optimization/cpu
      when: synthran_host_preparation == 'fresh'
    - role: setup/ovs
      when: synthran_host_preparation == 'fresh'
  tasks:
    - name: Verify preserved containerd is active
      ansible.builtin.command: systemctl is-active containerd
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

    - name: Verify preserved kubelet is active
      ansible.builtin.command: systemctl is-active kubelet
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

    - name: Verify preserved CNI DHCP binary exists
      ansible.builtin.stat:
        path: /opt/cni/bin/dhcp
      register: synthran_preserved_dhcp_binary
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

    - name: Require preserved CNI DHCP binary
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_preserved_dhcp_binary.stat.exists
          - synthran_preserved_dhcp_binary.stat.executable
        fail_msg: >-
          preserve mode requires an existing executable /opt/cni/bin/dhcp;
          it will not install or repair CNI state.
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

    - name: Verify preserved CNI DHCP daemon is active
      ansible.builtin.command: systemctl is-active cni-dhcp.service
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

- name: Create or verify the Kubernetes control plane
  hosts: core_node
  become: true
  any_errors_fatal: true
  module_defaults:
    kubernetes.core.helm:
      chart_version: "{{ flannel_chart_version }}"
  pre_tasks:
    - name: Resolve the supported CNI plugin architecture
      ansible.builtin.set_fact:
        synthran_cni_arch: >-
          {{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else
             'arm64' if ansible_architecture in ['aarch64', 'arm64'] else '' }}
      when: synthran_host_preparation == 'fresh'
      tags: [synthran_fresh_only]

    - name: Require a pinned CNI artifact for this architecture
      ansible.builtin.assert:
        quiet: true
        that:
          - synthran_cni_arch | length > 0
          - synthran_cni_arch in cni_plugins_sha256
        fail_msg: >-
          No checksum-pinned CNI plugin bundle is defined for architecture
          {{ ansible_architecture }}.
      when: synthran_host_preparation == 'fresh'
      tags: [synthran_fresh_only]

    - name: Stage the checksum-verified CNI plugin bundle
      ansible.builtin.get_url:
        url: >-
          https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ synthran_cni_arch }}-v{{ cni_plugins_version }}.tgz
        dest: /tmp/cni-plugins.tgz
        mode: '0600'
        force: true
        checksum: "sha256:{{ cni_plugins_sha256[synthran_cni_arch] }}"
      when: synthran_host_preparation == 'fresh'
      tags: [synthran_fresh_only]
  roles:
    - role: setup/k8s/cluster_create
      when: synthran_host_preparation == 'fresh'
    - role: setup/k8s/cni_dhcp
      when: synthran_host_preparation == 'fresh'
    - role: setup/k8s/remove_cp_taint
      when: synthran_host_preparation == 'fresh'
  tasks:
    - name: Verify preserved Kubernetes control plane is reachable
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - --raw=/readyz
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

    - name: Verify preserved RAN node is registered
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - node
          - "{{ ran_node_name }}"
          - -o
          - name
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

- name: Join or verify the RAN host
  hosts: ran_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/cluster_join
      when:
        - synthran_host_preparation == 'fresh'
        - inventory_hostname != groups['core_node'][0]
    - role: setup/k8s/cni_dhcp
      when:
        - synthran_host_preparation == 'fresh'
        - inventory_hostname != groups['core_node'][0]

- name: Apply fresh cluster placement policy
  hosts: core_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/add_taint
      vars:
        target_node: "{{ ran_node_name }}"
      when:
        - synthran_host_preparation == 'fresh'
        - bridge_enabled
        - core_node_name != ran_node_name
    - role: setup/k8s/remove_taint
      vars:
        target_node: "{{ ran_node_name }}"
      when:
        - synthran_host_preparation == 'fresh'
        - core_node_name == ran_node_name

- name: Install or verify Multus and storage prerequisites
  hosts: core_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/cni
      when: synthran_host_preparation == 'fresh'
    - role: setup/storage
      when:
        - synthran_host_preparation == 'fresh'
        - core == 'open5gs' or core == 'free5gc'
  tasks:
    - name: Verify preserved NetworkAttachmentDefinition API
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - crd
          - network-attachment-definitions.k8s.cni.cncf.io
          - -o
          - name
      changed_when: false
      when: synthran_host_preparation == 'preserve'
      tags: [synthran_preserve_only]

- name: Apply fresh RAN-node CPU and kubelet tuning
  hosts: ran_node
  become: true
  any_errors_fatal: true
  roles:
    - role: setup/k8s/k8s_cpu_tuning
      when: synthran_host_preparation == 'fresh'

- name: Collect host bootstrap evidence
  hosts: sopnodes
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Read the effective containerd mount
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - SOURCE,FSTYPE,TARGET
          - /var/lib/containerd
      register: synthran_bootstrap_mount
      changed_when: false
      tags: [synthran_shared_invariant]

    - name: Read CNI DHCP daemon state
      ansible.builtin.command: systemctl is-active cni-dhcp.service
      register: synthran_bootstrap_cni_dhcp
      changed_when: false
      tags: [synthran_shared_invariant]

- name: Record bootstrap evidence with the deployment run
  hosts: core_node
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Read registered Kubernetes nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - nodes
          - -o
          - json
      register: synthran_bootstrap_cluster_nodes
      changed_when: false
      tags: [synthran_shared_invariant]

    - name: Initialize bootstrap node evidence
      ansible.builtin.set_fact:
        synthran_bootstrap_nodes: []
      tags: [synthran_shared_invariant]

    - name: Collect per-host bootstrap evidence
      ansible.builtin.set_fact:
        synthran_bootstrap_nodes: >-
          {{ synthran_bootstrap_nodes + [
               {'host': item,
                'storage': hostvars[item].storage | default(''),
                'containerd_mount': hostvars[item].synthran_bootstrap_mount.stdout | trim,
                'cni_dhcp': hostvars[item].synthran_bootstrap_cni_dhcp.stdout | trim}
             ] }}
      loop: "{{ groups['sopnodes'] | unique | list }}"
      tags: [synthran_shared_invariant]

    - name: Write shareable bootstrap evidence
      ansible.builtin.copy:
        content: >-
          {{ {'host_preparation': synthran_host_preparation,
               'nodes': synthran_bootstrap_nodes,
               'cluster_nodes': (synthran_bootstrap_cluster_nodes.stdout | from_json)}
             | to_nice_json }}
        dest: "{{ run_dir }}/bootstrap-evidence.json"
        mode: '0644'
      delegate_to: localhost
      become: false
      tags: [synthran_shared_invariant]
