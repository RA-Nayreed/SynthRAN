[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthran"
version = "0.1.0"
description = "Energy-aware 6G modeling over real 5G user planes"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=1.24", "pandas>=2", "simpy>=4", "PyYAML>=6", "paho-mqtt>=2"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "openpyxl>=3.0"]
deployment = ["ansible-core>=2.19,<2.20"]

[tool.setuptools.package-data]
synthran = ["data/*.csv"]

[tool.setuptools.packages.find]
include = ["synthran", "synthran.*"]
exclude = ["deployment*", "scenarios*", "results*", "third_party*"]
