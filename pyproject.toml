[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthran"
version = "0.1.0"
description = "Energy-aware 6G modeling over real 5G user planes"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
experiment = ["numpy==2.4.6", "pandas==3.0.5", "simpy==4.1.2", "paho-mqtt==2.1.0"]
analysis = ["matplotlib==3.11.1", "openpyxl==3.1.5"]
deployment = ["ansible-core==2.19.13"]

[tool.setuptools.package-data]
Experiment = ["data/*.csv", "configs/*.yml", "Ex*/*.json", "Ex*/*.yml", "Ex*/*.md", "deployment/**/*.yml", "deployment/**/*.j2"]
"Experiment.ambient_iot" = ["examples/*.yml", "examples/README.md"]

[tool.setuptools.packages.find]
include = ["synthran", "synthran.*", "Experiment", "Experiment.*"]
exclude = ["deployment*", "scenarios*", "results*", "third_party*"]
