---
- name: Validate the SynthRAN deployment boundary
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Require the locked golden-path inputs
      ansible.builtin.assert:
        that:
          - core == "open5gs"
          - ran == "srsRAN"
          - rru == "rfsim"
          - not monitoring_enabled | bool
          - core_node_name != ran_node_name
          - synthran_run_id is match("^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$")
          - ue_count | int == 1
        fail_msg: "unsupported or unsafe golden-path deployment inputs"

- name: Deploy the locked Open5GS core into the ready cluster
  hosts: core_node
  gather_facts: true
  vars:
    ansible_python_interpreter: /opt/synthran-venv/bin/python
    synthran_golden_path_guard: true
    repo_dest: "{{ ansible_env.HOME }}/.synthran/{{ synthran_run_id }}/open5gs-k8s"
    open5gs_root: "{{ repo_dest }}/open5gs"
  pre_tasks:
    - name: Load the locked default 5G profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/5g_profile_default.yaml"

    - name: Check the run-scoped Open5GS checkout path
      ansible.builtin.stat:
        path: "{{ repo_dest }}"
      register: synthran_open5gs_checkout

    - name: Refuse a reused remote Open5GS checkout
      ansible.builtin.assert:
        that:
          - not synthran_open5gs_checkout.stat.exists
        fail_msg: "run-scoped Open5GS checkout already exists"
  tasks:
    - name: Pin the upstream DNS helper inside the isolated worktree
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../roles/5g/open5gs/deploy/tasks/main.yml"
        regexp: "busybox:1\\.36"
        replace: "{{ synthran_images.busybox_1_36 }}"
      delegate_to: localhost
      run_once: true
      become: false

    - name: Prepare the locked Open5GS checkout and profile
      ansible.builtin.include_role:
        name: 5g/open5gs/config
        apply:
          no_log: true

    - name: Apply SynthRAN Open5GS image pins
      ansible.builtin.include_tasks: tasks/pin-open5gs-images.yml

    - name: Label the Open5GS namespace before workloads are created
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: open5gs
        state: present
        definition:
          metadata:
            labels:
              synthran.run/id: "{{ synthran_run_id }}"

    - name: Deploy Open5GS from the locked checkout
      ansible.builtin.include_role:
        name: 5g/open5gs/deploy
        apply:
          no_log: true

- name: Deploy one locked srsRAN RFSIM gNB and srsUE
  hosts: ran_node
  gather_facts: true
  vars:
    ansible_python_interpreter: /opt/synthran-venv/bin/python
    repo_dest: "{{ ansible_env.HOME }}/.synthran/{{ synthran_run_id }}/srsran-helm"
  pre_tasks:
    - name: Load the locked default 5G profile
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/5g_profile_default.yaml"

    - name: Check the run-scoped srsRAN checkout path
      ansible.builtin.stat:
        path: "{{ repo_dest }}"
      register: synthran_srsran_checkout

    - name: Refuse a reused remote srsRAN checkout
      ansible.builtin.assert:
        that:
          - not synthran_srsran_checkout.stat.exists
        fail_msg: "run-scoped srsRAN checkout already exists"
  tasks:
    - name: Prepare the locked srsRAN checkout and profile
      ansible.builtin.include_role:
        name: 5g/srsRAN/config
        apply:
          no_log: true

    - name: Apply the reviewed upstream RFSIM chart adaptations
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
        tasks_from: patch_charts.yml
        apply:
          no_log: true

    - name: Apply SynthRAN RFSIM image pins
      ansible.builtin.include_tasks: tasks/pin-srsran-images.yml

    - name: Deploy the single srsUE pod
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
        tasks_from: deploy_srsues.yml
        apply:
          no_log: true

    - name: Deploy the RFSIM gNB
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
        tasks_from: deploy_gnb.yml

    - name: Start the GNU Radio broker and one srsUE
      ansible.builtin.include_role:
        name: 5g/srsRAN/deploy
        tasks_from: start_broker.yml
        apply:
          no_log: true

- name: Attach the run ID to the deployed network resources
  hosts: core_node
  gather_facts: false
  tasks:
    - name: Label every namespaced golden-path resource
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - --namespace
          - open5gs
          - --overwrite
          - deployment,statefulset,daemonset,pod,service,configmap,secret,job,cronjob,persistentvolumeclaim
          - --all
          - "synthran.run/id={{ synthran_run_id }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true

    - name: Preserve the run ID on the namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - label
          - --overwrite
          - namespace
          - open5gs
          - "synthran.run/id={{ synthran_run_id }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: true
