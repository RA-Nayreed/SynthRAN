---
- name: Install exact SynthRAN Python dependencies on prepared nodes
  hosts: sopnodes
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    synthran_python: /opt/synthran-venv/bin/python
  tasks:
    - name: Create the dedicated SynthRAN Python environment
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -m
          - venv
          - /opt/synthran-venv
        creates: /opt/synthran-venv/bin/python

    - name: Install exact direct Python packages
      ansible.builtin.pip:
        name: "{{ synthran_remote_python_packages }}"
        executable: /opt/synthran-venv/bin/pip
        state: present

    - name: Verify exact direct Python package versions
      ansible.builtin.command:
        argv:
          - "{{ synthran_python }}"
          - -c
          - >-
            import importlib.metadata as m, json, sys;
            expected=json.loads(sys.argv[1]);
            observed={name:m.version(name) for name in expected};
            assert observed == expected, (observed, expected)
          - "{{ synthran_remote_python_expected | to_json }}"
      changed_when: false

- name: Install digest-locked Helm and yq on the RAN node
  hosts: ran_node
  gather_facts: false
  become: true
  tasks:
    - name: Create the locked tool staging directory
      ansible.builtin.file:
        path: "/opt/synthran-tools/{{ synthran_helm.version }}"
        state: directory
        mode: "0755"

    - name: Download the locked Helm archive
      ansible.builtin.get_url:
        url: "{{ synthran_helm.url }}"
        dest: "/opt/synthran-tools/helm-{{ synthran_helm.version }}.tar.gz"
        checksum: "{{ synthran_helm.sha256 }}"
        mode: "0644"

    - name: Extract the locked Helm archive
      ansible.builtin.unarchive:
        src: "/opt/synthran-tools/helm-{{ synthran_helm.version }}.tar.gz"
        dest: "/opt/synthran-tools/{{ synthran_helm.version }}"
        remote_src: true
        creates: "/opt/synthran-tools/{{ synthran_helm.version }}/linux-amd64/helm"

    - name: Install the locked Helm binary
      ansible.builtin.copy:
        src: "/opt/synthran-tools/{{ synthran_helm.version }}/linux-amd64/helm"
        dest: "{{ synthran_helm.path }}"
        remote_src: true
        mode: "0755"

    - name: Verify the locked Helm version
      ansible.builtin.command:
        argv:
          - "{{ synthran_helm.path }}"
          - version
          - --short
      register: synthran_helm_version
      changed_when: false
      failed_when: >-
        ('v' ~ synthran_helm.version) not in synthran_helm_version.stdout

    - name: Install the digest-locked yq binary
      ansible.builtin.get_url:
        url: "{{ synthran_yq.url }}"
        dest: "{{ synthran_yq.path }}"
        checksum: "{{ synthran_yq.sha256 }}"
        mode: "0755"

    - name: Verify the locked yq version
      ansible.builtin.command:
        argv:
          - "{{ synthran_yq.path }}"
          - --version
      register: synthran_yq_version
      changed_when: false
      failed_when: >-
        ('v' ~ synthran_yq.version) not in synthran_yq_version.stdout
