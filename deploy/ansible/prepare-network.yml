---
- name: Reconcile and verify SynthRAN GRE foundation
  hosts: sopnodes
  become: true
  gather_facts: false
  vars:
    synthran_peer_ip: >-
      {{ hostvars[groups['ran_node'][0]].ip
         if inventory_hostname in groups['core_node']
         else hostvars[groups['core_node'][0]].ip }}
    synthran_n3_peer: >-
      {{ '192.168.3.253'
         if inventory_hostname in groups['core_node']
         else '192.168.3.254' }}
    synthran_n4_peer: >-
      {{ '192.168.4.253'
         if inventory_hostname in groups['core_node']
         else '192.168.4.254' }}
    synthran_gre_tunnels:
      - bridge: n3br
        interface: gre-n3br
        key: '3'
      - bridge: n4br
        interface: gre-n4br
        key: '4'

  tasks:
    - name: Reconcile keyed GRE tunnels
      ansible.builtin.shell: |
        set -euo pipefail
        ovs-vsctl --if-exists del-port {{ item.bridge }} {{ item.interface }}
        ip link delete {{ item.interface }} 2>/dev/null || true
        ovs-vsctl add-port {{ item.bridge }} {{ item.interface }} \
          -- set interface {{ item.interface }} \
          type=gre \
          options:remote_ip={{ synthran_peer_ip }} \
          options:key={{ item.key }}
      args:
        executable: /bin/bash
      loop: "{{ synthran_gre_tunnels }}"

    - name: Verify keyed GRE tunnel datapath state
      ansible.builtin.shell: |
        set -euo pipefail
        ofport="$(ovs-vsctl get Interface {{ item.interface }} ofport)"
        error="$(ovs-vsctl get Interface {{ item.interface }} error)"
        options="$(ovs-vsctl get Interface {{ item.interface }} options)"
        test "$ofport" -gt 0
        test "$error" = "[]"
        printf '%s\n' "$options" | grep -F 'key="{{ item.key }}"' >/dev/null
        printf '%s\n' "$options" | grep -F 'remote_ip="{{ synthran_peer_ip }}"' >/dev/null
      args:
        executable: /bin/bash
      changed_when: false
      loop: "{{ synthran_gre_tunnels }}"

    - name: Verify N3 GRE peer reachability
      ansible.builtin.command:
        argv:
          - ping
          - -I
          - n3br
          - -c
          - '3'
          - -W
          - '1'
          - "{{ synthran_n3_peer }}"
      changed_when: false

    - name: Verify N4 GRE peer reachability
      ansible.builtin.command:
        argv:
          - ping
          - -I
          - n4br
          - -c
          - '3'
          - -W
          - '1'
          - "{{ synthran_n4_peer }}"
      changed_when: false

- name: Verify live RAN containerd storage
  hosts: ran_node
  become: true
  gather_facts: false
  tasks:
    - name: Verify containerd storage is mounted on the selected disk
      ansible.builtin.shell: |
        set -euo pipefail
        test "$(findmnt -n -o SOURCE /var/lib/containerd)" = "/dev/{{ storage }}"
        systemctl is-active --quiet containerd
      args:
        executable: /bin/bash
      changed_when: false
