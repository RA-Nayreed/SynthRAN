---
- name: Pin the RFSIM gNB image in the rendered chart
  ansible.builtin.lineinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '^\s*image:\s*"\{\{ .Values.image.repository \}\}:\{\{ .Values.image.tag \}\}"\s*$'
    line: '          image: "{{ synthran_images.srsran_gnb }}"'

- name: Pin the gNB log-helper image
  ansible.builtin.lineinfile:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '^\s*image:\s*busybox\s*$'
    line: '          image: "{{ synthran_images.busybox_1_36 }}"'

- name: Pin the single srsUE image in the rendered chart
  ansible.builtin.lineinfile:
    path: "{{ repo_dest_abs }}/charts/srsue/templates/deployment.yaml"
    regexp: '^\s*image:\s*"\{\{ .Values.image.repository \}\}:\{\{ .Values.image.tag \}\}"\s*$'
    line: '                image: "{{ synthran_images.srsran_ue }}"'

- name: Verify all three RFSIM image pins are present
  ansible.builtin.command:
    argv:
      - grep
      - --fixed-strings
      - --quiet
      - --
      - "{{ item.reference }}"
      - "{{ item.path }}"
  loop:
    - reference: "{{ synthran_images.srsran_gnb }}"
      path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    - reference: "{{ synthran_images.busybox_1_36 }}"
      path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    - reference: "{{ synthran_images.srsran_ue }}"
      path: "{{ repo_dest_abs }}/charts/srsue/templates/deployment.yaml"
  changed_when: false

- name: Add the run ID to both Helm label helpers
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "{{ '{{' }}/* {mark} SYNTHRAN RUN OWNERSHIP */{{ '}}' }}"
    insertafter: '^\{\{- define "srsran-(?:gnb|ue)\.selectorLabels" -\}\}$'
    block: |
      synthran.run/id: "{{ '{{' }} .Values.synthranRunId | quote {{ '}}' }}"
  loop:
    - "{{ repo_dest_abs }}/charts/srsran-gnb/templates/_helpers.tpl"
    - "{{ repo_dest_abs }}/charts/srsue/templates/_helpers.tpl"

- name: Add the run ID to both Helm resource-label helpers
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "{{ '{{' }}/* {mark} SYNTHRAN RESOURCE OWNERSHIP */{{ '}}' }}"
    insertafter: '^\{\{- define "srsran-(?:gnb|ue)\.labels" -\}\}$'
    block: |
      synthran.run/id: "{{ '{{' }} .Values.synthranRunId | quote {{ '}}' }}"
  loop:
    - "{{ repo_dest_abs }}/charts/srsran-gnb/templates/_helpers.tpl"
    - "{{ repo_dest_abs }}/charts/srsue/templates/_helpers.tpl"

- name: Put the run ID in both selected Helm values files
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^synthranRunId:"
    line: 'synthranRunId: "{{ synthran_run_id }}"'
    insertafter: EOF
  loop:
    - "{{ values_file }}"
    - "{{ repo_dest_abs }}/charts/srsue/values-rfsim.yaml"
