    enabled: true
    duration_minutes: 180
    image: ubuntu-jammy
  r2lab_reservation:
    enabled: true
    duration_minutes: 180
experiment:
  entrypoint: ../synthran/experiment_runner.py
  config: ../synthran/configs/r2lab-n300-qhats-sdr.yml
