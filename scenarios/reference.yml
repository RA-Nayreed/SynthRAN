deployment:
  core: open5gs
  ran: srsran
  platform: rfsim
  profile: default
  nodes: {core: sopnode-f2, ran: sopnode-f3, broker: sopnode-f2}
  ues: [uesim01, uesim02]
  reservation: {enabled: true, duration_minutes: 120, image: ubuntu-jammy}
  # Optional R2Lab FIT/PC hosts. These are prepared as experiment resources;
  # they do not gain a 5G user-plane path unless explicitly routed through a UE.
  r2lab_experiment_nodes:
    sensor: []
    edge: []
    rf_measurement: []
    image: ubuntu
model:
  engine: ambient_iot
  seed: 1
  duration_ms: 10000
  energy: {mode: hybrid, trace: "builtin:stable", units: uw, interpolation: linear, repeat: true, wpt_power_w: 0.000025}
  capacitor: {capacitance_f: 0.0003, series_resistance_ohm: 5000, leakage_resistance_ohm: 100000, initial_voltage_v: 0, timestep_seconds: 0.001}
  controller: {low_voltage_v: 1.3, high_voltage_v: 1.7}
  topology:
    frequency_hz: 924000000
    pathloss: macro
    nodes: {placement: {type: random_annulus, min_radius_m: 5, max_radius_m: 40}}
    base_station:
      x: 0
      y: 0
      height_m: 25
      sectors:
        - {azimuth_deg: 0, beamwidth_deg: 65, power_dbm: 46}
        - {azimuth_deg: 120, beamwidth_deg: 65, power_dbm: 46}
        - {azimuth_deg: 240, beamwidth_deg: 65, power_dbm: 46}
  propagation: {model: macro, los: true}
  protocol: {type: broadcast_sic, slots: 4, tx_duration_ms: 5, rx_duration_ms: 10}
  receiver: {sic: true, required_sinr_db: 3, cancellation_factor: 0.9, collision_window_ms: 5}
# Set broker_address when the broker node's default address is not reachable from N6.
mqtt: {port: 1883, qos: 1, topic_prefix: synthran, payload_bytes: 256, start_delay_seconds: 30}
devices:
  uesim01: {energy_mode: wpt, sensing_interval_ms: 1000}
  uesim02: {energy_mode: hybrid, sensing_interval_ms: 500}
