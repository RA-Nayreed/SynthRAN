deployment:
  core: free5gc
  ran: srsran
  platform: r2lab
  ru: n320
  profile: default
  nodes: {core: sopnode-f2, ran: sopnode-f3, broker: sopnode-f2}
  ues: [qhat20, qhat21, qfit07, qfit09]
  reservation: {enabled: true, duration_minutes: 180, image: ubuntu-jammy}
  r2lab_reservation: {enabled: true, duration_minutes: 180}
  r2lab_experiment_nodes:
    sensor: [fit03, fit04]
    edge: [fit05]
    rf_measurement: [pc01, pc02]
    image: ubuntu
model:
  engine: amber
  seed: 31
  duration_ms: 60000
  energy: {mode: hybrid, trace: "builtin:stable", units: uw, repeat: true, wpt_power_w: 0.000025}
  capacitor: {capacitance_f: 0.0003, series_resistance_ohm: 5000, leakage_resistance_ohm: 100000, initial_voltage_v: 0, timestep_seconds: 0.001}
  controller: {low_voltage_v: 1.3, high_voltage_v: 1.7}
  topology:
    frequency_hz: 924000000
    pathloss: macro
    nodes: {placement: {type: random_annulus, min_radius_m: 3, max_radius_m: 60}}
    base_station: {x: 0, y: 0, height_m: 25, sectors: [{azimuth_deg: 0, beamwidth_deg: 65, power_dbm: 46}, {azimuth_deg: 120, beamwidth_deg: 65, power_dbm: 46}, {azimuth_deg: 240, beamwidth_deg: 65, power_dbm: 46}]}
  propagation: {model: macro, los: true}
  protocol: {type: adaptive_aloha, slots: 16, tx_duration_ms: 5, rx_duration_ms: 10}
  receiver: {sic: true, required_sinr_db: 3, cancellation_factor: 0.9, collision_window_ms: 5}
mqtt: {port: 1883, qos: 1, topic_prefix: synthran/n320, payload_bytes: 512, start_delay_seconds: 45}
devices:
  qhat20: {energy_mode: hybrid, sensing_interval_ms: 1000}
  qhat21: {energy_mode: wpt, sensing_interval_ms: 750}
  qfit07: {energy_mode: hybrid, sensing_interval_ms: 500}
  qfit09: {energy_mode: hybrid, sensing_interval_ms: 250}
