<svg xmlns="http://www.w3.org/2000/svg" width="520" height="472" viewBox="0 0 520 472" role="img" aria-labelledby="title desc">
  <title id="title">SynthRAN — Model the source. Measure the network.</title>
  <desc id="desc">Energy-aware Ambient IoT, reproducible workloads, and virtual or physical 5G. Model energy into events, connect the network, and observe the outcome.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1829"/><stop offset="1" stop-color="#08111F"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#64E4C3"/><stop offset="1" stop-color="#8DAFFF"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="518" height="470" rx="18" fill="url(#bg)" stroke="#26364C"/>
  <path d="M20 1H500" stroke="url(#line)" stroke-width="2"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(28 29)" fill="none" stroke="#64E4C3" stroke-width="3" stroke-linecap="round">
      <path d="M0 16V7L8 2L16 7V25L24 30L32 25V16"/><path d="M8 11V21L16 26M24 21V11L16 6" opacity=".55"/>
    </g>
    <text x="76" y="54" fill="#EEF4FF" font-size="25" font-weight="700" letter-spacing="3">SYNTHRAN</text>
    <g fill="none" stroke="#365266">
      <circle cx="457" cy="43" r="23"/><path d="M427 43H441M473 43H489"/>
      <path d="M449 47L457 35L465 47" stroke="#64E4C3" stroke-width="2"/>
    </g>
    <text x="28" y="112" fill="#9CACBF" font-size="13" font-weight="600" letter-spacing="1.6">ENERGY-AWARE IoT × PROGRAMMABLE 5G</text>
    <text x="25" y="167" fill="#F2F6FF" font-size="38" font-weight="700" letter-spacing="-1.5">Model the source.</text>
    <text x="25" y="220" fill="#64E4C3" font-size="38" font-weight="700" letter-spacing="-1.5">Measure the network.</text>
    <text x="28" y="259" fill="#B2BED0" font-size="18">From intermittent sensor energy</text>
    <text x="28" y="285" fill="#B2BED0" font-size="18">to traceable network experiments.</text>
    <path d="M28 311H492" stroke="#27354A"/>
    <text x="28" y="346" fill="#64E4C3" font-size="14" font-weight="700" letter-spacing="1.3">01 / MODEL</text>
    <text x="215" y="346" fill="#CAD4E4" font-size="18">Energy → events</text>
    <text x="28" y="391" fill="#8DAFFF" font-size="14" font-weight="700" letter-spacing="1.3">02 / CONNECT</text>
    <text x="215" y="391" fill="#CAD4E4" font-size="18">Virtual or physical 5G</text>
    <text x="28" y="436" fill="#FFCE86" font-size="14" font-weight="700" letter-spacing="1.3">03 / OBSERVE</text>
    <text x="215" y="436" fill="#CAD4E4" font-size="18">Trace the outcome</text>
  </g>
</svg>
