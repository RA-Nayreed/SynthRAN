<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1110" viewBox="0 0 520 1110" role="img" aria-labelledby="title desc">
  <title id="title">SynthRAN architecture — two inputs, one traceable experiment</title>
  <desc id="desc">Independent source modeling and 5G deployment produce a frozen event trace and an accepted testbed. Experiment tooling replays events through gateway UEs, the gNB, core UPF, and an N6-side broker and collector. Reconciliation compares expected events with publication and receipt evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#70849C" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="518" height="1108" rx="18" fill="#0B1423" stroke="#26364C"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="24" y="36" fill="#A9B8CC" font-size="13" font-weight="600" letter-spacing="1.8">FROM ENERGY TO EVIDENCE</text>
    <text x="24" y="68" fill="#E5EDF9" font-size="23" font-weight="600">Two independent inputs</text>
    <rect x="24" y="91" width="448" height="172" rx="12" fill="#0F242B" stroke="#2A665E"/>
    <text x="44" y="122" fill="#64E4C3" font-size="14" font-weight="700" letter-spacing="1.2">01 / MODEL THE SOURCE</text>
    <text x="44" y="158" fill="#F0F5FF" font-size="22" font-weight="600">Energy → sensing → backscatter</text>
    <text x="44" y="188" fill="#B4C7CE" font-size="17">Simulated sensors · Collisions · SIC</text>
    <path d="M44 207H452" stroke="#2B514E"/>
    <text x="44" y="241" fill="#DDF3EC" font-size="22" font-weight="600">Frozen decoded-event trace</text>
    <rect x="24" y="287" width="448" height="172" rx="12" fill="#142137" stroke="#3A527D"/>
    <text x="44" y="318" fill="#8DAFFF" font-size="14" font-weight="700" letter-spacing="1.2">02 / DEPLOY THE TESTBED</text>
    <text x="44" y="354" fill="#F0F5FF" font-size="24" font-weight="600">Reserve → provision → verify</text>
    <text x="44" y="384" fill="#BAC8DF" font-size="17">deploy.sh · Software radio or R2Lab</text>
    <path d="M44 403H452" stroke="#304867"/>
    <text x="44" y="437" fill="#E2EBFF" font-size="22" font-weight="600">Accepted 5G deployment</text>
    <path d="M472 235H494V477H260V491" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M472 431H494" fill="none" stroke="#70849C" stroke-width="1.5"/>
    <circle cx="494" cy="431" r="2.5" fill="#70849C"/>
    <rect x="24" y="497" width="472" height="438" rx="12" fill="#101C2B" stroke="#35475E"/>
    <text x="44" y="528" fill="#E7EEF9" font-size="14" font-weight="700" letter-spacing="1.1">03 / REPLAY THROUGH THE USER PLANE</text>
    <rect x="44" y="550" width="432" height="74" rx="10" fill="#152B31" stroke="#2B625C"/>
    <text x="260" y="581" fill="#E5F7F2" font-size="24" font-weight="600" text-anchor="middle">Gateway UEs</text>
    <text x="260" y="607" fill="#9CBFB8" font-size="17" text-anchor="middle">Many sensors can share one gateway</text>
    <rect x="44" y="648" width="432" height="74" rx="10" fill="#192841" stroke="#3D567D"/>
    <text x="260" y="679" fill="#ECF2FF" font-size="24" font-weight="600" text-anchor="middle">gNB</text>
    <text x="260" y="705" fill="#ABBDD9" font-size="17" text-anchor="middle">5G radio access</text>
    <rect x="44" y="746" width="432" height="74" rx="10" fill="#192841" stroke="#3D567D"/>
    <text x="260" y="777" fill="#ECF2FF" font-size="24" font-weight="600" text-anchor="middle">Core / UPF</text>
    <text x="260" y="803" fill="#ABBDD9" font-size="17" text-anchor="middle">Forward user traffic</text>
    <rect x="44" y="844" width="432" height="74" rx="10" fill="#2B2630" stroke="#695742"/>
    <text x="260" y="875" fill="#FFF0D9" font-size="24" font-weight="600" text-anchor="middle">Broker + collector</text>
    <text x="260" y="901" fill="#D4BFA2" font-size="17" text-anchor="middle">N6-side receiving application</text>
    <path d="M260 624V642" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M260 722V740" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M260 820V838" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M260 935V965" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="24" y="971" width="472" height="113" rx="12" fill="#25222A" stroke="#62513F"/>
    <text x="44" y="1002" fill="#FFCE86" font-size="14" font-weight="700" letter-spacing="1.1">04 / RECONCILE THE EVIDENCE</text>
    <text x="44" y="1033" fill="#E8DCD0" font-size="19">Expected events · Publisher records · Receipts</text>
    <text x="44" y="1062" fill="#C7B498" font-size="17">Delivery, delay, and freshness measurements</text>
  </g>
</svg>
