<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="442" viewBox="0 0 1200 442" role="img" aria-labelledby="title desc">
  <title id="title">SynthRAN — Model the source. Measure the network.</title>
  <desc id="desc">A research platform connecting energy-aware Ambient-IoT models, reproducible workloads, and virtual or physical 5G testbeds. An abstract signal motif connects sensor events with network transport.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1829"/><stop offset="1" stop-color="#08111F"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#183E4B" stop-opacity=".8"/><stop offset="1" stop-color="#0B1423" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#6E8EA7" opacity=".16"/>
    </pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#64E4C3"/><stop offset="1" stop-color="#8DAFFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="440" rx="20" fill="url(#bg)" stroke="#26364C"/>
  <path d="M22 1H1178" stroke="url(#signal)" stroke-width="2"/>
  <rect x="708" y="18" width="465" height="330" fill="url(#dots)"/>
  <ellipse cx="954" cy="176" rx="260" ry="195" fill="url(#halo)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(48 39)" fill="none" stroke="#64E4C3" stroke-width="3" stroke-linecap="round">
      <path d="M0 16V7L8 2L16 7V25L24 30L32 25V16"/>
      <path d="M8 11V21L16 26M24 21V11L16 6" opacity=".55"/>
    </g>
    <text x="97" y="64" fill="#EEF4FF" font-size="26" font-weight="700" letter-spacing="3">SYNTHRAN</text>
    <text x="48" y="143" fill="#9CACBF" font-size="14" font-weight="600" letter-spacing="2.8">ENERGY-AWARE IoT × PROGRAMMABLE 5G</text>
    <text x="44" y="214" fill="#F2F6FF" font-size="66" font-weight="700" letter-spacing="-2">Model the source.</text>
    <text x="44" y="287" fill="#64E4C3" font-size="66" font-weight="700" letter-spacing="-2">Measure the network.</text>
    <text x="48" y="324" fill="#B2BED0" font-size="19">From intermittent sensor energy to traceable network experiments.</text>
    <g fill="none" stroke="#254153">
      <circle cx="996" cy="192" r="110"/><circle cx="996" cy="192" r="80"/>
      <path d="M832 87H900L927 122M806 176H887L919 176M851 291H916L947 265"/>
      <path d="M1076 192H1135M996 82V45M996 302V330"/>
    </g>
    <g fill="#0D202C" stroke="#64E4C3" stroke-width="1.5">
      <circle cx="832" cy="87" r="7"/><circle cx="806" cy="176" r="7"/><circle cx="851" cy="291" r="7"/>
    </g>
    <g fill="#64E4C3">
      <circle cx="927" cy="122" r="4"/><circle cx="919" cy="176" r="4"/><circle cx="947" cy="265" r="4"/>
    </g>
    <path d="M959 199V181L976 164L996 184L1016 164L1033 181V199L1016 216L996 196L976 216Z" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="996" cy="192" r="54" fill="none" stroke="#82A9F8" stroke-width="1.5" stroke-dasharray="3 7"/>
    <circle cx="1135" cy="192" r="5" fill="#8DAFFF"/>
    <circle cx="996" cy="82" r="4" fill="#8DAFFF"/>
    <path d="M48 357H1152" stroke="#27354A"/>
    <text x="48" y="396" fill="#64E4C3" font-size="13" font-weight="700" letter-spacing="1.6">01 / MODEL</text>
    <text x="173" y="396" fill="#CAD4E4" font-size="16">Energy → events</text>
    <path d="M389 380V408" stroke="#27354A"/>
    <text x="421" y="396" fill="#8DAFFF" font-size="13" font-weight="700" letter-spacing="1.6">02 / CONNECT</text>
    <text x="568" y="396" fill="#CAD4E4" font-size="16">Virtual or physical 5G</text>
    <path d="M819 380V408" stroke="#27354A"/>
    <text x="851" y="396" fill="#FFCE86" font-size="13" font-weight="700" letter-spacing="1.6">03 / OBSERVE</text>
    <text x="998" y="396" fill="#CAD4E4" font-size="16">Trace the outcome</text>
  </g>
</svg>
