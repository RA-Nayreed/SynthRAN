<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="736" viewBox="0 0 1200 736" role="img" aria-labelledby="title desc">
  <title id="title">SynthRAN architecture — two inputs, one traceable experiment</title>
  <desc id="desc">The Ambient-IoT model produces a frozen trace of decoded sensor events. Independently, deploy.sh provisions and attests a 5G testbed. Separate experiment tooling combines these inputs to replay events through gateway UEs, the gNB, the core UPF, and an N6-side MQTT broker and collector. Reconciliation compares expected events, publisher records, and application receipts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#70849C" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="734" rx="20" fill="#0B1423" stroke="#26364C"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="40" y="43" fill="#A9B8CC" font-size="14" font-weight="600" letter-spacing="2">FROM ENERGY TO EVIDENCE</text>
    <text x="1160" y="43" fill="#8597AF" font-size="14" text-anchor="end">Two independent inputs · Separate experiment tooling</text>

    <rect x="40" y="74" width="542" height="146" rx="12" fill="#0F242B" stroke="#2A665E"/>
    <text x="64" y="108" fill="#64E4C3" font-size="15" font-weight="700" letter-spacing="1.5">01 / MODEL THE SOURCE</text>
    <text x="64" y="147" fill="#F0F5FF" font-size="27" font-weight="600">Energy → sensing → backscatter</text>
    <text x="64" y="181" fill="#B4C7CE" font-size="19">Capacitor state · Channel access · Collision / SIC</text>
    <text x="64" y="205" fill="#83B0AA" font-size="16">Simulated Ambient-IoT sensors and reader</text>

    <rect x="618" y="74" width="542" height="146" rx="12" fill="#142137" stroke="#3A527D"/>
    <text x="642" y="108" fill="#8DAFFF" font-size="15" font-weight="700" letter-spacing="1.5">02 / DEPLOY THE TESTBED</text>
    <text x="642" y="147" fill="#F0F5FF" font-size="27" font-weight="600">Reserve → provision → verify</text>
    <text x="642" y="181" fill="#BAC8DF" font-size="19">Hosts · Kubernetes · Core / RAN · UE sessions</text>
    <text x="642" y="205" fill="#92AACC" font-size="16">deploy.sh · Software radio or R2Lab N300 / N320</text>

    <path d="M311 220V248" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M889 220V248" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="40" y="254" width="542" height="86" rx="12" fill="#101E2B" stroke="#2D514F"/>
    <text x="64" y="290" fill="#E1F6F0" font-size="24" font-weight="600">Frozen event trace</text>
    <text x="64" y="317" fill="#99B7B5" font-size="18">Decoded updates · Release times · IDs · Checksums</text>
    <rect x="618" y="254" width="542" height="86" rx="12" fill="#111E32" stroke="#304867"/>
    <text x="642" y="290" fill="#E2EBFF" font-size="24" font-weight="600">Accepted deployment</text>
    <text x="642" y="317" fill="#A0B1CC" font-size="18">Live attestation · UE bindings · Deployment identity</text>

    <path d="M311 340V370H195V388" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M889 340V388" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="40" y="394" width="1120" height="182" rx="12" fill="#101C2B" stroke="#35475E"/>
    <text x="64" y="426" fill="#E7EEF9" font-size="15" font-weight="700" letter-spacing="1.5">03 / REPLAY THROUGH THE 5G USER PLANE</text>
    <text x="1136" y="426" fill="#94A5BB" font-size="15" text-anchor="end">Experiment-controlled MQTT traffic</text>

    <rect x="64" y="450" width="248" height="86" rx="10" fill="#152B31" stroke="#2B625C"/>
    <text x="188" y="485" fill="#E5F7F2" font-size="23" font-weight="600" text-anchor="middle">Gateway UEs</text>
    <text x="188" y="515" fill="#9CBFB8" font-size="17" text-anchor="middle">Replay sensor updates</text>
    <rect x="340" y="450" width="248" height="86" rx="10" fill="#192841" stroke="#3D567D"/>
    <text x="464" y="485" fill="#ECF2FF" font-size="23" font-weight="600" text-anchor="middle">gNB</text>
    <text x="464" y="515" fill="#ABBDD9" font-size="17" text-anchor="middle">5G radio access</text>
    <rect x="616" y="450" width="248" height="86" rx="10" fill="#192841" stroke="#3D567D"/>
    <text x="740" y="485" fill="#ECF2FF" font-size="23" font-weight="600" text-anchor="middle">Core / UPF</text>
    <text x="740" y="515" fill="#ABBDD9" font-size="17" text-anchor="middle">Forward user traffic</text>
    <rect x="892" y="450" width="244" height="86" rx="10" fill="#2B2630" stroke="#695742"/>
    <text x="1014" y="485" fill="#FFF0D9" font-size="22" font-weight="600" text-anchor="middle">Broker + collector</text>
    <text x="1014" y="515" fill="#D4BFA2" font-size="17" text-anchor="middle">N6-side application</text>
    <path d="M312 493H335" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M588 493H611" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M864 493H887" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="64" y="557" fill="#8194AC" font-size="16">Many modeled sensors can share one gateway. The backscatter link is upstream of this 5G path.</text>

    <path d="M600 576V608" fill="none" stroke="#70849C" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="40" y="614" width="1120" height="90" rx="12" fill="#25222A" stroke="#62513F"/>
    <text x="64" y="649" fill="#FFCE86" font-size="15" font-weight="700" letter-spacing="1.5">04 / RECONCILE THE EVIDENCE</text>
    <text x="64" y="681" fill="#E8DCD0" font-size="22">Expected events + publisher records + application receipts</text>
    <text x="1136" y="650" fill="#C7B498" font-size="16" text-anchor="end">Delivery · Delay · Freshness</text>
    <text x="1136" y="681" fill="#AFA89F" font-size="16" text-anchor="end">Under the measurement contract</text>
  </g>
</svg>
