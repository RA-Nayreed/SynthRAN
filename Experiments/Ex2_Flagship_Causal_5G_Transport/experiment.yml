id: ex2
display_name: Experiment 2 — Causal 5G transport
design_version: 2
status: development

purpose: >-
  Test whether the temporal structure of an event-identical Ambient-IoT workload
  changes application delivery over the currently accepted 5G testbed under
  controlled competing traffic. The deployment is selected by the operator with
  deploy.sh, discovered from active-deployment.json, shown before execution, and
  frozen as provenance for one Experiment-2 campaign.

resource:
  type: active_testbed
  testbed_required: true
  active_deployment_access: read_only
  discovery: .synthran/active-deployment.json
  selection: operator_approved_current_deployment
  minimum_verified_ues: 2
  role_policy: >-
    The first verified UE binding is the workload gateway and the second is the
    competing-traffic UE. Core, RAN, radio unit, nodes, slices and UE identities
    are not prescribed by Experiment 2; they are recorded from the accepted
    deployment. A deployment change starts a new campaign rather than mixing
    testbeds inside one confirmation series.

study:
  source:
    upstream_experiment: ex1
    condition: knee-common
    source_seed_count: 30
    selection: newest complete local Experiment-1 campaign when preparing
    transferable_path: results/experiments/ex2-source
  timing:
    warmup_seconds: 10.0
    arms:
      - native
      - gap_permutation_r1
      - gap_permutation_r2
      - periodic
    invariants:
      - event identity and order
      - event count
      - sensor identity
      - serialized payload bytes
      - MQTT topic
      - source horizon
      - first and last measurement release
      - native gap multiset for both gap permutations
  transport_calibration:
    generator: paced UDP application payload
    packet_bytes: 1200
    probe_duration_seconds: 10
    repeats_per_rate: 3
    offered_payload_mbps_grid: [5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 120, 150, 200, 250]
    delivery_threshold: 0.98
    achieved_rate_fraction_min: 0.95
    achieved_rate_fraction_max: 1.05
    sender_errors_allowed: 0
    selection_rule: >-
      Every repeat must satisfy the prespecified sender validity contract: the
      measured application-payload rate is 95-105% of the requested rate and the
      sender reports no transmission errors. Using only rates whose complete
      repeat set is valid, ABOVE is the first ascending rate whose median
      end-to-end UDP delivery ratio is below 0.98, NEAR is the immediately
      preceding rate, and BELOW is the rate immediately preceding NEAR. Stop the
      ascending sweep after the first valid crossing. If the generator is invalid,
      no crossing is observed, or two valid predecessors are unavailable, retain
      all completed calibration evidence and block confirmation.
    interpretation: >-
      BELOW, NEAR and ABOVE are operational labels around a measured end-to-end
      UDP loss boundary. They do not identify the first onset of queueing, prove
      radio-link saturation, or locate the bottleneck without additional telemetry.
    base_port: 39001
  telemetry:
    access: read_only
    calibration_snapshots: [before, after]
    confirmation_snapshots: [session_before, resume, reservation_pause, session_after]
    host_roles: [ran, core, broker, workload_ue, competing_ue]
    evidence:
      - accepted deployment and UE binding provenance
      - workload and competing-UE routes to the N6 endpoint
      - interface packet/error/drop counters
      - selected kernel IP/TCP/UDP counters
      - queue-disciplines where exposed
      - relevant gNB/core process presence
      - relevant Kubernetes pod identity, readiness and restart counts where exposed
      - host uptime, load and clock-synchronization state
    interpretation: >-
      Telemetry is diagnostic evidence for infrastructure stability and possible
      bottleneck localization. It must not be treated as proof of radio-scheduler
      causality unless the required scheduler/resource counters are actually exposed
      and aligned with the replay interval.
  confirmation:
    source_seed_count: 30
    timing_arms: [native, gap_permutation_r1, gap_permutation_r2, periodic]
    load_levels: [below, near, above]
    expected_replays: 360
    sessions: 3
    seeds_per_session: 10
    within_block_order_seed: 20260913
    sentinel_every_replays: 12
    sentinel_min_fraction_of_calibrated_near_delivery: 0.98
    base_port: 39101
    sentinel_base_port: 39901
    reservation_safety_seconds: 180
    execution_policy: >-
      Run complete four-arm matched blocks while the current reservation has
      enough remaining coverage. Pause before a block that does not fit. Rerun
      experiment.sh after extending the same deployment reservation; completed
      run records are reused. A different deployment hash starts a new campaign.
  measurement:
    deadline_seconds: 0.5
    age_limit_seconds: 2.0
    clock_evidence: >-
      Before qualification and each confirmation session, bound workload-publisher
      versus broker UTC offset with controller-bracketed remote clock probes. The
      bound is retained with results and supplied to the measurement contract.
    clock_contract:
      require_publisher_ntp_synchronized: true
      require_broker_ntp_synchronized: true
      require_finite_nonnegative_uncertainty_bound: true
      policy: >-
        Cross-host timing execution is blocked when either endpoint does not
        report NTP synchronization or no finite nonnegative uncertainty bound can
        be retained. No arbitrary maximum uncertainty is declared in revision 2;
        the observed bound must be reported with the results and considered when
        interpreting the magnitude of any timing effect.
  statistics:
    experimental_unit: source_seed
    principal_outcomes:
      - conditional_scheduled_delay_p95_s
      - deadline_failure_fraction
    principal_contrasts:
      - native minus periodic
      - native minus mean of the two gap-permutation controls
    principal_contrast_ids:
      - native_minus_periodic
      - native_minus_mean_gap_permutation
    contrast_arm_requirements:
      native_minus_periodic: [native, periodic]
      native_minus_mean_gap_permutation: [native, gap_permutation_r1, gap_permutation_r2]
    exclusion_policy: >-
      Eligibility is contrast- and outcome-specific. A missing, clock-invalid or
      undefined gap-permutation arm excludes the native-versus-gap contrast only;
      it does not discard an otherwise valid native-versus-periodic contrast.
    confirmation_load_treatment_validity: >-
      Every replay is eligible only if its recorded competing-flow sender achieved
      95-105% of the frozen requested load and reported zero sender errors. An
      invalid load treatment excludes that arm only from contrasts that require it;
      it is not reclassified as successful evidence at another load level.
    load_interactions:
      near_minus_below: {comparison: near, reference: below}
      above_minus_below: {comparison: above, reference: below}
    interaction_policy: >-
      Estimate each load interaction within source seed as the timing contrast at
      the comparison load minus the same timing contrast at the reference load.
      Include only seeds for which that contrast is estimable at both loads.
    report_by_load: true
    permutation_arms_do_not_increase_n: true
    bootstrap_resamples: 10000
    bootstrap_seed: 62002
    confidence_intervals: pointwise percentile 95% bootstrap intervals
    multiplicity_adjustment: none
    practical_importance_policy: >-
      Statistical separation from zero is not evidence of practical importance,
      equivalence, or a smallest worthwhile effect. Such a claim requires an
      independently justified margin declared before interpreting confirmation data.

phases:
  - id: prepare
    name: Prepare the transferable matched source cohort
    resource: local
    campaign: false
    produces:
      - results/experiments/ex2-source/<upstream-campaign>/

  - id: qualification
    name: Qualify the accepted testbed and no-load delivery path
    resource: active_testbed
    produces:
      - qualification/
      - control/deployment.json
      - clock/qualification.json

  - id: calibration
    name: Calibrate below, near, and above competing-load levels
    resource: active_testbed
    requires: [qualification]
    produces:
      - calibration/load-selection.json
      - calibration/telemetry-before.json
      - calibration/telemetry-after.json

  - id: freeze
    name: Freeze deployment, source cohort, loads, sessions, and analysis design
    resource: active_testbed
    requires: [qualification, calibration]
    produces:
      - frozen-design.json

  - id: confirmation
    name: Run the 360 matched physical transport replays
    resource: active_testbed
    requires: [freeze]
    produces:
      - runs/
      - sessions/
      - sentinels/
      - sessions/session*/telemetry-*.json

  - id: analysis
    name: Analyze paired timing effects across calibrated load levels
    resource: local
    requires: [confirmation]
    produces:
      - analysis/summary.json
