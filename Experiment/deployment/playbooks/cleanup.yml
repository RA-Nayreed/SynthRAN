---
- name: Prepare local experiment cleanup artifacts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create the shareable experiment cleanup directory
      ansible.builtin.file:
        path: "{{ run_dir }}/experiment-cleanup"
        state: directory
        mode: '0755'

- name: Stop the SynthRAN receipt collector and retain partial broker evidence
  hosts: broker_node
  gather_facts: false
  become: true
  ignore_unreachable: true
  tasks:
    - name: Discover the SynthRAN receipt collector service
      ansible.builtin.service_facts:
      failed_when: false

    - name: Stop and disable the SynthRAN receipt collector
      ansible.builtin.systemd:
        name: synthran-collector
        state: stopped
        enabled: false
      when: "'synthran-collector.service' in (ansible_facts.services | default({}))"
      failed_when: false

    - name: Remove the SynthRAN receipt collector unit
      ansible.builtin.file:
        path: /etc/systemd/system/synthran-collector.service
        state: absent
      register: synthran_collector_unit
      failed_when: false

    - name: Reload systemd after removing the SynthRAN collector
      ansible.builtin.systemd:
        daemon_reload: true
      when: synthran_collector_unit is changed
      failed_when: false

    - name: Inspect the partial broker receipt artifact
      ansible.builtin.stat:
        path: "/var/log/synthran/receipts-{{ run_dir | basename }}.jsonl"
      register: synthran_receipt_file
      failed_when: false

    - name: Read partial broker receipts
      ansible.builtin.slurp:
        src: "/var/log/synthran/receipts-{{ run_dir | basename }}.jsonl"
      register: synthran_receipts
      when: synthran_receipt_file.stat.exists | default(false)
      failed_when: false

    - name: Retain partial broker receipts with the run
      ansible.builtin.copy:
        content: "{{ synthran_receipts.content | b64decode }}"
        dest: "{{ run_dir }}/broker.jsonl"
        mode: '0644'
      delegate_to: localhost
      become: false
      when:
        - synthran_receipts is defined
        - synthran_receipts.content is defined
      failed_when: false

    - name: Read bounded broker and collector service logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - mosquitto
          - -u
          - synthran-collector
          - -n
          - '300'
          - --no-pager
      register: synthran_broker_service_logs
      changed_when: false
      failed_when: false

    - name: Retain bounded broker and collector logs with the run
      ansible.builtin.copy:
        content: "{{ synthran_broker_service_logs.stdout | default('') }}\n"
        dest: "{{ run_dir }}/broker-services.log"
        mode: '0644'
      delegate_to: localhost
      become: false
      failed_when: false

- name: Stop current physical replay processes and retain partial publisher evidence
  hosts: physical_ues
  gather_facts: false
  become: true
  ignore_unreachable: true
  tasks:
    - name: Stop only publisher processes owned by this run
      ansible.builtin.command:
        argv:
          - /opt/synthran-venv/bin/python
          - -m
          - Experiment.workload.cleanup
          - --marker
          - "synthran-publisher-{{ run_dir | basename }}.jsonl"
      environment:
        PYTHONPATH: /opt/synthran-source
      changed_when: false
      failed_when: false

    - name: Inspect the current physical publisher artifact
      ansible.builtin.stat:
        path: "/var/log/synthran-publisher-{{ run_dir | basename }}.jsonl"
      register: synthran_physical_publisher_file
      failed_when: false

    - name: Read partial physical publisher records
      ansible.builtin.slurp:
        src: "/var/log/synthran-publisher-{{ run_dir | basename }}.jsonl"
      register: synthran_physical_publisher
      when: synthran_physical_publisher_file.stat.exists | default(false)
      failed_when: false

    - name: Retain partial physical publisher records with the run
      ansible.builtin.copy:
        content: "{{ synthran_physical_publisher.content | b64decode }}"
        dest: "{{ run_dir }}/publisher-{{ inventory_hostname }}.jsonl"
        mode: '0644'
      delegate_to: localhost
      become: false
      when:
        - synthran_physical_publisher is defined
        - synthran_physical_publisher.content is defined
      failed_when: false

- name: Stop current software replay processes and retain partial publisher evidence
  hosts: ran_node
  gather_facts: false
  become: true
  ignore_unreachable: true
  tasks:
    - name: Stop only this run's software publishers and read partial records
      ansible.builtin.shell: |
        set +e
        "$SYNTHRAN_KUBECTL" get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\t"}{range .spec.ephemeralContainers[*]}{.name}{" "}{end}{"\n"}{end}' 2>/dev/null |
        while IFS=$'\t' read -r ns pod containers; do
          case " $containers " in
            *" synthran-runtime "*)
              "$SYNTHRAN_KUBECTL" exec -n "$ns" "$pod" -c synthran-runtime -- \
                env PYTHONPATH=/opt/synthran-runtime python3 -m Experiment.workload.cleanup \
                --marker "publisher-${SYNTHRAN_RUN_ID}-" >/dev/null 2>&1 || true
              "$SYNTHRAN_KUBECTL" exec -n "$ns" "$pod" -c synthran-runtime -- \
                sh -c "cat /tmp/publisher-${SYNTHRAN_RUN_ID}-*.jsonl 2>/dev/null || true" \
                2>/dev/null || true
              ;;
          esac
        done
      args:
        executable: /bin/bash
      environment:
        SYNTHRAN_RUN_ID: "{{ run_dir | basename }}"
        SYNTHRAN_KUBECTL: "{{ kubectl_bin | default('/usr/bin/kubectl') }}"
      register: synthran_software_partial_publishers
      changed_when: false
      failed_when: false
      when: platform == 'rfsim'

    - name: Retain partial software publisher records with the run
      ansible.builtin.copy:
        content: "{{ synthran_software_partial_publishers.stdout }}\n"
        dest: "{{ run_dir }}/partial-software-publishers.jsonl"
        mode: '0644'
      delegate_to: localhost
      become: false
      when:
        - platform == 'rfsim'
        - synthran_software_partial_publishers is defined
        - synthran_software_partial_publishers.stdout | default('') | trim | length > 0
      failed_when: false
