---
- name: Install broker and Python runtime
  package:
    name: [mosquitto, python3, python3-pip, python3-venv]
    state: present
- name: Copy SynthRAN package
  copy: {src: "{{ run_dir }}/runtime/", dest: /opt/synthran-source/}
- name: Create isolated SynthRAN runtime
  command: python3 -m venv /opt/synthran-venv
  args: {creates: /opt/synthran-venv/bin/python}
- name: Install the lightweight MQTT collector dependency
  command: /opt/synthran-venv/bin/pip install --disable-pip-version-check "paho-mqtt>=2"
- name: Verify the collector does not require the numerical model runtime
  command: /opt/synthran-venv/bin/python -c "from Experiment.workload.replay import collect"
  environment:
    PYTHONPATH: /opt/synthran-source
  changed_when: false
- name: Configure N6-side MQTT listener
  copy:
    dest: /etc/mosquitto/conf.d/synthran.conf
    content: |
      listener {{ mqtt_port }} 0.0.0.0
      allow_anonymous true
  notify: Restart Mosquitto
- name: Create artifact directory
  file: {path: /var/log/synthran, state: directory, mode: '0755'}
- name: Discover existing receipt collector service
  service_facts:
- name: Stop any previous receipt collector
  systemd: {name: synthran-collector, state: stopped}
  when: "'synthran-collector.service' in ansible_facts.services"
- name: Remove the previous subscription-ready marker
  file: {path: /var/log/synthran/collector-ready.json, state: absent}
- name: Initialize receipt artifact
  copy: {content: "", dest: /var/log/synthran/receipts.jsonl, force: true}
- name: Start broker before collector
  service: {name: mosquitto, state: started, enabled: true}
- name: Apply pending broker configuration
  meta: flush_handlers
- name: Wait for N6-side broker listener
  wait_for: {host: 127.0.0.1, port: "{{ mqtt_port }}", timeout: 30}
- name: Install receipt collector unit
  copy:
    dest: /etc/systemd/system/synthran-collector.service
    content: |
      [Unit]
      After=mosquitto.service
      Requires=mosquitto.service
      [Service]
      Environment=PYTHONPATH=/opt/synthran-source
      ExecStart=/opt/synthran-venv/bin/python -m Experiment.cli workload collect --port {{ mqtt_port }} --topic {{ mqtt_topic_prefix }}/# --output /var/log/synthran/receipts.jsonl --ready-file /var/log/synthran/collector-ready.json
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
- name: Start receipt collector
  systemd: {name: synthran-collector, daemon_reload: true, state: restarted, enabled: true}
- name: Verify receipt collector is active
  command: systemctl is-active synthran-collector
  changed_when: false

- name: Require a successful receiving subscription before replay
  wait_for: {path: /var/log/synthran/collector-ready.json, state: present, timeout: 30}
- name: Retain the receiving subscription evidence
  fetch: {src: /var/log/synthran/collector-ready.json, dest: "{{ run_dir }}/collector-ready.json", flat: true}
