name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: git clone https://github.com/RA-Nayreed/Amber.git /tmp/amber-upstream
      - run: git -C /tmp/amber-upstream checkout 08dd6bd445e607ad3accf4e9a2dff51a499ebdf9
      - run: python tools/verify_amber_vendor.py /tmp/amber-upstream
