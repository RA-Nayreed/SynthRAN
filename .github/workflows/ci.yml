name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Check shell entrypoint syntax
        run: |
          bash -n deploy.sh
          bash -n experiment.sh

      - name: Compile Python sources
        run: python -m compileall -q synthran Experiments

      - name: Validate project metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data["project"]
          assert project["name"] == "synthran"
          assert project["version"]
          assert project["requires-python"]
          print(f"validated pyproject.toml for {project['name']} {project['version']}")
          PY

      - name: Install package and experiment runtime
        run: python -m pip install --disable-pip-version-check -e '.[experiment]'

      - name: Import SynthRAN package
        run: python -c "import synthran; print('synthran import OK')"

      - name: Validate experiment planner
        run: python -m synthran.experiments plan --experiment ex1 --phase all --dry-run

      - name: Run Experiment 1 qualification gate
        run: |
          python Experiments/Ex1_Energy_Correlation_and_Burst_Formation/qualification.py \
            --output "$RUNNER_TEMP/ex1-qualification"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "ex1-qualification/qualification.json").read_text()
          )
          assert result["status"] == "passed", result
          assert result["checks_failed"] == [], result
          print(f"qualification passed: {result['checks_passed']}/{result['checks_total']}")
          PY

      - name: Validate calibration selection contracts
        run: |
          python - <<'PY'
          import yaml
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import campaign
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import population_calibration

          manifest = yaml.safe_load(open(
              "Experiments/Ex1_Energy_Correlation_and_Burst_Formation/experiment.yml",
              encoding="utf-8",
          ))
          power_design = manifest["study"]["power_calibration"]
          active = [0.08, 0.21, 0.49, 0.79, 0.94]
          power_rows = [
              {"mean_power_w": power, "active_fraction_mean": fraction}
              for power, fraction in zip(power_design["candidate_mean_power_w"], active)
          ]
          power = campaign._select_power_points(power_rows, power_design)
          assert power["selected"]["low"]["mean_power_w"] == 0.0005, power
          assert power["selected"]["knee"]["mean_power_w"] == 0.001, power
          assert power["selected"]["high"]["mean_power_w"] == 0.002, power

          population_design = manifest["study"]["population_calibration"]
          collisions = [0.01, 0.04, 0.11, 0.22, 0.40]
          decode = [10.0, 20.0, 30.0, 27.0, 15.0]
          population_rows = [
              {
                  "sensor_count": count,
                  "collision_exposure_mean": collision,
                  "decode_rate_per_s_mean": rate,
                  "jain_decode_fairness_mean": 0.9,
              }
              for count, collision, rate in zip(
                  population_design["candidate_sensor_counts"], collisions, decode
              )
          ]
          population = population_calibration._select_population(
              population_rows, population_design
          )
          assert population["selected"]["sensor_count"] == 32, population
          print("calibration selection contracts OK")
          PY

      - name: Validate freeze and confirmation matrix contracts
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import confirmation
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import freeze

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / "calibration/power").mkdir(parents=True)
              (root / "calibration/population").mkdir(parents=True)
              (root / "campaign.json").write_text(json.dumps({
                  "schema_version": 1,
                  "campaign_id": "ci-freeze",
                  "experiment": "ex1",
                  "source_revision": "ci",
              }))
              (root / "calibration/power/selection.json").write_text(json.dumps({
                  "status": "selected",
                  "selected": {
                      "low": {"mean_power_w": 0.0005},
                      "knee": {"mean_power_w": 0.001},
                      "high": {"mean_power_w": 0.002},
                  },
              }))
              (root / "calibration/population/selection.json").write_text(json.dumps({
                  "status": "selected",
                  "selected": {"sensor_count": 32},
              }))
              design = freeze.run(root)
              freeze.validate(design)
              tasks = confirmation.build_tasks(root, design)
              assert len(design["confirmation"]["conditions"]) == 7
              assert len(design["confirmation"]["seeds"]) == 30
              assert design["confirmation"]["sensor_count"] == 32
              assert len(tasks) == 210
              assert len({task["name"] for task in tasks}) == 210
              print("freeze and confirmation matrix contracts OK")
          PY

      - name: Validate analysis metric contracts
        run: |
          python - <<'PY'
          import math
          from Experiments.Ex1_Energy_Correlation_and_Burst_Formation import analyze

          assert math.isclose(analyze._fano([0, 2, 0, 2]), 1.0)
          assert math.isclose(analyze._gap_cv([0.0, 1.0, 3.0]), 1 / 3)
          bursts = analyze._burst_stats([0.0, 0.5, 2.0, 2.4], 1.0)
          assert bursts["burst_count"] == 2, bursts
          assert bursts["burst_size_max"] == 2, bursts
          ci = analyze._bootstrap_ci([1.0, 2.0, 3.0], resamples=100, seed=7)
          assert ci["n_pairs"] == 3
          assert ci["ci95"][0] is not None and ci["ci95"][1] is not None
          print("analysis metric contracts OK")
          PY

      - name: Validate immutable archive lifecycle
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from synthran import archive

          settings = {
              "enabled": True,
              "backend": "s3",
              "alias": "slices",
              "bucket": "research-bucket",
              "prefix": "SynthRAN/experiments/ex1",
              "remote_verify": True,
          }
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "run"
              root.mkdir()
              science = root / "result.txt"
              science.write_text("scientific evidence\n")
              calls = {}
              archive._mc_binary = lambda: "fake-mc"

              def put(mc, local, remote, expected):
                  assert mc == "fake-mc"
                  assert archive._sha256(local) == expected
                  calls[remote] = expected

              archive._put_immutable = put
              result = archive.archive_directory(
                  root,
                  settings=settings,
                  experiment="ex1",
                  campaign_id="campaign-ci",
                  archive_kind="run",
                  archive_id="run-ci",
                  phase="confirmation",
                  source_revision="deadbeef",
                  remote_suffix="runs/run-ci",
              )
              assert result["archive_status"] == "VERIFIED", result
              assert (root / "_ARCHIVED.json").is_file()
              manifest = json.loads((root / "archive-manifest.json").read_text())
              assert manifest["files"]["result.txt"]["sha256"] == archive._sha256(science)
              assert not any("credential" in key.lower() for key in manifest)
              assert any(path.endswith("/_ARCHIVED.json") for path in calls)

              failed = Path(tmp) / "failed"
              failed.mkdir()
              retained = failed / "result.txt"
              retained.write_text("retain me\n")
              original = archive._sha256(retained)

              def fail_put(*args, **kwargs):
                  raise archive.ArchiveError("object store offline")

              archive._put_immutable = fail_put
              try:
                  archive.archive_directory(
                      failed,
                      settings=settings,
                      experiment="ex1",
                      campaign_id="campaign-ci",
                      archive_kind="run",
                      archive_id="run-failed",
                      phase="confirmation",
                      source_revision="deadbeef",
                      remote_suffix="runs/run-failed",
                  )
              except archive.ArchiveError:
                  pass
              else:
                  raise AssertionError("archive failure did not propagate")
              status = json.loads((failed / "archive-status.json").read_text())
              assert status["archive_status"] == "FAILED", status
              assert archive._sha256(retained) == original
              assert not (failed / "_ARCHIVED.json").exists()
              print("archive lifecycle contracts OK")
          PY

      - name: Validate accepted-testbed and experiment-eligibility contracts
        run: |
          python - <<'PY'
          import copy
          import json
          import tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          from synthran.cluster_identity import selected_cluster_runtime
          from synthran.deployment_state import content_hash
          from synthran.testbed_attachment import (
              AttachmentError,
              attach_active_deployment,
              prove_experiment_eligible,
          )

          digest_a = "sha256:" + "a" * 64
          digest_b = "sha256:" + "b" * 64
          digest_c = "sha256:" + "c" * 64
          digest_d = "sha256:" + "d" * 64
          values_a = "1" * 64
          values_b = "2" * 64

          def pod(name, labels, container, image_id):
              return {
                  "name": name,
                  "labels": labels,
                  "phase": "Running",
                  "ready": True,
                  "containers": [{
                      "kind": "container",
                      "name": container,
                      "configured_image": f"example/{container}:ci",
                      "runtime_image_id": "containerd://" + image_id,
                      "ready": True,
                  }],
              }

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              private = root / "private"
              result = root / "deployment-result"
              private.mkdir()
              result.mkdir()
              (private / "inventory.yml").write_text("all: {}\n")
              (private / "deployment-vars.yml").write_text("{}\n")

              deployment = {
                  "core": "open5gs",
                  "ran": "srsran",
                  "platform": "rfsim",
                  "radio_unit": "rfsim",
                  "network_profile": "ci",
                  "network_profile_hash": "sha256:" + "9" * 64,
                  "bridge_enabled": True,
                  "nodes": {"core": "f2", "ran": "f3", "broker": "f2"},
                  "topology": {"namespace": "open5gs"},
                  "slices": [
                      {
                          "name": "default",
                          "sst": "1",
                          "sd": "000001",
                          "dnn": "internet",
                          "ip_prefix": "12.1.1",
                      }
                  ],
                  "ues": [
                      {
                          "device": "uesim01",
                          "index": 1,
                          "imsi": "001010000000001",
                          "slice": "default",
                          "sst": "1",
                          "sd": "000001",
                          "dnn": "internet",
                          "address_cidr": "12.1.1.0/24",
                          "tunnel": {
                              "namespace": "open5gs",
                              "interface": "tun_srsue1",
                          },
                      }
                  ],
              }
              configuration_hash = content_hash(deployment)
              snapshot = {
                  "schema_version": 3,
                  "namespace": "open5gs",
                  "cluster_attestation": {"configuration_hash": configuration_hash},
                  "pods": [
                      pod("open5gs-amf", {"nf": "amf"}, "amf", digest_a),
                      pod("srsran-gnb", {"app": "srsran", "component": "gnb"}, "gnb", digest_b),
                      pod("srsran-ue", {"app": "srsran", "component": "ue"}, "ue", digest_c),
                      {
                          "name": "unrelated-debug",
                          "labels": {"app": "unrelated"},
                          "phase": "Pending",
                          "ready": False,
                          "containers": [{
                              "kind": "container",
                              "name": "debug",
                              "configured_image": "example/debug:latest",
                              "runtime_image_id": "",
                              "ready": False,
                          }],
                      },
                  ],
                  "helm_releases": [
                      {
                          "name": "srsran-gnb",
                          "status": "deployed",
                          "chart": "srsran-gnb-0.1.0",
                          "app_version": "ci",
                          "values_sha256": values_a,
                      },
                      {
                          "name": "srsran-ue",
                          "status": "deployed",
                          "chart": "srsran-ue-0.1.0",
                          "app_version": "ci",
                          "values_sha256": values_b,
                      },
                      {
                          "name": "unrelated",
                          "status": "failed",
                          "chart": "unrelated-1.0.0",
                          "app_version": "ci",
                          "values_sha256": "0" * 64,
                      },
                  ],
              }
              cluster_runtime = selected_cluster_runtime(deployment, snapshot)
              implementation = {
                  "schema_version": 1,
                  "reviewed_sources": {"lifecycle": {"commit": "0" * 40}},
                  "selected_adapter": {"sha256": digest_d, "file_count": 1},
                  "selected_runtime": {},
                  "cluster_runtime": cluster_runtime,
              }
              deployment_hash = content_hash({
                  "deployment": deployment,
                  "implementation": implementation,
              })
              implementation_hash = content_hash(implementation)
              now = datetime.now(timezone.utc).isoformat()

              identity = root / "active.json"
              evidence = root / "evidence.json"
              endpoint = root / "endpoint.json"
              identity.write_text(json.dumps({
                  "schema_version": 2,
                  "acceptance_schema_version": 1,
                  "status": "accepted-testbed",
                  "configuration_hash": configuration_hash,
                  "deployment_hash": deployment_hash,
                  "implementation": implementation,
                  "deployment": deployment,
                  "accepted_at": now,
                  "acceptance_evidence": {
                      "observed_at": now,
                      "implementation_identity_sha256": implementation_hash,
                  },
              }))
              binding = {
                  "device": "uesim01",
                  "index": 1,
                  "imsi": "001010000000001",
                  "slice": "default",
                  "sst": "1",
                  "sd": "000001",
                  "dnn": "internet",
                  "namespace": "open5gs",
                  "interface": "tun_srsue1",
                  "address": "12.1.1.2",
                  "software_verified": True,
                  "user_plane": {
                      "verified": True,
                      "method": "icmp_echo",
                      "source_interface": "tun_srsue1",
                      "source_address": "12.1.1.2",
                      "target_address": "12.1.1.1",
                      "observed_at": now,
                  },
              }
              accepted_evidence = {
                  "configuration_hash": configuration_hash,
                  "deployment_hash": deployment_hash,
                  "implementation_identity_sha256": implementation_hash,
                  "cluster_identity_verified": True,
                  "bindings": [binding],
                  "observed_at": now,
              }
              evidence.write_text(json.dumps(accepted_evidence))
              endpoint.write_text(json.dumps({
                  "schema_version": 2,
                  "status": "accepted-testbed",
                  "configuration_hash": configuration_hash,
                  "deployment_hash": deployment_hash,
                  "run_id": "ci-deployment",
                  "identity_file": str(identity),
                  "evidence_file": str(evidence),
                  "private_execution_dir": str(private),
                  "result_dir": str(result),
                  "published_at": now,
              }))

              requirements = {
                  "core": "open5gs",
                  "ran": ["srsran", "oai"],
                  "platform": "rfsim",
                  "radio_unit": "rfsim",
                  "nodes": {"core": "f2", "ran": "f3"},
                  "ue_devices": ["uesim01"],
                  "exact_ue_devices": True,
                  "ues": [{
                      "device": "uesim01",
                      "dnn": "internet",
                      "interface": "tun_srsue1",
                  }],
                  "slices": [{"name": "default", "dnn": "internet"}],
              }
              attached = attach_active_deployment(requirements, endpoint_path=endpoint)
              assert attached["status"] == "accepted-testbed-attached", attached
              assert attached["experiment_eligible"] is False, attached
              assert attached["mode"] == "read_only", attached
              assert attached["deployment_hash"] == deployment_hash, attached

              try:
                  attach_active_deployment({"ran": "oai"}, endpoint_path=endpoint)
              except AttachmentError:
                  pass
              else:
                  raise AssertionError("incompatible accepted deployment was not rejected")

              bad_evidence = copy.deepcopy(accepted_evidence)
              bad_evidence["implementation_identity_sha256"] = "sha256:" + "0" * 64
              evidence.write_text(json.dumps(bad_evidence))
              try:
                  attach_active_deployment(endpoint_path=endpoint)
              except AttachmentError:
                  pass
              else:
                  raise AssertionError("wrong implementation evidence was accepted")
              evidence.write_text(json.dumps(accepted_evidence))

              fresh_evidence = root / "experiment-eligibility-evidence.json"
              fresh_cluster = root / "experiment-eligibility-cluster.json"
              fresh_evidence.write_text(json.dumps(accepted_evidence))
              fresh_cluster.write_text(json.dumps(snapshot))
              eligible = prove_experiment_eligible(
                  fresh_evidence,
                  requirements,
                  endpoint_path=endpoint,
                  max_age_seconds=120,
              )
              assert eligible["status"] == "experiment-eligible", eligible
              assert eligible["experiment_eligible"] is True, eligible

              drifted = copy.deepcopy(snapshot)
              drifted["pods"][1]["containers"][0]["runtime_image_id"] = "containerd://" + digest_d
              fresh_cluster.write_text(json.dumps(drifted))
              try:
                  prove_experiment_eligible(
                      fresh_evidence,
                      requirements,
                      endpoint_path=endpoint,
                      max_age_seconds=120,
                  )
              except AttachmentError:
                  pass
              else:
                  raise AssertionError("selected runtime image drift was not rejected")

              fresh_cluster.write_text(json.dumps(snapshot))
              stale = copy.deepcopy(accepted_evidence)
              stale["observed_at"] = "2000-01-01T00:00:00+00:00"
              fresh_evidence.write_text(json.dumps(stale))
              try:
                  prove_experiment_eligible(
                      fresh_evidence,
                      requirements,
                      endpoint_path=endpoint,
                      max_age_seconds=120,
                  )
              except AttachmentError:
                  pass
              else:
                  raise AssertionError("stale experiment eligibility evidence was accepted")

              print("accepted-testbed and experiment-eligibility contracts OK")
          PY

      - name: Parse versioned YAML and citation metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path("synthran/configs/reference.yml")]
          paths += sorted(Path("deployment/group_vars/all").glob("network_profile_*.yaml"))
          paths.append(Path("deployment/group_vars/all/ue_catalog.yaml"))
          paths.append(Path("Experiments/Ex1_Energy_Correlation_and_Burst_Formation/experiment.yml"))
          paths.append(Path("CITATION.cff"))

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"missing expected configuration: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)

          print(f"parsed {len(paths)} YAML/CFF files")
          PY

      - name: Enforce repository presentation boundaries
        run: |
          if [[ -d scenarios ]]; then
            echo "The duplicated scenarios/ catalog must not be reintroduced" >&2
            exit 1
          fi
          if grep -qE 'readme-(hero|architecture).*\.svg' README.md; then
            echo "README still references removed presentation artwork" >&2
            exit 1
          fi
