name: OAI RFSIM UE contract

on:
  pull_request:
    branches:
      - rework
    paths:
      - 'synthran/deployment_state.py'
      - 'deployment/group_vars/all/network_profile_default.yaml'
      - 'deployment/group_vars/all/ue_catalog.yaml'
      - 'deployment/roles/5g/oai/**'
      - 'deployment/scripts/probe_software_ues.py'
      - 'deployment/playbooks/verify_live_testbed.yml'
      - 'tools/check_oai_rfsim_ue_contract.py'
      - '.github/workflows/oai-rfsim-ue-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract dependencies
        run: python -m pip install PyYAML

      - name: Compile OAI RFSIM acceptance code
        run: |
          python -m py_compile \
            synthran/deployment_state.py \
            deployment/scripts/probe_software_ues.py \
            tools/check_oai_rfsim_ue_contract.py

      - name: Validate selected OAI RFSIM UE authority
        env:
          PYTHONPATH: .
        run: python tools/check_oai_rfsim_ue_contract.py
