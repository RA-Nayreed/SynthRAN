name: Apply colocated broker frontend patch

on:
  push:
    branches:
      - fix/colocate-broker-with-core

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Colocate broker with core in interactive frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/colocate-broker-with-core
          fetch-depth: 0

      - name: Patch interactive broker placement
        shell: python
        run: |
          from pathlib import Path

          path = Path('deploy.sh')
          text = path.read_text()

          old_prompt = '  choose_sop_node "broker" "$DEFAULT_BROKER_NODE"; SELECTED_BROKER_NODE="$SELECTED_NODE"\n'
          new_prompt = '  SELECTED_BROKER_NODE="$SELECTED_CORE_NODE"\n'
          old_summary = '  echo "  Broker:   $SELECTED_BROKER_NODE"\n'

          if text.count(old_prompt) != 1:
              raise SystemExit(f'expected exactly one broker prompt, found {text.count(old_prompt)}')
          if text.count(old_summary) != 1:
              raise SystemExit(f'expected exactly one broker summary line, found {text.count(old_summary)}')

          text = text.replace(old_prompt, new_prompt)
          text = text.replace(old_summary, '')
          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.sh
          git diff --cached --check
          git commit -m "Colocate broker with core in interactive frontend"
          git push origin HEAD:fix/colocate-broker-with-core
